label{display:block;font-size:12px;color:#c7cbc8;margin-bottom:5px;font-weight:800}.sizebox select{width:100%;height:42px;background:#0f1210;border:1px solid #4a514c;color:#fff;border-radius:9px;padding:0 10px;font:inherit}.note{margin-top:7px;font-size:11px;color:#8e9691}.pages{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin:28px}.pages button{background:#171b19;border:1px solid #3a403c;color:#fff;border-radius:8px;padding:8px 11px;cursor:pointer}.pages button:disabled{opacity:.35}.pages button.active{background:#f5b900;color:#111}@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:540px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.actions{width:100%;flex-direction:column}.btn{justify-content:center;width:100%;box-sizing:border-box}}</style></head><body><main class="wrap"><div class="top"><h2>عظیم ابزار — محصولات</h2><div class="actions"><a class="btn contact" href="./contact.html">✉ ارتباط با ما</a><a class="btn back" href="./index.html?home=1&amp;v=20260917-pdf-price-4">← صفحه اصلی</a><div class="badge" id="badge">در حال بارگذاری</div></div></div><div class="source">قیمت همه محصولات و سایز/مدل‌های دارای گزینه، از «لیست قیمت بروزرسانی شده با ۲۰٪ افزایش قیمت» گرفته می‌شود. قیمت پایه از فایل قیمت محصولات و قیمت هر گزینه از داده سایز/مدل همان PDF خوانده می‌شود.</div><div class="tools"><input id="q" placeholder="جستجوی نام یا شناسه محصول..." autocomplete="off"></div><div id="status" class="status">در حال آماده‌سازی محصولات...</div><div id="grid" class="grid"></div><div id="pages" class="pages"></div></main><script>const PER=36,VERSION='20260917-pdf-price-4',P0008=[['E6 × E8',5040000],['E7 × E11',5040000],['E10 × E12',5040000],['E14 × E18',5040000],['E16 × E22',8040000]];let all=[],q='',page=1,priceData={},basePrices={};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]||m));const fmt=n=>new Intl.NumberFormat('fa-IR').format(Number(n)||0);const priceHtml=n=>Number(n)>0?`${fmt(n)} <small>تومان</small>`:'<span>قیمت در لیست درج نشده</span>';async function fetchJSON(url,label){const c=new AbortController(),timer=setTimeout(()=>c.abort(),15000);try{const r=await fetch(url+'?v='+VERSION,{cache:'no-store',signal:c.signal});if(!r.ok)throw Error(label+' HTTP '+r.status);return await r.json()}catch(e){if(e.name==='AbortError')throw Error(label+' بعد از ۱۵ ثانیه پاسخ نداد');throw e}finally{clearTimeout(timer)}}async function init(){const [products,variants,prices]=await Promise.all([fetchJSON('./catalog_site_mapping_908/products.json','کاتالوگ'),fetchJSON('./catalog_site_mapping_908/price-size-data.json','فایل سایز و قیمت'),fetchJSON('./catalog_site_mapping_908/prices.json','فایل قیمت محصولات')]);if(!Array.isArray(products)||products.length!==908)throw Error('کاتالوگ باید ۹۰۸ محصول داشته باشد');if(!variants||typeof variants!=='object'||Object.keys(variants).length!==908)throw Error('داده سایز و قیمت باید ۹۰۸ شناسه داشته باشد');if(!prices||typeof prices!=='object'||Object.keys(prices).length!==908)throw Error('داده قیمت باید ۹۰۸ شناسه داشته باشد');all=products.map(x=>({id:String(x.id||'').trim().toUpperCase(),name:String(x.name||'').trim(),image:String(x.image||'').trim()}));if(new Set(all.map(x=>x.id)).size!==908)throw Error('شناسه‌های کاتالوگ تکراری است');priceData=variants;basePrices=prices;render()}function getData(id){const d=priceData[id]||{};let vs=Array.isArray(d.v)?d.v:[];if(id==='P0008'&&!vs.length)vs=P0008;const fallback=basePrices[id]??null;return{vs,base:(d.p!=null?d.p:fallback)}}function optionLabel(v){return v[1]==null?`${v[0]} — قیمت درج نشده`:`${v[0]} — ${fmt(v[1])} تومان`}function card(x){const d=getData(x.id),vs=d.vs,nums=vs.map(v=>Number(v[1])).filter(n=>Number.isFinite(n)&&n>0),shown=nums.length?`از ${priceHtml(Math.min(...nums))}`:priceHtml(d.base),select=vs.length?`<div class="sizebox"><label>انتخاب سایز / مدل</label><select data-id="${esc(x.id)}">${vs.map((v,i)=>`<option value="${i}">${esc(optionLabel(v))}</option>`).join('')}</select><div class="note">قیمت هر گزینه دقیقاً مطابق لیست قیمت منبع است.</div></div>`:'';return `<article class="card"><div class="photo"><img src="${esc(x.image)}" alt="${esc(x.name)}" loading="lazy" onerror="this.style.display='none';this.parentElement.innerHTML='<div class=missing>تصویر ${esc(x.id)} پیدا نشد</div>'"></div><div class="name">${esc(x.name)}</div><div class="code">شناسه ${esc(x.id)}</div><div class="price" data-price="${esc(x.id)}">${shown}</div>${select}</article>`}function bind(){document.querySelectorAll('select[data-id]').forEach(s=>s.addEventListener('change',()=>{const id=s.dataset.id,v=getData(id).vs[Number(s.value)],e=document.querySelector('[data-price="'+id+'"]');if(e)e.innerHTML=priceHtml(v?.[1])}))}function render(){const term=q.toLocaleLowerCase('fa'),filtered=all.filter(x=>!term||(`${x.id} ${x.name}`).toLocaleLowerCase('fa').includes(term)),total=Math.max(1,Math.ceil(filtered.length/PER));page=Math.min(page,total);const rows=filtered.slice((page-1)*PER,page*PER);document.getElementById('badge').textContent=fmt(all.length)+' محصول';document.getElementById('status').innerHTML=`نمایش <b>${fmt(rows.length)}</b> از <b>${fmt(filtered.length)}</b> محصول · مجموع <b>${fmt(all.length)}</b> محصول`;document.getElementById('grid').innerHTML=rows.map(card).join('');bind();const p=document.getElementById('pages');p.innerHTML='';const prev=document.createElement('button');prev.textContent='قبلی';prev.disabled=page===1;prev.onclick=()=>{page--;render()};p.appendChild(prev);for(let i=Math.max(1,page-2);i<=Math.min(total,page+2);i++){const b=document.createElement('button');b.textContent=fmt(i);if(i===page)b.className='active';b.onclick=()=>{page=i;render()};p.appendChild(b)}const next=document.createElement('button');next.textContent='بعدی';next.disabled=page===total;next.onclick=()=>{page++;render()};p.appendChild(next)}document.getElementById('q').addEventListener('input',e=>{q=e.target.value.trim();page=1;render()});init().catch(e=>{document.getElementById('status').textContent='خطا در بارگذاری کاتالوگ: '+e.message})</script></body></html>
