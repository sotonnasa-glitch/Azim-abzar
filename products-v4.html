<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>محصولات | عظیم ابزار</title><style>body{margin:0;background:#0b0d0c;color:#fff;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1320px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;background:#171b19;border:1px solid #3a403c;color:#fff;border-radius:10px;padding:10px 14px;font:inherit;font-weight:900;text-decoration:none}.gold{background:#f5b900;border-color:#f5b900;color:#111}.badge{background:#f5b900;color:#111;padding:8px 12px;border-radius:9px;font-weight:900}.source{margin:12px 0;padding:12px;background:#111513;border:1px solid #303632;border-radius:10px;color:#b9bfbb}.tools{margin:18px 0 10px}input{box-sizing:border-box;width:100%;height:46px;background:#151917;border:1px solid #353b37;border-radius:10px;color:#fff;padding:0 13px;font:inherit}.status{color:#aaa;margin:10px 0 16px}.status b{color:#f5b900}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#151917;border:1px solid #303632;border-radius:15px;padding:12px;min-height:390px}.photo{width:100%;aspect-ratio:4/3;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:9px}.photo img{width:100%;height:100%;object-fit:contain}.missing{font-size:12px;color:#666;background:#f4f4f4;padding:15px;border-radius:8px;text-align:center}.name{font-size:15px;font-weight:800;line-height:1.8}.variantLabel{display:block;margin-top:9px;margin-bottom:5px;font-size:11px;color:#aaa;font-weight:800}.sizeSelect{box-sizing:border-box;width:100%;height:38px;background:#101412;border:1px solid #3a403c;border-radius:9px;color:#fff;padding:0 9px;font:inherit;font-size:12px}.price{margin-top:10px;font-size:17px;font-weight:900;color:#f5b900}.price small{font-size:11px;color:#aaa;font-weight:700}.code{font-size:10px;color:#727973;margin-top:8px}.pages{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin:28px}.pages button{background:#171b19;border:1px solid #3a403c;color:#fff;border-radius:8px;padding:8px 11px;cursor:pointer}.pages button:disabled{opacity:.35;cursor:not-allowed}.pages button.active{background:#f5b900;color:#111}@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:540px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.actions{width:100%;flex-direction:column}.btn{justify-content:center}}
</style></head><body><main class="wrap"><div class="top"><h2>عظیم ابزار — محصولات</h2><div class="actions"><a class="btn gold" href="./contact.html">✉ ارتباط با ما</a><a class="btn" href="./index.html?home=1&amp;v=20260917">← صفحه اصلی</a><div class="badge" id="badge">در حال بارگذاری</div></div></div><div class="source">قیمت‌های لیست بروزرسانی‌شده با ۲۰٪ افزایش قیمت به تفکیک سایز نمایش داده می‌شوند؛ هرجا لیست چند سایز داشته باشد، سایز را انتخاب کنید تا قیمت همان سایز نمایش داده شود.</div><div class="tools"><input id="q" aria-label="جستجوی نام یا شناسه محصول" placeholder="جستجوی نام یا شناسه محصول..." autocomplete="off"></div><div id="status" class="status" aria-live="polite">در حال آماده‌سازی محصولات...</div><div id="grid" class="grid"></div><div id="pages" class="pages" aria-label="صفحه‌بندی محصولات"></div></main><script>const PER=36,pageData='./catalog_site_mapping_908/products.json?v=20260917-size',priceData='./catalog_site_mapping_908/prices.json?v=20260917-size',variantData='./catalog_site_mapping_908/product_sizes.deflate.b64?v=20260917-size';let all=[],q='',page=1,variants={};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]||m));const fmt=n=>new Intl.NumberFormat('fa-IR').format(Number(n)||0);const decode64=s=>Uint8Array.from(atob(s.trim()),c=>c.charCodeAt(0));async function decompressB64(s){const ds=new DecompressionStream('deflate');const stream=new Blob([decode64(s)]).stream().pipeThrough(ds);return JSON.parse(await new Response(stream).text())}async function init(){const [pr,px,vx]=await Promise.all([fetch(pageData,{cache:'no-store'}),fetch(priceData,{cache:'no-store'}),fetch(variantData,{cache:'no-store'})]);if(!pr.ok)throw Error('فایل کاتالوگ پیدا نشد');if(!px.ok)throw Error('فایل قیمت پیدا نشد');if(!vx.ok)throw Error('فایل سایزها پیدا نشد');const data=await pr.json(),prices=await px.json();variants=await decompressB64(await vx.text());if(!Array.isArray(data))throw Error('products.json باید آرایه‌ای از محصولات باشد');all=data.map(x=>{const id=String(x.id||'').trim();return{id,name:String(x.name||'').trim(),image:String(x.image||'').trim(),price:Number(prices[id])||0,variants:Array.isArray(variants[id])?variants[id].filter(v=>v&&((v.size??'')!==''||Number.isFinite(v.price))):[]}}).filter(x=>/^P\d{4}$/.test(x.id)&&x.name);if(all.length!==908||new Set(all.map(x=>x.id)).size!==908)throw Error('کاتالوگ ۹۰۸ محصولی کامل نیست');if(all.some(x=>!x.price))throw Error('قیمت بعضی محصولات پیدا نشد');render()}function render(){document.getElementById('badge').textContent=fmt(all.length)+' محصول';const z=q.toLocaleLowerCase('fa'),a=all.filter(x=>!z||(`${x.id} ${x.name}`).toLocaleLowerCase('fa').includes(z)),total=Math.max(1,Math.ceil(a.length/PER));if(page>total)page=total;const rows=a.slice((page-1)*PER,page*PER);document.getElementById('status').innerHTML=`نمایش <b>${fmt(rows.length)}</b> از <b>${fmt(a.length)}</b> محصول · مجموع <b>${fmt(all.length)}</b> محصول`;document.getElementById('grid').innerHTML=rows.map(x=>{const vs=[...x.variants].sort((a,b)=>(Number(a.price)||Number.MAX_SAFE_INTEGER)-(Number(b.price)||Number.MAX_SAFE_INTEGER));const options=vs.length?`<label class="variantLabel">انتخاب سایز / مدل</label><select class="sizeSelect" data-id="${esc(x.id)}">${vs.map((v,i)=>`<option value="${i}">${esc(v.size||'بدون سایز')}${Number.isFinite(v.price)?' — '+fmt(v.price)+' تومان':''}</option>`).join('')}</select>`:'';const initial=vs.length&&Number.isFinite(vs[0].price)?vs[0].price:x.price;return `<article class="card"><div class="photo"><img src="${esc(x.image)}" alt="${esc(x.name)}" loading="lazy" onerror="const m=document.createElement('div');m.className='missing';m.textContent='تصویر ${esc(x.id)} پیدا نشد';this.replaceWith(m)"></div><div class="name">${esc(x.name)}</div>${options}<div class="price" id="price-${esc(x.id)}">${fmt(initial)} <small>تومان</small></div><div class="code">شناسه ${esc(x.id)}</div></article>`}).join('');document.querySelectorAll('.sizeSelect').forEach(sel=>{sel.addEventListener('change',()=>{const item=all.find(x=>x.id===sel.dataset.id),v=item?.variants?.slice().sort((a,b)=>(Number(a.price)||Number.MAX_SAFE_INTEGER)-(Number(b.price)||Number.MAX_SAFE_INTEGER))[Number(sel.value)];const el=document.getElementById('price-'+sel.dataset.id);el.innerHTML=Number.isFinite(v?.price)?`${fmt(v.price)} <small>تومان</small>`:'قیمت اعلام نشده <small>—</small>'})});const p=document.getElementById('pages');p.innerHTML='';const prev=document.createElement('button');prev.type='button';prev.textContent='قبلی';prev.disabled=page===1;prev.onclick=()=>{page--;render();window.scrollTo({top:0,behavior:'smooth'})};p.appendChild(prev);for(let i=Math.max(1,page-2);i<=Math.min(total,page+2);i++){const b=document.createElement('button');b.type='button';b.textContent=fmt(i);if(i===page){b.className='active';b.setAttribute('aria-current','page')}b.onclick=()=>{page=i;render();window.scrollTo({top:0,behavior:'smooth'})};p.appendChild(b)}const next=document.createElement('button');next.type='button';next.textContent='بعدی';next.disabled=page===total;next.onclick=()=>{page++;render();window.scrollTo({top:0,behavior:'smooth'})};p.appendChild(next)}document.getElementById('q').addEventListener('input',e=>{q=e.target.value.trim();page=1;render()});init().catch(e=>{document.getElementById('status').textContent='خطا در بارگذاری کاتالوگ: '+e.message})</script></body></html>
