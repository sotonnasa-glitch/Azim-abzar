<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>محصولات | عظیم ابزار</title><style>body{margin:0;background:#0b0d0c;color:#fff;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1320px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center}.badge{background:#f5b900;color:#111;padding:8px 12px;border-radius:9px;font-weight:900}.source{margin:12px 0;padding:12px;background:#111513;border:1px solid #303632;border-radius:10px;color:#b9bfbb}.tools{margin:18px 0 10px}input{box-sizing:border-box;width:100%;height:46px;background:#151917;border:1px solid #353b37;border-radius:10px;color:#fff;padding:0 13px;font:inherit}.status{color:#aaa;margin:10px 0 16px}.status b{color:#f5b900}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#151917;border:1px solid #303632;border-radius:15px;padding:12px;min-height:330px}.photo{width:100%;aspect-ratio:4/3;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:9px}.photo img{width:100%;height:100%;object-fit:contain}.missing{font-size:12px;color:#666;background:#f4f4f4;padding:15px;border-radius:8px;text-align:center}.name{font-size:15px;font-weight:800;line-height:1.8}.code{font-size:10px;color:#727973;margin-top:8px}.pages{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:28px}.pages button{background:#171b19;border:1px solid #3a403c;color:#fff;border-radius:8px;padding:8px 11px}.pages button.active{background:#f5b900;color:#111}@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><h2>عظیم ابزار — محصولات</h2><div class="badge" id="badge">در حال بارگذاری</div></div><div class="source">کاتالوگ محصولات بر اساس فایل محصولاتِ دارای شناسه و نگاشت مستقیم شناسه به عکس بارگذاری می‌شود.</div><div class="tools"><input id="q" placeholder="جستجوی نام یا شناسه محصول..."></div><div id="status" class="status">در حال آماده‌سازی...</div><div id="grid" class="grid"></div><div id="pages" class="pages"></div></main><script>const PER=36,pageData='./catalog_site_mapping_908/products.json?v=20260915-catalog-reset',MISSING=new Set(['P0452','P0453','P0454','P0455','P0457','P0460','P0468','P0502','P0519','P0522','P0524','P0525','P0526','P0527','P0528','P0529','P0530','P0533','P0535','P0537','P0538','P0541','P0542','P0553','P0821','P0838','P0840']);let all=[],q='',page=1;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]||m));const fmt=n=>new Intl.NumberFormat('fa-IR').format(Number(n)||0);async function parseCatalog(raw){let x=raw;if(typeof x==='string'){try{x=JSON.parse(x)}catch{throw Error('products.json JSON معتبر نیست')}}for(let i=0;i<4;i++){if(Array.isArray(x))return x;if(x&&x.encoding==='gzip+base64'&&typeof x.content==='string'){if(typeof DecompressionStream==='undefined')throw Error('مرورگر بازکردن فایل فشرده را پشتیبانی نمی‌کند');const b=atob(x.content),u=new Uint8Array(b.length);for(let j=0;j<b.length;j++)u[j]=b.charCodeAt(j);x=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();continue}if(x&&typeof x.content==='string'){try{x=JSON.parse(x.content);continue}catch{throw Error('ساختار products.json قابل خواندن نیست')}}break}if(Array.isArray(x))return x;throw Error('products.json باید آرایه‌ای از محصولات باشد')}async function init(){const r=await fetch(pageData,{cache:'no-store'});if(!r.ok)throw Error('فایل کاتالوگ پیدا نشد');const data=await parseCatalog(await r.text());all=data.map(x=>({id:String(x.id||'').trim(),name:String(x.name||'').trim(),image:String(x.image||'').trim()})).filter(x=>/^P\d{4}$/.test(x.id)&&x.name);if(all.length!==908||new Set(all.map(x=>x.id)).size!==908)throw Error('نگاشت ۹۰۸ محصول کامل نیست');render()}function render(){document.getElementById('badge').textContent=fmt(all.length)+' محصول';const z=q.toLocaleLowerCase('fa'),a=all.filter(x=>!z||(`${x.id} ${x.name}`).toLocaleLowerCase('fa').includes(z)),total=Math.max(1,Math.ceil(a.length/PER));if(page>total)page=total;const rows=a.slice((page-1)*PER,page*PER);document.getElementById('status').innerHTML=`نمایش <b>${fmt(rows.length)}</b> از <b>${fmt(a.length)}</b> محصول · مجموع <b>${fmt(all.length)}</b> محصول`;document.getElementById('grid').innerHTML=rows.map(x=>`<article class="card"><div class="photo">${MISSING.has(x.id)?`<div class="missing">عکس این شناسه در فایل عکس نیست<br>${esc(x.id)}</div>`:`<img src="./${esc(x.image)}" alt="${esc(x.name)}" loading="lazy" onerror="this.outerHTML='<div class=missing>تصویر ${esc(x.id)} پیدا نشد</div>'>`}</div><div class="name">${esc(x.name)}</div><div class="code">شناسه ${esc(x.id)}</div></article>`).join('');const p=document.getElementById('pages');p.innerHTML='';for(let i=Math.max(1,page-2);i<=Math.min(total,page+2);i++){const b=document.createElement('button');b.textContent=fmt(i);if(i===page)b.className='active';b.onclick=()=>{page=i;render()};p.appendChild(b)}}document.getElementById('q').oninput=e=>{q=e.target.value.trim();page=1;render()};init().catch(e=>{document.getElementById('status').textContent='خطا در بارگذاری کاتالوگ: '+e.message})</script></body></html>
