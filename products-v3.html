<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>محصولات | عظیم ابزار</title><style>body{margin:0;background:#0b0d0c;color:#fff;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1320px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.head-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.back,.contact{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:10px 14px;cursor:pointer;font:inherit;font-weight:900;text-decoration:none}.back{background:#171b19;border:1px solid #3a403c;color:#fff}.contact{background:#f5b900;border:1px solid #f5b900;color:#111}.badge{background:#f5b900;color:#111;padding:8px 12px;border-radius:9px;font-weight:900}.source{margin:12px 0;padding:12px;background:#111513;border:1px solid #303632;border-radius:10px;color:#b9bfbb}.tools{margin:18px 0 10px}input{box-sizing:border-box;width:100%;height:46px;background:#151917;border:1px solid #353b37;border-radius:10px;color:#fff;padding:0 13px;font:inherit}.status{color:#aaa;margin:10px 0 16px}.status b{color:#f5b900}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#151917;border:1px solid #303632;border-radius:15px;padding:12px;min-height:365px}.photo{width:100%;aspect-ratio:4/3;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:9px}.photo img{width:100%;height:100%;object-fit:contain}.missing{font-size:12px;color:#666;background:#f4f4f4;padding:15px;border-radius:8px;text-align:center}.name{font-size:15px;font-weight:800;line-height:1.8}.code{font-size:10px;color:#727973;margin-top:7px}.price{margin-top:9px;font-size:16px;font-weight:900;color:#f5b900}.price small{font-size:11px;color:#aaa;font-weight:700}.sizebox{margin-top:10px}.sizebox label{display:block;font-size:12px;color:#c7cbc8;margin-bottom:5px;font-weight:800}.sizebox select{width:100%;height:40px;background:#0f1210;border:1px solid #4a514c;color:#fff;border-radius:9px;padding:0 10px;font:inherit}.pages{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin:28px}.pages button{background:#171b19;border:1px solid #3a403c;color:#fff;border-radius:8px;padding:8px 11px;cursor:pointer}.pages button:disabled{opacity:.35;cursor:not-allowed}.pages button.active{background:#f5b900;color:#111}@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:540px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.head-actions{flex-direction:column;align-items:stretch}.back,.contact{justify-content:center;width:100%;box-sizing:border-box}}
</style></head><body><main class="wrap"><div class="top"><h2>عظیم ابزار — محصولات</h2><div class="head-actions"><a class="contact" href="./contact.html">✉ ارتباط با ما</a><a class="back" href="./index.html?home=1&amp;v=20260917">← صفحه اصلی</a><div class="badge" id="badge">در حال بارگذاری</div></div></div><div class="source">قیمت‌ها از لیست قیمت به‌روزشده با ۲۰٪ افزایش و سایزبندی‌های تعریف‌شده برای محصول خوانده می‌شوند. برای محصولی که سایز ندارد، «انتخاب سایز» نمایش داده نمی‌شود.</div><div class="tools"><input id="q" aria-label="جستجوی نام یا شناسه محصول" placeholder="جستجوی نام یا شناسه محصول..." autocomplete="off"></div><div id="status" class="status">در حال آماده‌سازی محصولات...</div><div id="grid" class="grid"></div><div id="pages" class="pages" aria-label="صفحه‌بندی محصولات"></div></main><script>const PER=36,pageData='./catalog_site_mapping_908/products.json?v=20260917',variantData='./catalog_site_mapping_908/price-variants.js?v=20260917';let all=[],q='',page=1,variants={};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]||m));const fmt=n=>new Intl.NumberFormat('fa-IR').format(Number(n)||0);const normId=v=>String(v??'').trim().toUpperCase();const num=v=>{if(typeof v==='number')return v;let s=String(v??'').replace(/[٬,\s]/g,'').replace(/[۰-۹]/g,d=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)));let n=Number(s);return Number.isFinite(n)&&n>0?n:null};const sizeText=v=>String(v??'').trim();function addVariant(id,size,price){id=normId(id);size=sizeText(size);price=num(price);if(!/^P\\d{4}$/.test(id)||!size||!price)return;if(!variants[id])variants[id]=[];if(!variants[id].some(v=>v.size===size&&v.price===price))variants[id].push({size,price})}function walk(node,parentId=null){if(Array.isArray(node)){node.forEach(x=>walk(x,parentId));return}if(!node||typeof node!=='object')return;const id=normId(node.id||node.code||node.product_id||node.productId||parentId);const directSize=node.size??node.variant_size??node.variantSize;const directPrice=node.price??node.new_price??node.newPrice??node.price_new??node.priceNew;if(id&&directSize!=null&&directPrice!=null)addVariant(id,directSize,directPrice);const vs=node.variants??node.sizes??node.size_prices??node.sizePrices;if(Array.isArray(vs))vs.forEach(v=>{if(v&&typeof v==='object')addVariant(id,v.size??v.label??v.name??v.value,v.price??v.new_price??v.newPrice??v.price_new)});else if(vs&&typeof vs==='object')Object.entries(vs).forEach(([s,p])=>{if(p&&typeof p==='object')addVariant(id,s,p.price??p.new_price??p.newPrice??p.value);else addVariant(id,s,p)});Object.entries(node).forEach(([k,v])=>{if(k==='variants'||k==='sizes'||k==='size_prices'||k==='sizePrices')return;if(/^P\\d{4}$/.test(normId(k)))walk(v,normId(k));else if(v&&typeof v==='object')walk(v,id||parentId)})}async function loadVariants(){try{const r=await fetch(variantData,{cache:'no-store'});if(!r.ok)return;const js=await r.text();const m=js.match(/AZIM_PRICE_VARIANTS_B64\\s*=\\s*['"]([^'"]+)['"]/);if(!m)return;const b=atob(m[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);if(typeof DecompressionStream==='undefined')return;const text=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();walk(JSON.parse(text));Object.values(variants).forEach(a=>a.sort((x,y)=>x.size.localeCompare(y.size,'fa',{numeric:true})));}catch(e){console.warn('price variants load failed',e)}}async function loadProducts(){const r=await fetch(pageData,{cache:'no-store'});if(!r.ok)throw Error('فایل کاتالوگ پیدا نشد');let data=JSON.parse(await r.text());if(data&&typeof data==='object'&&!Array.isArray(data)&&typeof data.content==='string'){try{const nested=JSON.parse(data.content);if(Array.isArray(nested)||nested.encoding==='gzip+base64')data=nested}catch{}}if(data&&typeof data==='object'&&!Array.isArray(data)&&data.encoding==='gzip+base64'&&typeof data.content==='string'){if(typeof DecompressionStream==='undefined')throw Error('مرورگر بازکردن فایل فشرده را پشتیبانی نمی‌کند');const b=atob(data.content),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);data=JSON.parse(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text())}if(!Array.isArray(data))throw Error('products.json باید آرایه‌ای از محصولات باشد');all=data.map(x=>({id:normId(x.id),name:String(x.name||'').trim(),image:String(x.image||'').trim()})).filter(x=>/^P\\d{4}$/.test(x.id)&&x.name);if(all.length!==908||new Set(all.map(x=>x.id)).size!==908)throw Error('کاتالوگ ۹۰۸ محصولی کامل نیست')}function productPrice(x){const v=variants[x.id];return v&&v.length?v[0].price:null}function card(x){const vs=variants[x.id]||[],p=productPrice(x);const select=vs.length?`<div class="sizebox"><label for="size-${esc(x.id)}">انتخاب سایز</label><select id="size-${esc(x.id)}" data-id="${esc(x.id)}">${vs.map((v,i)=>`<option value="${i}">${esc(v.size)} — ${fmt(v.price)} تومان</option>`).join('')}</select></div>`:'';return `<article class="card"><div class="photo"><img src="${esc(x.image)}" alt="${esc(x.name)}" loading="lazy" onerror="const m=document.createElement('div');m.className='missing';m.textContent='تصویر ${esc(x.id)} پیدا نشد';this.replaceWith(m)"></div><div class="name">${esc(x.name)}</div><div class="code">شناسه ${esc(x.id)}</div><div class="price" data-price="${esc(x.id)}">${p?fmt(p)+' تومان':'قیمت در لیست قیمت'} <small>${vs.length?'':' '}</small></div>${select}</article>`}function bindSizes(){document.querySelectorAll('select[data-id]').forEach(s=>s.addEventListener('change',e=>{const id=e.target.dataset.id,v=(variants[id]||[])[Number(e.target.value)];const el=document.querySelector(`[data-price="${CSS.escape(id)}"]`);if(el&&v)el.innerHTML=fmt(v.price)+' تومان'}))}function render(){document.getElementById('badge').textContent=fmt(all.length)+' محصول';const z=q.toLocaleLowerCase('fa'),a=all.filter(x=>!z||(`${x.id} ${x.name}`).toLocaleLowerCase('fa').includes(z)),total=Math.max(1,Math.ceil(a.length/PER));if(page>total)page=total;const rows=a.slice((page-1)*PER,page*PER);document.getElementById('status').innerHTML=`نمایش <b>${fmt(rows.length)}</b> از <b>${fmt(a.length)}</b> محصول · مجموع <b>${fmt(all.length)}</b> محصول`;document.getElementById('grid').innerHTML=rows.map(card).join('');bindSizes();const p=document.getElementById('pages');p.innerHTML='';const prev=document.createElement('button');prev.type='button';prev.textContent='قبلی';prev.disabled=page===1;prev.onclick=()=>{page--;render();scrollTo({top:0,behavior:'smooth'})};p.appendChild(prev);for(let i=Math.max(1,page-2);i<=Math.min(total,page+2);i++){const b=document.createElement('button');b.type='button';b.textContent=fmt(i);if(i===page){b.className='active';b.setAttribute('aria-current','page')}b.onclick=()=>{page=i;render();scrollTo({top:0,behavior:'smooth'})};p.appendChild(b)}const next=document.createElement('button');next.type='button';next.textContent='بعدی';next.disabled=page===total;next.onclick=()=>{page++;render();scrollTo({top:0,behavior:'smooth'})};p.appendChild(next)}async function init(){await Promise.all([loadVariants(),loadProducts()]);render()}document.getElementById('q').addEventListener('input',e=>{q=e.target.value.trim();page=1;render()});init().catch(e=>{document.getElementById('status').textContent='خطا در بارگذاری کاتالوگ: '+e.message})</script></body></html>
