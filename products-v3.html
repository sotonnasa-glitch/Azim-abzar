<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>محصولات | عظیم ابزار</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d0c;color:#f5f5f5;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1320px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:24px;font-weight:900}.badge{background:#f5b900;color:#111;padding:7px 11px;border-radius:9px;font-weight:900}.source{margin:10px 0 16px;padding:10px 12px;background:#111513;border:1px solid #2e342f;border-radius:10px;color:#b9bfbb;font-size:12px;line-height:1.9}.tools{margin:18px 0 10px}input{width:100%;height:46px;background:#151917;border:1px solid #353b37;border-radius:10px;color:#fff;padding:0 13px;font:inherit}.status{color:#a7ada9;margin:10px 0 16px}.status b{color:#f5b900}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#151917;border:1px solid #303632;border-radius:15px;padding:12px;overflow:hidden;min-height:330px;display:flex;flex-direction:column}.photo{width:100%;aspect-ratio:4/3;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:9px;padding:8px}.photo img{width:100%;height:100%;object-fit:contain;object-position:center;display:block;background:#fff}.missing{font-size:11px;color:#777;background:#f4f4f4;padding:15px;border-radius:8px;text-align:center;width:100%}.name{font-size:15px;font-weight:800;line-height:1.8;margin:7px 0}.code{font-size:10px;color:#727973;margin-top:8px}.pages{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:28px 0}.pages button{background:#171b19;border:1px solid #3a403c;color:#fff;border-radius:8px;padding:8px 11px;cursor:pointer}.pages button.active{background:#f5b900;color:#111}.empty{grid-column:1/-1;padding:45px;text-align:center;color:#9ea6a0}@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.grid{grid-template-columns:1fr}.brand{font-size:20px}}</style></head><body><main class="wrap"><div class="top"><div class="brand"><a href="./" style="color:inherit;text-decoration:none">عظیم ابزار</a> — محصولات</div><div class="badge" id="badge">در حال بارگذاری</div></div><div class="source">منبع محصولات: فایل کاتالوگ و نگاشت شناسه‌ها. اگر products.json به‌صورت فشرده ذخیره شده باشد، همین صفحه آن را در مرورگر باز می‌کند.</div><div class="tools"><input id="q" placeholder="جستجوی نام یا شناسه محصول..."></div><div id="status" class="status">در حال آماده‌سازی محصولات...</div><div id="grid" class="grid"></div><div id="pages" class="pages"></div></main><script>const PER=36;const MISSING=new Set(['P0452','P0453','P0454','P0455','P0457','P0460','P0468','P0502','P0519','P0522','P0524','P0525','P0526','P0527','P0528','P0529','P0530','P0533','P0535','P0537','P0538','P0541','P0542','P0553','P0821','P0838','P0840']);let all=[],q='',page=1;const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const fmt=n=>new Intl.NumberFormat('fa-IR').format(Number(n)||0);async function decodeCatalog(raw){if(Array.isArray(raw))return raw;if(!raw||typeof raw.content!=='string')throw new Error('products.json باید آرایه‌ای از محصولات باشد');let nested;try{nested=JSON.parse(raw.content)}catch{throw new Error('products.json ساختار قابل خواندن ندارد')}if(Array.isArray(nested))return nested;if(nested&&nested.encoding==='gzip+base64'&&typeof nested.content==='string'){if(typeof DecompressionStream==='undefined')throw new Error('مرورگر از بازکردن کاتالوگ فشرده پشتیبانی نمی‌کند');const bin=atob(nested.content);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const text=await new Response(stream).text();const data=JSON.parse(text);if(Array.isArray(data))return data}throw new Error('products.json باید آرایه‌ای از محصولات باشد')}async function init(){const raw=await fetch('./catalog_site_mapping_908/products.json?v=20260915-fix1',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('فایل کاتالوگ پیدا نشد');return r.json()});const data=await decodeCatalog(raw);all=data.map(r=>({id:String(r.id||'').trim(),name:String(r.name||'').trim(),image:String(r.image||'').trim()})).filter(r=>/^P\d{4}$/.test(r.id)&&r.name);if(all.length!==908||new Set(all.map(x=>x.id)).size!==908)throw new Error('نگاشت ۹۰۸ محصول کامل نیست');if(!all.every(x=>x.image===`catalog_site_mapping_908/images/${x.id}.jpg`))throw new Error('مسیر تصویر با شناسه محصول منطبق نیست');render()}function render(){document.getElementById('badge').textContent=fmt(all.length)+' محصول';const z=q.toLocaleLowerCase('fa'),a=all.filter(x=>!z||(`${x.id} ${x.name}`).toLocaleLowerCase('fa').includes(z)),total=Math.max(1,Math.ceil(a.length/PER));if(page>total)page=total;const rows=a.slice((page-1)*PER,page*PER);document.getElementById('status').innerHTML=`نمایش <b>${fmt(rows.length)}</b> از <b>${fmt(a.length)}</b> محصول · مجموع <b>${fmt(all.length)}</b> محصول · <b>${fmt(MISSING.size)}</b> شناسه بدون عکس در فایل ارسالی`;document.getElementById('grid').innerHTML=rows.length?rows.map(x=>`<article class="card"><div class="photo">${MISSING.has(x.id)?`<div class="missing">عکس این شناسه در فایل عکس ارسالی نیست<br>${esc(x.id)}</div>`:`<img src="./${esc(x.image)}" alt="${esc(x.name)}" loading="lazy" onerror="this.outerHTML='<div class=missing>تصویر ${esc(x.id)} در سایت پیدا نشد</div>'>`}</div><div class="name">${esc(x.name)}</div><div class="code">شناسه ${esc(x.id)}</div></article>`).join(''):'<div class="empty">محصولی پیدا نشد.</div>';const p=document.getElementById('pages');p.innerHTML='';for(let i=Math.max(1,page-2);i<=Math.min(total,page+2);i++){const b=document.createElement('button');b.textContent=fmt(i);if(i===page)b.className='active';b.onclick=()=>{page=i;render();scrollTo({top:0,behavior:'smooth'})};p.appendChild(b)}}document.getElementById('q').oninput=e=>{q=e.target.value.trim();page=1;render()};init().catch(e=>document.getElementById('status').textContent='خطا در بارگذاری کاتالوگ: '+(e?.message||e));</script><!-- FIX-PRODUCTS-JSON-WRAPPER-20260915 --></body></html>
