<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>محصولات | عظیم ابزار</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d0c;color:#f5f5f5;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1320px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:24px;font-weight:900}.badge{background:#f5b900;color:#111;padding:7px 11px;border-radius:9px;font-weight:900}.source{margin:10px 0 16px;padding:10px 12px;background:#111513;border:1px solid #2e342f;border-radius:10px;color:#b9bfbb;font-size:12px}.tools{margin:18px 0 10px}input{width:100%;height:46px;box-sizing:border-box;background:#151917;border:1px solid #353b37;border-radius:10px;color:#fff;padding:0 13px;font:inherit}.status{color:#a7ada9;margin:10px 0 16px}.status b{color:#f5b900}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#151917;border:1px solid #303632;border-radius:15px;padding:12px;overflow:hidden;min-height:330px;display:flex;flex-direction:column}.photo{width:100%;aspect-ratio:4/3;height:auto;border-radius:12px;background:#fff!important;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:9px}.photo img{width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;object-position:center;display:block;background:#fff!important}.name{font-size:15px;font-weight:800;line-height:1.8;margin:7px 0}.code{font-size:10px;color:#727973;margin-top:8px}.missing{font-size:11px;color:#9d3333;background:#fff;padding:15px;border-radius:8px;text-align:center}.pages{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:28px 0}.pages button{background:#171b19;border:1px solid #3a403c;color:#fff;border-radius:8px;padding:8px 11px;cursor:pointer}.pages button.active{background:#f5b900;color:#111}.empty{grid-column:1/-1;padding:45px;text-align:center;color:#9ea6a0}@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.grid{grid-template-columns:1fr}.brand{font-size:20px}}</style></head><body><main class="wrap"><div class="top"><div class="brand"><a href="./" style="color:inherit;text-decoration:none">عظیم ابزار</a> — محصولات</div><div class="badge" id="badge">در حال بارگذاری</div></div><div class="source">نام هر محصول از نگاشت دقیق تصویر↔متن گرفته می‌شود؛ متن خام JSONL دیگر برای نام‌گذاری کارت‌ها استفاده نمی‌شود.</div><div class="tools"><input id="q" placeholder="جستجوی نام یا شناسه محصول..."></div><div id="status" class="status">در حال آماده‌سازی محصولات...</div><div id="grid" class="grid"></div><div id="pages" class="pages"></div></main><script src="./catalog_site_mapping_908/name-map.js?v=20260915-3"></script><script src="./catalog_site_mapping_908/excel-products-part-1.js?v=20260915-3"></script><script src="./catalog_site_mapping_908/excel-products-part-2.js?v=20260915-3"></script><script src="./catalog_site_mapping_908/excel-products-part-3.js?v=20260915-3"></script><script src="./catalog_site_mapping_908/excel-products-part-4.js?v=20260915-3"></script><script>const PER=36;let all=[],q='',page=1;const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const fmt=n=>new Intl.NumberFormat('fa-IR').format(Number(n)||0);const EXCEL_NAMES=[...(window.AZIM_EXCEL_NAMES_1||[]),...(window.AZIM_EXCEL_NAMES_2||[]),...(window.AZIM_EXCEL_NAMES_3||[]),...(window.AZIM_EXCEL_NAMES_4||[])];function mappedName(id,fallback){const n=Number(String(id).slice(1));const row=window.AZIM_IMAGE_TEXT_ROWS?.[n];const name=row?EXCEL_NAMES[row-1]?.[0]:null;return String(name||fallback||'').trim()}function parseJSONL(t){return String(t||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean).map(s=>JSON.parse(s))}function imageCandidates(r){const id=String(r.id||'').trim();const raw=String(r.image||'').trim();const crop=String(r.card_crop||'').trim();const out=[];if(raw){out.push('./catalog_site_mapping_908/'+raw.replace(/^\.\//,''));out.push('./'+raw.replace(/^\.\//,''));}if(crop)out.push('./catalog_site_mapping_908/'+crop.replace(/^\.\//,''));out.push('./catalog_site_mapping_908/images/'+id+'.jpg');return [...new Set(out)]}function loadImageWithFallback(img,candidates,i=0){if(i>=candidates.length){img.outerHTML='<div class="missing">تصویر '+esc(img.dataset.id)+' موجود نیست</div>';return}img.onerror=()=>loadImageWithFallback(img,candidates,i+1);img.src=candidates[i]}async function init(){const t=await fetch('./catalog_site_mapping_908/products.jsonl?v=20260915-3',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('کاتالوگ اصلی پیدا نشد');return r.text()});const rows=parseJSONL(t);if(rows.length!==908)throw new Error('کاتالوگ باید ۹۰۸ رکورد داشته باشد: '+rows.length);if(EXCEL_NAMES.length!==1085)throw new Error('فهرست Excel ناقص است: '+EXCEL_NAMES.length);if(!Array.isArray(window.AZIM_IMAGE_TEXT_ROWS)||window.AZIM_IMAGE_TEXT_ROWS.length!==908)throw new Error('نگاشت تصویر-متن ناقص است');all=rows.slice(0,906).filter(r=>/^P\d{4}$/.test(String(r.id||''))).map(r=>({id:String(r.id).trim(),name:mappedName(r.id,r.name),candidates:imageCandidates(r)}));if(all.length!==906||all.some(x=>!x.name))throw new Error('۹۰۶ جفت تصویر-متن کامل نیست');if(new Set(all.map(x=>x.id)).size!==906)throw new Error('شناسه تکراری در نگاشت محصولات وجود دارد');render()}function render(){document.getElementById('badge').textContent=fmt(all.length)+' محصول';const z=q.toLocaleLowerCase('fa'),a=all.filter(x=>!z||(`${x.id} ${x.name}`).toLocaleLowerCase('fa').includes(z)),total=Math.max(1,Math.ceil(a.length/PER));if(page>total)page=total;const rows=a.slice((page-1)*PER,page*PER);document.getElementById('status').innerHTML=`نمایش <b>${fmt(rows.length)}</b> از <b>${fmt(a.length)}</b> محصول · مجموع <b>${fmt(all.length)}</b> محصول`;document.getElementById('grid').innerHTML=rows.length?rows.map(x=>`<article class="card"><div class="photo"><img data-id="${esc(x.id)}" alt="${esc(x.name)}" loading="lazy"></div><div class="name">${esc(x.name)}</div><div class="code">شناسه ${esc(x.id)}</div></article>`).join(''):'<div class="empty">محصولی پیدا نشد.</div>';rows.forEach(x=>{const img=document.querySelector(`img[data-id="${x.id}"]`);if(img)loadImageWithFallback(img,x.candidates)});const p=document.getElementById('pages');p.innerHTML='';for(let i=Math.max(1,page-2);i<=Math.min(total,page+2);i++){const b=document.createElement('button');b.textContent=fmt(i);if(i===page)b.className='active';b.onclick=()=>{page=i;render();scrollTo({top:0,behavior:'smooth'})};p.appendChild(b)}}document.getElementById('q').oninput=e=>{q=e.target.value.trim();page=1;render()};init().catch(e=>document.getElementById('status').textContent='خطا: '+(e?.message||e));</script><!-- AZIM-PRODUCTS-V3-EXACT-IMAGE-TEXT-MAP --><!-- IMAGE-SLOT-FITS-NATURAL-ASPECT-RATIO --><!-- IMAGE-AREA-FILLS-CARD-WIDTH-NO-SIDE-GAPS --><!-- WHITE-CANVAS-FILLS-EVERY-PHOTO-SLOT --><!-- WHITE-CANVAS-FORCES-LETTERBOX-AREA-WHITE --></body></html>
