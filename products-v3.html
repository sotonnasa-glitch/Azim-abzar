<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>محصولات | عظیم ابزار</title><style>
body{margin:0;background:#0b0d0c;color:#fff;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1320px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.btn,.badge{border-radius:10px;padding:10px 14px;font:inherit;font-weight:900}.btn{text-decoration:none;display:inline-flex;align-items:center}.back{background:#171b19;border:1px solid #3a403c;color:#fff}.contact{background:#f5b900;border:1px solid #f5b900;color:#111}.badge{background:#f5b900;color:#111}.source{margin:12px 0;padding:12px;background:#111513;border:1px solid #303632;border-radius:10px;color:#b9bfbb}.tools{margin:18px 0 10px}input{box-sizing:border-box;width:100%;height:46px;background:#151917;border:1px solid #353b37;border-radius:10px;color:#fff;padding:0 13px;font:inherit}.status{color:#aaa;margin:10px 0 16px}.status b{color:#f5b900}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#151917;border:1px solid #303632;border-radius:15px;padding:12px;min-height:365px}.photo{width:100%;aspect-ratio:4/3;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:9px}.photo img{width:100%;height:100%;object-fit:contain}.missing{font-size:12px;color:#666;background:#f4f4f4;padding:15px;border-radius:8px;text-align:center}.name{font-size:15px;font-weight:800;line-height:1.8}.code{font-size:10px;color:#727973;margin-top:7px}.price{margin-top:9px;font-size:16px;font-weight:900;color:#f5b900;line-height:1.6}.price small{font-size:11px;color:#aaa;font-weight:700}.sizebox{margin-top:10px}.sizebox label{display:block;font-size:12px;color:#c7cbc8;margin-bottom:5px;font-weight:800}.sizebox select{width:100%;height:42px;background:#0f1210;border:1px solid #4a514c;color:#fff;border-radius:9px;padding:0 10px;font:inherit}.note{margin-top:7px;font-size:11px;color:#8e9691}.pages{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin:28px}.pages button{background:#171b19;border:1px solid #3a403c;color:#fff;border-radius:8px;padding:8px 11px;cursor:pointer}.pages button:disabled{opacity:.35;cursor:not-allowed}.pages button.active{background:#f5b900;color:#111}@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:540px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.actions{width:100%;flex-direction:column}.btn{justify-content:center;width:100%;box-sizing:border-box}}
</style></head><body><main class="wrap"><div class="top"><h2>عظیم ابزار — محصولات</h2><div class="actions"><a class="btn contact" href="./contact.html">✉ ارتباط با ما</a><a class="btn back" href="./index.html?home=1&amp;v=20260917-pdf-price-1">← صفحه اصلی</a><div class="badge" id="badge">در حال بارگذاری</div></div></div><div class="source">سایز و قیمت‌ها مستقیماً از «لیست قیمت بروزرسانی شده با ۲۰٪ افزایش قیمت» استخراج شده‌اند. فقط محصولاتی که در ستون سایزِ منبع، سایز/مدل دارند «انتخاب سایز» نشان می‌دهند.</div><div class="tools"><input id="q" aria-label="جستجوی نام یا شناسه محصول" placeholder="جستجوی نام یا شناسه محصول..." autocomplete="off"></div><div id="status" class="status">در حال آماده‌سازی محصولات...</div><div id="grid" class="grid"></div><div id="pages" class="pages" aria-label="صفحه‌بندی محصولات"></div></main><script>
const PER=36;const pageData='./catalog_site_mapping_908/products.json?v=20260917-pdf-price-1';const dataFile='./catalog_site_mapping_908/price-size-data.js?v=20260917-pdf-price-1';const SUPABASE_URL='https://lzkrwtnylkordkwkdyzp.supabase.co';const SUPABASE_KEY='sb_publishable_jnrMEKAW7prmIKcnFG_ANQ_s6VFrm_3';const categoryParam=new URLSearchParams(location.search).get('cat')||'';let all=[],q='',page=1,priceData={};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]||m));
const fmt=n=>new Intl.NumberFormat('fa-IR').format(Number(n)||0);
const priceHtml=n=>Number.isFinite(Number(n))&&Number(n)>0?`${fmt(n)} <small>تومان</small>`:'<span class="unknown">قیمت در لیست درج نشده</span>';
async function loadPriceData(){const s=await (await fetch(dataFile,{cache:'no-store'})).text();const m=s.match(/AZIM_PRICE_SIZE_DATA_B64\s*=\s*["']([^"']+)["']/);if(!m)throw Error('فایل سایز و قیمت خوانده نشد');const b=atob(m[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);if(typeof DecompressionStream==='undefined')throw Error('مرورگر بازکردن فایل قیمت را پشتیبانی نمی‌کند');const t=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();priceData=JSON.parse(t);if(Object.keys(priceData).length!==908)throw Error('داده قیمت باید ۹۰۸ شناسه داشته باشد')}
async function loadProducts(){const r=await fetch(pageData,{cache:'no-store'});if(!r.ok)throw Error('فایل کاتالوگ پیدا نشد');const data=await r.json();if(!Array.isArray(data))throw Error('products.json باید آرایه باشد');const cr=await fetch(SUPABASE_URL+'/rest/v1/products?select=code,category_name&is_active=eq.true&limit=1000',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});if(!cr.ok)throw Error('دسته‌بندی محصولات از دیتابیس خوانده نشد');const cats=await cr.json(),cm={};cats.forEach(x=>{if(x.code)cm[String(x.code).trim().toUpperCase()]=String(x.category_name||'').trim()});all=data.map(x=>({id:String(x.id||'').trim().toUpperCase(),name:String(x.name||'').trim(),image:String(x.image||'').trim(),category:cm[String(x.id||'').trim().toUpperCase()]||'ابزار دستی'})).filter(x=>/^P\d{4}$/.test(x.id)&&x.name);if(all.length!==908||new Set(all.map(x=>x.id)).size!==908)throw Error('کاتالوگ ۹۰۸ محصولی کامل نیست')}
function optionLabel(v){return v[1]==null?`${v[0]} — قیمت درج نشده`:`${v[0]} — ${fmt(v[1])} تومان`}
function card(x){const d=priceData[x.id]||{p:null},vs=Array.isArray(d.v)?d.v:[],base=d.p;const selector=vs.length?`<div class="sizebox"><label for="size-${esc(x.id)}">انتخاب سایز</label><select id="size-${esc(x.id)}" data-id="${esc(x.id)}">${vs.map((v,i)=>`<option value="${i}"${i===0?' selected':''}>${esc(optionLabel(v))}</option>`).join('')}</select><div class="note">قیمت هر گزینه مطابق لیست قیمت منبع است.</div></div>`:'';const shown=vs.length?(base!=null?`از ${priceHtml(base)}`:'قیمت در لیست درج نشده'):priceHtml(base);return `<article class="card"><div class="photo"><img src="${esc(x.image)}" alt="${esc(x.name)}" loading="lazy" onerror="const m=document.createElement('div');m.className='missing';m.textContent='تصویر ${esc(x.id)} پیدا نشد';this.replaceWith(m)"></div><div class="name">${esc(x.name)}</div><div class="code">شناسه ${esc(x.id)}</div><div class="price" data-price="${esc(x.id)}">${shown}</div>${selector}</article>`}
function bindSizes(){document.querySelectorAll('select[data-id]').forEach(s=>s.addEventListener('change',e=>{const id=e.target.dataset.id,v=(priceData[id]?.v||[])[Number(e.target.value)],el=document.querySelector(`[data-price="${CSS.escape(id)}"]`);if(!el||!v)return;el.innerHTML=v[1]==null?'<span class="unknown">قیمت در لیست درج نشده</span>':priceHtml(v[1])}))}
function render(){document.getElementById('badge').textContent=fmt(all.length)+' محصول';const z=q.toLocaleLowerCase('fa'),a=all.filter(x=>(!categoryParam||x.category===categoryParam)&&(!z||(`${x.id} ${x.name}`).toLocaleLowerCase('fa').includes(z))),total=Math.max(1,Math.ceil(a.length/PER));if(page>total)page=total;const rows=a.slice((page-1)*PER,page*PER);document.getElementById('status').innerHTML=`نمایش <b>${fmt(rows.length)}</b> از <b>${fmt(a.length)}</b> محصول · مجموع <b>${fmt(all.length)}</b> محصول`;document.getElementById('grid').innerHTML=rows.map(card).join('');bindSizes();const p=document.getElementById('pages');p.innerHTML='';const prev=document.createElement('button');prev.textContent='قبلی';prev.disabled=page===1;prev.onclick=()=>{page--;render();scrollTo({top:0,behavior:'smooth'})};p.appendChild(prev);for(let i=Math.max(1,page-2);i<=Math.min(total,page+2);i++){const b=document.createElement('button');b.textContent=fmt(i);if(i===page)b.className='active';b.onclick=()=>{page=i;render();scrollTo({top:0,behavior:'smooth'})};p.appendChild(b)}const next=document.createElement('button');next.textContent='بعدی';next.disabled=page===total;next.onclick=()=>{page++;render();scrollTo({top:0,behavior:'smooth'})};p.appendChild(next)}
async function init(){try{await Promise.all([loadPriceData(),loadProducts()]);render();document.getElementById('status').insertAdjacentHTML('afterbegin',categoryParam?`دسته‌بندی انتخاب‌شده: <b>${esc(categoryParam)}</b> · `:'')}catch(e){console.error(e);document.getElementById('status').innerHTML='<b>خطا:</b> '+esc(e.message||'بارگذاری کاتالوگ ناموفق بود')}}document.getElementById('q').addEventListener('input',e=>{q=e.target.value.trim();page=1;render()});init().catch(e=>{document.getElementById('status').textContent='خطا در بارگذاری کاتالوگ: '+e.message})
</script></body></html>
