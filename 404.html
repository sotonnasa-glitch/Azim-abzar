<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co;">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="description" content="صفحه موردنظر در عظیم ابزار پیدا نشد.">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <title>صفحه پیدا نشد | عظیم ابزار</title>
  <style>
    *{box-sizing:border-box}
    html{width:100%;max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
    :root{color-scheme:dark}body{margin:0;min-height:100vh;width:100%;max-width:100%;overflow-x:hidden;display:grid;place-items:center;background:#080b09;color:#f4f5f3;font-family:Tahoma,Vazirmatn,sans-serif}.box{width:min(620px,calc(100% - 24px));max-width:100%;min-width:0;padding:30px 24px;border:1px solid rgba(245,185,0,.28);border-radius:24px;background:#111613;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.45)}.code{font:900 clamp(44px,16vw,64px ui-monospace,monospace;color:#ffd84f}.box h1{font-size:clamp(19px,6vw,24px);margin:8px 0 12px}.box p{color:#9ea69f;line-height:2}.btn{display:inline-block;margin-top:14px;padding:12px 20px;border-radius:12px;background:#ffd84f;color:#111;text-decoration:none;font-weight:900}
  </style>
</head>
<body>
  <main class="box">
    <div class="code">404</div>
    <h1>این صفحه پیدا نشد</h1>
    <p>آدرس واردشده وجود ندارد یا ممکن است جابه‌جا شده باشد.</p>
    <a class="btn" id="homeLink" href="/">بازگشت به صفحه اصلی</a>
  </main>
  <script>
    (function(){
      var link = document.getElementById("homeLink");
      if (!link) return;
      link.href = /github\.io$/i.test(location.hostname) ? "/Azim-abzar/" : "/";
    })();
  </script>
</body>
</html>
