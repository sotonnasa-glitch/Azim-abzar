name: Inspect size source
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Inspect generated product size payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('catalog_site_mapping_908/price-size-data.json').read_text(encoding='utf-8'))
          ids = [f'P{i:04d}' for i in range(1, 909)]

          assert isinstance(data, dict)
          assert list(data) == ids
          assert all(isinstance(d, dict) for d in data.values())
          assert all(('p' in d and (d['p'] is None or isinstance(d['p'], (int, float)))) for d in data.values())
          assert all(('v' not in d or isinstance(d['v'], list)) for d in data.values())

          variant_products = sum(bool(d.get('v')) for d in data.values())
          variant_rows = sum(len(d.get('v', [])) for d in data.values())

          print('SIZE/PRICE DATA VERIFIED:', len(data), 'products',
                'variant_products=', variant_products,
                'variant_rows=', variant_rows)
          PY
