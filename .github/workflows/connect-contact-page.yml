name: Connect contact page

on:
  push:
    paths:
      - '.github/workflows/connect-contact-page.yml'

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update contact links only
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          pattern = re.compile(r'(<a\b[^>]*\bhref=["\'])[^"\']*(["\'][^>]*>\s*ارتباط با ما\s*</a>)')
          new_text, count = pattern.subn(r'\1contact.html\2', text)
          print(f'Updated contact links: {count}')
          if count:
              p.write_text(new_text, encoding='utf-8')

      - name: Commit homepage change and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/connect-contact-page.yml
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Link homepage contact buttons to contact page'
          git push
