# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Add Products link and Supabase loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'href="products.html"' not in s:
              old = '<nav class="nav"><a href="#home">خانه</a>'
              new = '<nav class="nav"><a href="#home">خانه</a><a href="products.html">محصولات</a>'
              if old in s:
                  s = s.replace(old, new, 1)
                  p.write_text(s, encoding='utf-8')
          p = Path('products.html')
          s = p.read_text(encoding='utf-8')
          old = '<script src="custom-products.js"></script>'
          new = '<script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-products.js"></script>'
          if old in s:
              s = s.replace(old, new, 1)
          elif 'supabase-products.js' not in s:
              s = s.replace('</body>', new + '</body>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
