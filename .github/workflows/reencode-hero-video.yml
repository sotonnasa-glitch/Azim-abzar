name: Re-encode hero video for smooth mobile playback

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reencode-hero-video.yml"
      - "assets/homepage/azim-hero-optimized.mp4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reencode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Re-encode hero video
        shell: bash
        run: |
          set -euo pipefail
          input="assets/homepage/azim-hero-optimized.mp4"
          output="/tmp/hero-mobile.mp4"

          test -s "$input"

          ffmpeg -hide_banner -loglevel error -y             -i "$input"             -an             -vf "scale=w='min(1280,iw)':h='-2':force_original_aspect_ratio=decrease"             -r 30             -c:v libx264             -preset veryfast             -profile:v baseline             -level 3.1             -pix_fmt yuv420p             -bf 0             -refs 1             -g 45             -keyint_min 45             -sc_threshold 0             -crf 23             -movflags +faststart             "$output"

          ffprobe -v error             -show_entries stream=codec_name,profile,width,height,pix_fmt,r_frame_rate             -show_entries format=duration,size             -of json "$output"

          test -s "$output"
          mv "$output" "$input"

      - name: Verify MP4 playback structure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          p = "assets/homepage/azim-hero-optimized.mp4"
          r = subprocess.run(
              ["ffprobe","-v","error","-show_entries",
               "stream=codec_name,profile,width,height,pix_fmt,r_frame_rate",
               "-show_entries","format=duration,size","-of","json",p],
              check=True, capture_output=True, text=True)
          data = json.loads(r.stdout)
          s = data["streams"][0]
          f = data["format"]
          assert s["codec_name"] == "h264"
          assert s["pix_fmt"] == "yuv420p"
          assert s["width"] <= 1280
          assert s["height"] > 0
          assert float(f["duration"]) > 0
          assert int(f["size"]) > 0
          print("HERO_VIDEO_OK", json.dumps(data, ensure_ascii=False))

          # Confirm the MP4 starts with ftyp and contains moov early enough
          with open(p, "rb") as fh:
              head = fh.read(1024 * 1024)
          assert b"ftyp" in head[:128]
          assert b"moov" in head, "moov atom was not moved near the front"
          print("FASTSTART_OK")
          PY

      - name: Commit optimized hero
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/homepage/azim-hero-optimized.mp4
          if git diff --cached --quiet; then
            echo "NO_VIDEO_CHANGE"
            exit 0
          fi
          git commit -m "Optimize hero video decoding [skip ci]"
          git push
