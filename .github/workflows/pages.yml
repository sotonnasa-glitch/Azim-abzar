name: Deploy Azim Abzar to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate exact uploaded catalog mapping
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,json
          from pathlib import Path
          root=Path('catalog_site_mapping_908')
          raw=json.loads((root/'products.json').read_text(encoding='utf-8'))
          assert raw.get('encoding')=='gzip+base64'
          data=json.loads(gzip.decompress(base64.b64decode(raw['content'])).decode('utf-8'))
          assert isinstance(data,list) and len(data)==908
          ids=[x['id'] for x in data]
          assert ids==[f'P{i:04d}' for i in range(1,909)]
          assert len(set(ids))==908
          assert all(str(x.get('name','')).strip() for x in data)
          assert all(x.get('image')==f'catalog_site_mapping_908/images/{x["id"]}.jpg' for x in data)
          print('VERIFIED exact catalog JSON: 908 products, unique IDs P0001-P0908')
          PY
      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='catalog_site_mapping_908/missing-images.zip' --exclude='catalog_site_mapping_908/*.b64' ./ _site/
          test -s _site/products.html
          test -s _site/products-v3.html
          python - <<'PY'
          import base64,gzip,json
          from pathlib import Path
          p=json.loads(Path('_site/catalog_site_mapping_908/products.json').read_text(encoding='utf-8'))
          data=json.loads(gzip.decompress(base64.b64decode(p['content'])).decode('utf-8'))
          assert len(data)==908 and data[0]['id']=='P0001' and data[-1]['id']=='P0908'
          print('PAGES ARTIFACT VERIFIED: exact 908-product catalog is present')
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
