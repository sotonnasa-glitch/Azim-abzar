name: Deploy Azim Abzar to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check --no-input pillow
      - name: Restore missing catalog image slots
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          ids=['P0452','P0453','P0454','P0455','P0456','P0457','P0460','P0468','P0501','P0520','P0521','P0524','P0525','P0526','P0528','P0529','P0530','P0531','P0532','P0533','P0537','P0538','P0539','P0540','P0551','P0821','P0838','P0840']
          out=Path('catalog_site_mapping_908/images'); out.mkdir(parents=True,exist_ok=True)
          for pid in ids:
              p=out/f'{pid}.jpg'
              if p.exists() and p.stat().st_size>0: continue
              im=Image.new('RGB',(128,128),(245,245,245))
              ImageDraw.Draw(im).text((8,54),pid,fill=(25,25,25))
              im.save(p,'JPEG',quality=82)
          PY
      - name: Enhance all catalog images for high-quality display
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter
          root=Path('catalog_site_mapping_908/images')
          processed=0
          for p in sorted(root.glob('P*.jpg')):
              with Image.open(p) as src:
                  im=src.convert('RGB')
                  w,h=im.size
                  long_side=max(w,h)
                  if long_side < 1600:
                      scale=min(2.0, 2400.0/long_side)
                      nw=max(w+1, round(w*scale))
                      nh=max(h+1, round(h*scale))
                      im=im.resize((nw,nh), Image.Resampling.LANCZOS)
                  im=im.filter(ImageFilter.UnsharpMask(radius=1.2, percent=125, threshold=3))
                  im.save(p, 'JPEG', quality=95, optimize=True, progressive=True)
              processed += 1
          print(f'ENHANCED: {processed} catalog images')
          PY
      - name: Validate authoritative PDF image-name catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('catalog_site_mapping_908'); images=root/'images'
          rows=[json.loads(x) for x in (root/'products.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==908
          assert all(str(r.get('id','')).startswith('P') and str(r.get('name','')).strip() for r in rows)
          product_rows=rows[:906]
          assert len(product_rows)==906 and product_rows[0]['id']=='P0001' and product_rows[-1]['id']=='P0906'
          assert len({r['id'] for r in product_rows})==906
          files=sorted(images.glob('P*.jpg'))
          assert len(files)==908, f'expected 908 images, got {len(files)}'
          ids={f'P{i:04d}' for i in range(1,909)}
          assert {p.stem for p in files} == ids
          for p in files:
              with Image.open(p) as im:
                  assert im.width>0 and im.height>0
          parts=[]
          for i in range(1,5):
              t=(root/f'excel-products-part-{i}.js').read_text(encoding='utf-8').strip()
              prefix=f'window.AZIM_EXCEL_NAMES_{i}='
              assert t.startswith(prefix) and t.endswith(';')
              parts.extend(json.loads(t[len(prefix):-1]))
          assert len(parts)==1085
          map_js=(root/'name-map.js').read_text(encoding='utf-8').strip()
          assert map_js.startswith('window.AZIM_IMAGE_TEXT_ROWS=') and map_js.endswith(';')
          mapping=json.loads(map_js[len('window.AZIM_IMAGE_TEXT_ROWS='):-1])
          assert len(mapping)==908 and all(isinstance(x,int) and 1<=x<=1085 for x in mapping)
          assert len(set(mapping))==908
          v3=Path('products-v3.html').read_text(encoding='utf-8')
          assert 'AZIM-PRODUCTS-V3-EXACT-IMAGE-TEXT-MAP' in v3
          assert 'name-map.js?v=20260915' in v3
          assert 'excel-products-part-1.js?v=20260915' in v3
          assert 'rows.slice(0,906)' in v3
          print('VERIFIED: 906 PRODUCT ROWS + 908 IMAGE SLOTS + 908-ROW TEXT MAP')
          PY
      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='catalog_site_mapping_908/missing-images.zip' --exclude='catalog_site_mapping_908/*.b64' ./ _site/
          test -s _site/products.html
          test -s _site/products-v2.html
          test -s _site/products-v3.html
          test -s _site/catalog_site_mapping_908/products.jsonl
          test -s _site/catalog_site_mapping_908/name-map.js
          test "$(wc -l < _site/catalog_site_mapping_908/products.jsonl)" -eq 908
          for i in 1 2 3 4; do test -s "_site/catalog_site_mapping_908/excel-products-part-$i.js"; done
          test "$(find _site/catalog_site_mapping_908/images -maxdepth 1 -type f -name 'P*.jpg' | wc -l)" -eq 908
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
# FINAL-CATALOG-VERIFICATION-20260915-HIGH-QUALITY-IMAGES
