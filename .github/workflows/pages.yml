name: Deploy Azim Abzar to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-input pillow

      - name: Validate catalog and preserve GitHub images exactly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, json
          from pathlib import Path
          from PIL import Image

          root = Path('catalog_site_mapping_908')
          products_path = root / 'products.json'
          images_dir = root / 'images'
          payload_path = root / 'excel-products-gzip.js'

          legacy = json.loads(products_path.read_text(encoding='utf-8'))
          assert isinstance(legacy, list) and len(legacy) > 0

          payload = payload_path.read_text(encoding='utf-8').strip()
          prefix = 'window.AZIM_PRODUCTS_GZIP="'
          suffix = '";'
          assert payload.startswith(prefix) and payload.endswith(suffix), 'Invalid Excel product payload wrapper'
          encoded = payload[len(prefix):-len(suffix)]
          assert encoded and all(c in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=' for c in encoded), 'Invalid Excel product payload characters'
          encoded += '=' * (-len(encoded) % 4)
          try:
              decoded = gzip.decompress(base64.b64decode(encoded, validate=True))
          except Exception as exc:
              raise AssertionError(f'Invalid Excel gzip payload: {exc}') from exc
          data = json.loads(decoded.decode('utf-8'))
          assert isinstance(data, list)
          assert len(data) == 1085, len(data)

          ids = [str(p.get('id', '')) for p in data]
          assert ids == [f'P{i:04d}' for i in range(1, 1086)]
          assert all(str(p.get('name', '')).strip() for p in data)

          image_files = sorted(images_dir.glob('P*.jpg'))
          image_ids = {p.stem for p in image_files}
          assert len(image_files) == 880, len(image_files)
          assert image_ids <= set(ids)

          checked = 0
          for p in image_files:
              with Image.open(p) as im:
                  assert im.width > 0 and im.height > 0
                  checked += 1
          print(f'CATALOG VALIDATED: {len(data)} Excel products, {checked} exact GitHub JPGs')
          PY

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='.git/' ./ _site/
          test -s _site/products.html
          test -s _site/catalog_site_mapping_908/excel-products-gzip.js
          test "$(find _site/catalog_site_mapping_908/images -maxdepth 1 -type f -name 'P*.jpg' | wc -l)" -eq 880

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
