name: Deploy Azim Abzar to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  AZIM_SUPABASE_URL: https://lzkrwtnylkordkwkdyzp.supabase.co
  AZIM_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.AZIM_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Configure Supabase runtime config
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os
          key = os.environ.get('AZIM_SUPABASE_PUBLISHABLE_KEY', '').strip()
          if not key:
              raise SystemExit('Missing repository secret AZIM_SUPABASE_PUBLISHABLE_KEY')
          Path('supabase-config.js').write_text(
              'window.AZIM_SUPABASE_URL = ' + json.dumps(os.environ['AZIM_SUPABASE_URL']) + ';\n'
              'window.AZIM_SUPABASE_ANON_KEY = ' + json.dumps(key) + ';\n',
              encoding='utf-8'
          )
      - name: Cache-bust catalog runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('products.html')
          s = p.read_text(encoding='utf-8')
          for v in ('108','109','110','111'):
              s = s.replace(f'custom-products.js?v={v}', 'custom-products.js?v=112')
          s = s.replace('custom-products.js', 'custom-products.js?v=112')
          p.write_text(s, encoding='utf-8')
          print('Catalog runtime cache-busted to v112')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
