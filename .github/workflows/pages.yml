name: Deploy Azim Abzar to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate catalog and preserve GitHub images exactly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path
          from PIL import Image

          root = Path('catalog_site_mapping_908')
          products_path = root / 'products.json'
          images_dir = root / 'images'

          data = json.loads(products_path.read_text(encoding='utf-8'))
          assert len(data) == 908, len(data)

          ids = [str(p.get('id', '')) for p in data]
          assert len(set(ids)) == 908
          assert all(re.fullmatch(r'P\d{4}', x) for x in ids)

          for p in data:
              assert str(p.get('name', '')).strip(), f"Empty product name: {p.get('id')}"

          image_files = sorted(images_dir.glob('P*.jpg'))
          image_ids = {p.stem for p in image_files}
          assert len(image_files) == 880, len(image_files)
          assert image_ids <= set(ids)
          assert len(set(ids) - image_ids) == 28

          # Do not rename, remap, recompress, or replace any image here.
          # The exact JPG bytes already stored in GitHub are the images deployed.
          checked = 0
          for p in image_files:
              with Image.open(p) as im:
                  assert im.width > 0 and im.height > 0
                  checked += 1
          print(f'CATALOG VALIDATED: 908 products, 880 exact GitHub JPGs, 28 intentionally missing, {checked} images readable')
          PY

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='.git/' ./ _site/
          test -s _site/products.html
          test -s _site/catalog_site_mapping_908/products.json
          test "$(find _site/catalog_site_mapping_908/images -maxdepth 1 -type f -name 'P*.jpg' | wc -l)" -eq 880

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
