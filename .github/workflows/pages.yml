name: Deploy Azim Abzar to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build exact 908-product catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, zlib
          from pathlib import Path
          root = Path('catalog_site_mapping_908')
          packed = (root / 'products-exact-compressed.b64').read_text(encoding='utf-8').strip()
          products = json.loads(zlib.decompress(base64.b64decode(packed)).decode('utf-8'))
          assert isinstance(products, list) and len(products) == 908
          assert [p['id'] for p in products] == [f'P{i:04d}' for i in range(1, 909)]
          assert len({p['id'] for p in products}) == 908
          assert all(str(p.get('name','')).strip() for p in products)
          for p in products:
              p['image'] = f'https://lzkrwtnylkordkwkdyzp.supabase.co/storage/v1/object/public/catalog-images/{p["id"]}.jpg'
          (root / 'products.json').write_text(json.dumps(products, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          print('EXACT CATALOG VERIFIED: 908 products P0001-P0908')
          print('IMAGE HOST: Supabase Storage / catalog-images')
          PY

      - name: Migrate existing product images to Supabase Storage in authenticated chunks
        if: hashFiles('catalog_site_mapping_908/images/P*.jpg') != ''
        shell: bash
        env:
          MIGRATOR_URL: https://lzkrwtnylkordkwkdyzp.supabase.co/functions/v1/catalog-image-migrator
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          total=0
          for offset in $(seq 0 50 900); do
            state=$(curl --fail --silent --show-error --max-time 120 -H "x-github-token: $GITHUB_TOKEN" "$MIGRATOR_URL?action=chunk&offset=$offset&limit=50")
            echo "$state"
            count=$(python -c 'import json,sys; print(json.load(sys.stdin)["count"])' <<< "$state")
            failed=$(python -c 'import json,sys; print(json.load(sys.stdin)["failedCount"])' <<< "$state")
            chunk_total=$(python -c 'import json,sys; print(json.load(sys.stdin)["total"])' <<< "$state")
            total=$((total + count))
            if [ "$failed" -gt 0 ]; then echo "Supabase migration reported failures"; exit 1; fi
            if [ "$count" -eq 0 ]; then break; fi
            echo "SUPABASE CHUNK VERIFIED: offset=$offset count=$count total=$chunk_total"
          done
          test "$total" -eq 881
          for sample in P0001 P0002 P0908; do
            curl --fail --silent --show-error -I "https://lzkrwtnylkordkwkdyzp.supabase.co/storage/v1/object/public/catalog-images/${sample}.jpg" >/dev/null
          done
          echo "SUPABASE IMAGE MIGRATION COMPLETE: $total existing product images"

      - name: Validate catalog and remote image configuration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('catalog_site_mapping_908')
          p = json.loads((root / 'products.json').read_text(encoding='utf-8'))
          assert isinstance(p, list) and len(p) == 908
          assert [x['id'] for x in p] == [f'P{i:04d}' for i in range(1, 909)]
          expected = 'https://lzkrwtnylkordkwkdyzp.supabase.co/storage/v1/object/public/catalog-images/'
          assert all(x.get('image','').startswith(expected) and x['image'].endswith(f'{x["id"]}.jpg') for x in p)
          assert 'catalog_site_mapping_908/products.json' in Path('products-v3.html').read_text(encoding='utf-8')
          print(f'CATALOG VERIFIED: {len(p)} products')
          print('REMOTE IMAGES VERIFIED: Supabase URLs for all 908 product IDs')
          PY

      - name: Upscale and sharpen 881 catalog images from original source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIGRATOR_URL: https://lzkrwtnylkordkwkdyzp.supabase.co/functions/v1/catalog-image-migrator
          SOURCE_COMMIT: a873c04bcd2a170c9dd35cc3239bcfb5c171e2d9
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input Pillow
          mkdir -p image-work
          processed=0
          missing=0
          failed=0
          for n in $(seq 1 908); do
            id=$(printf 'P%04d' "$n")
            src="https://raw.githubusercontent.com/sotonnasa-glitch/Azim-abzar/${SOURCE_COMMIT}/catalog_site_mapping_908/images/${id}.jpg"
            input="image-work/${id}.jpg"
            output="image-work/${id}-up.jpg"
            if ! curl -L --fail --silent --show-error --retry 5 --retry-delay 2 --connect-timeout 20 --max-time 120 -o "$input" "$src"; then
              echo "$id MISSING"
              missing=$((missing+1))
              continue
            fi
            python - "$input" "$output" <<'PY'
from PIL import Image, ImageOps, ImageFilter
import sys
src, dst = sys.argv[1], sys.argv[2]
with Image.open(src) as im:
    im = ImageOps.exif_transpose(im).convert('RGB')
    w, h = im.size
    nw, nh = int(round(w*2.0)), int(round(h*2.0))
    max_dim = 1800
    if max(nw, nh) > max_dim:
        s = max_dim / max(w, h)
        nw, nh = max(1, int(round(w*s))), max(1, int(round(h*s)))
    im = im.resize((nw, nh), Image.Resampling.LANCZOS)
    im = im.filter(ImageFilter.UnsharpMask(radius=1.15, percent=135, threshold=3))
    im.save(dst, 'JPEG', quality=90, optimize=True, progressive=True, subsampling=0)
PY
            response=$(curl -L --fail --silent --show-error --retry 5 --retry-delay 2 --connect-timeout 20 --max-time 120 -X POST -H "x-github-token: $GITHUB_TOKEN" -H "x-image-id: $id" -H "content-type: image/jpeg" --data-binary "@$output" "$MIGRATOR_URL?action=upload") || {
              echo "$id UPLOAD_ERROR"
              failed=$((failed+1))
              rm -f "$input" "$output"
              continue
            }
            if ! grep -q '"ok":true' <<< "$response"; then
              echo "$id UPLOAD_ERROR $response"
              failed=$((failed+1))
              rm -f "$input" "$output"
              continue
            fi
            processed=$((processed+1))
            rm -f "$input" "$output"
            if (( processed % 25 == 0 )); then echo "IMAGE ENHANCEMENT PROGRESS: processed=$processed missing=$missing failed=$failed"; fi
          done
          echo "IMAGE ENHANCEMENT SUMMARY: processed=$processed missing=$missing failed=$failed"
          test "$processed" -eq 881
          test "$missing" -eq 27
          test "$failed" -eq 0

      - name: Verify representative enhanced images
        shell: bash
        run: |
          set -euo pipefail
          for sample in P0001 P0339 P0908; do
            curl --fail --silent --show-error -I "https://lzkrwtnylkordkwkdyzp.supabase.co/storage/v1/object/public/catalog-images/${sample}.jpg" >/dev/null
          done
          echo 'ENHANCED SUPABASE IMAGES VERIFIED'

      - name: Remove heavy image archives and local product-image copies
        shell: bash
        run: |
          set -euo pipefail
          rm -f azim_abzar_images_part1.zip azim_abzar_images_part2.zip
          rm -rf catalog_site_mapping_908/images
          test ! -e azim_abzar_images_part1.zip
          test ! -e azim_abzar_images_part2.zip
          test ! -d catalog_site_mapping_908/images
          echo 'GITHUB IMAGE ASSETS REMOVED: ZIP parts and local product-image directory'

      - name: Persist lightweight catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repository changes to persist"
          else
            git commit -m "chore: store catalog images in Supabase Storage [skip ci]"
            git push origin HEAD:main
          fi

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='catalog_site_mapping_908/missing-images.zip' --exclude='catalog_site_mapping_908/*.b64' --exclude='azim_abzar_images_part*.zip' --exclude='catalog_site_mapping_908/images/' ./ _site/
          test -s _site/products.html
          test -s _site/products-v3.html
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('_site/catalog_site_mapping_908/products.json').read_text(encoding='utf-8'))
          assert isinstance(p, list) and len(p) == 908
          assert [x['id'] for x in p] == [f'P{i:04d}' for i in range(1, 909)]
          assert all(x['image'].startswith('https://lzkrwtnylkordkwkdyzp.supabase.co/storage/v1/object/public/catalog-images/') for x in p)
          assert not list(Path('_site').rglob('azim_abzar_images_part*.zip'))
          assert not list(Path('_site/catalog_site_mapping_908').glob('images/P*.jpg'))
          print('PAGES ARTIFACT VERIFIED: lightweight catalog with remote images')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
