name: Deploy Azim Abzar to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Wire products page into homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'href="products.html"' not in s:
              nav = re.search(r'<nav\b[^>]*class=["\']nav["\'][^>]*>(.*?)</nav>', s, flags=re.I|re.S)
              if nav:
                  inside = nav.group(1)
                  home = re.search(r'<a\b[^>]*href=["\']#home["\'][^>]*>.*?</a>', inside, flags=re.I|re.S)
                  if home:
                      updated = inside[:home.end()] + '<a href="products.html">محصولات</a>' + inside[home.end():]
                      s = s[:nav.start(1)] + updated + s[nav.end(1):]
                  else:
                      updated = '<a href="products.html">محصولات</a>' + inside
                      s = s[:nav.start(1)] + updated + s[nav.end(1):]
              else:
                  marker = '<header'
                  pos = s.find(marker)
                  if pos != -1:
                      s = s[:pos] + '<a href="products.html" style="display:none">محصولات</a>' + s[pos:]
              p.write_text(s, encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
