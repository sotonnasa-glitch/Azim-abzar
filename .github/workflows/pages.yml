name: Deploy Azim Abzar to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build high-quality source image set
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f catalog_site_ready_1200.zip.part-00 && -f catalog_site_ready_1200.zip.part-01 ]]; then
            cat catalog_site_ready_1200.zip.part-00 catalog_site_ready_1200.zip.part-01 > /tmp/catalog_site_ready_1200.zip
          elif [[ -f catalog_site_ready_1200.zip ]]; then
            cp catalog_site_ready_1200.zip /tmp/catalog_site_ready_1200.zip
          else
            echo 'High-quality source archive is missing.' >&2
            exit 1
          fi
          unzip -t -q /tmp/catalog_site_ready_1200.zip
          rm -rf /tmp/azim_hq
          mkdir -p /tmp/azim_hq
          unzip -q -o /tmp/catalog_site_ready_1200.zip -d /tmp/azim_hq
          count=$(find /tmp/azim_hq -maxdepth 1 -type f -regextype posix-extended -regex '.*/P[0-9]{5}\.jpg' | wc -l)
          test "$count" -eq 906

      - name: Deterministically map PDF source images to product IDs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy pillow opencv-python-headless scipy
          cat .github/geom/source.part0* > /tmp/source_geometry.b64
          base64 -d /tmp/source_geometry.b64 > /tmp/source_geometry.gz
          gzip -dc /tmp/source_geometry.gz > /tmp/source_image_geometry.json
          python - <<'PY'
          from pathlib import Path
          import json, shutil
          import numpy as np
          import cv2
          from PIL import Image, ImageOps
          from scipy.optimize import linear_sum_assignment

          root=Path('catalog_site_mapping_908')
          image_dir=root/'images'
          source_dir=Path('/tmp/azim_hq')
          products=json.loads((root/'products.json').read_text(encoding='utf-8'))
          geom=json.loads(Path('/tmp/source_image_geometry.json').read_text(encoding='utf-8'))
          source_geom=geom['items']
          source_files=sorted(source_dir.glob('P*.jpg'), key=lambda p:int(p.stem[1:]))
          assert len(products)==908
          assert len(source_files)==906 and len(source_geom)==906
          targets=[p for p in products if (image_dir/f"{p['id']}.jpg").is_file()]
          assert len(targets)==880, len(targets)

          by_page={}
          for idx,(pg,bbox) in enumerate(source_geom):
              by_page.setdefault(int(pg),[]).append(idx)
          products_by_page={}
          for p in targets:
              products_by_page.setdefault(int(p['page']),[]).append(p)

          orb=cv2.ORB_create(nfeatures=500,fastThreshold=8)
          bf=cv2.BFMatcher(cv2.NORM_HAMMING,crossCheck=False)

          def dhash(path):
              with Image.open(path) as im:
                  im=ImageOps.exif_transpose(im).convert('L').resize((65,64),Image.Resampling.LANCZOS)
                  a=np.asarray(im,dtype=np.uint8)
                  return np.packbits((a[:,1:]>a[:,:-1]).reshape(-1))

          def desc(path):
              im=cv2.imread(str(path),cv2.IMREAD_GRAYSCALE)
              if im is None:return None
              im=cv2.resize(im,(500,500),interpolation=cv2.INTER_AREA)
              return orb.detectAndCompute(im,None)[1]

          def good_matches(a,b):
              if a is None or b is None:return 0
              pairs=bf.knnMatch(a,b,k=2)
              return sum(1 for pair in pairs if len(pair)==2 and pair[0].distance < 0.8*pair[1].distance)

          source_hash=[dhash(p) for p in source_files]
          source_desc=[desc(p) for p in source_files]
          target_hash={p['id']:dhash(image_dir/f"{p['id']}.jpg") for p in targets}
          target_desc={p['id']:desc(image_dir/f"{p['id']}.jpg") for p in targets}

          selected=[]
          diagnostics=[]
          for page, plist in products_by_page.items():
              plist=sorted(plist,key=lambda p:(float(p['header_bbox_pt'][1]),float(p['header_bbox_pt'][0])))
              candidates_by_id={}
              for k,p in enumerate(plist):
                  x,y,w,h=map(float,p['header_bbox_pt'])
                  next_y=min([float(q['header_bbox_pt'][1]) for q in plist[k+1:] if float(q['header_bbox_pt'][1])>y+0.5] or [1e9])
                  cand=[]
                  for si in by_page.get(page,[]):
                      _,sb=source_geom[si]
                      x1,y1,x2,y2=map(float,sb)
                      cx=(x1+x2)/2.0
                      if y2 <= y+h-1.0: continue
                      if y1 >= next_y-1.0: continue
                      if not (x-8.0 <= cx <= x+w+8.0): continue
                      cand.append(si)
                  if not cand:
                      for si in by_page.get(page,[]):
                          x1,y1,x2,y2=map(float,source_geom[si][1])
                          overlap=max(0.0,min(x+w,x2)-max(x,x1))
                          if y2>y+h and overlap>0 and y1<next_y:
                              cand.append(si)
                  candidates_by_id[p['id']]=cand

              all_si=sorted(set(i for c in candidates_by_id.values() for i in c))
              row_ids=[p['id'] for p in plist if candidates_by_id[p['id']]]
              if len(row_ids)==0: continue
              cost=np.full((len(row_ids),len(all_si)),9999.0,dtype=np.float32)
              for ri,pid in enumerate(row_ids):
                  for cj,si in enumerate(all_si):
                      if si not in candidates_by_id[pid]: continue
                      hd=int(np.unpackbits(np.bitwise_xor(target_hash[pid],source_hash[si])).sum())
                      gm=good_matches(target_desc[pid],source_desc[si])
                      cost[ri,cj]=hd - gm*4.0
              rr,cc=linear_sum_assignment(cost)
              assigned=set()
              for ri,cj in zip(rr,cc):
                  if cost[ri,cj]>=9999: continue
                  pid=row_ids[int(ri)]; si=all_si[int(cj)]
                  hd=int(np.unpackbits(np.bitwise_xor(target_hash[pid],source_hash[si])).sum())
                  gm=good_matches(target_desc[pid],source_desc[si])
                  assigned.add(pid)
                  selected.append((pid,si,hd,gm,float(cost[ri,cj])))
                  if hd>85 and gm<5:
                      diagnostics.append({'id':pid,'source':source_files[si].name,'dhash':hd,'good_features':gm})
              missing=set(row_ids)-assigned
              if missing:
                  raise SystemExit(f'Missing deterministic image assignment on page {page}: {sorted(missing)}')

          assert len(selected)==880, len(selected)
          source_ids=[si for _,si,_,_,_ in selected]
          assert len(set(source_ids))==880, 'A PDF image instance was assigned to multiple products.'

          for pid,si,_,_,_ in selected:
              shutil.copy2(source_files[si],image_dir/f'{pid}.jpg')

          manifest={
            'method':'deterministic PDF geometry + page-local visual tie-break',
            'products_with_images':880,
            'pdf_source_images':906,
            'matched':len(selected),
            'unused_pdf_images':906-len(selected),
            'diagnostics':diagnostics,
            'quality_policy':'source JPG bytes copied directly; no re-encoding'
          }
          (root/'hq-image-match-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          if diagnostics:
              raise SystemExit(f'Refusing deployment because {len(diagnostics)} image mappings are low-confidence.')
          print('DETERMINISTIC IMAGE MAPPING OK: 880/880')
          PY

      - name: Validate complete catalog and image mapping
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('catalog_site_mapping_908')
          data=json.loads((root/'products.json').read_text(encoding='utf-8'))
          assert len(data)==908
          ids=[p['id'] for p in data]
          assert len(set(ids))==908 and all(re.fullmatch(r'P\d{4}',i) for i in ids)
          imgs={p.stem for p in (root/'images').glob('*.jpg')}
          assert len(imgs)==880 and imgs<=set(ids)
          assert len(set(ids)-imgs)==28
          m=json.loads((root/'hq-image-match-manifest.json').read_text(encoding='utf-8'))
          assert m['matched']==880 and not m['diagnostics']
          print('CATALOG + IMAGE VALIDATION OK')
          PY

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='.git/' \
            --exclude='catalog_site_ready_1200.zip.part-*' \
            --exclude='catalog_images_part_1' \
            --exclude='catalog_products_part_1_of_2.zip' \
            --exclude='catalog_site_ready_1200.zip' \
            --exclude='.github/source_image_geometry.json.gz.b64' \
            --exclude='.github/geom/' \
            ./ _site/
          test -s _site/products.html
          test -s _site/catalog_site_mapping_908/products.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
