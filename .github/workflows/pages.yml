name: Deploy Azim Abzar to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve public Supabase URL from frontend config
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('supabase-config.js').read_text(encoding='utf-8')
          m = re.search(r"AZIM_SUPABASE_URL\s*=\s*['\"]([^'\"]+)['\"]", text)
          if not m:
              raise SystemExit('AZIM_SUPABASE_URL_MISSING_FROM_CONFIG')
          url = m.group(1).rstrip('/')
          if not re.fullmatch(r'https://[A-Za-z0-9.-]+\.supabase\.co', url):
              raise SystemExit('AZIM_SUPABASE_URL_INVALID')
          with open('/tmp/supabase-url.env','w',encoding='utf-8') as f:
              f.write('AZIM_SUPABASE_URL=' + url + '\n')
          PY
          cat /tmp/supabase-url.env >> "$GITHUB_ENV"
          echo 'SUPABASE_PUBLIC_URL_RESOLVED_FROM_FRONTEND_CONFIG'

      - name: Build exact 908-product catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, zlib
          from pathlib import Path
          root = Path('catalog_site_mapping_908')
          packed = (root / 'products-exact-compressed.b64').read_text(encoding='utf-8').strip()
          products = json.loads(zlib.decompress(base64.b64decode(packed)).decode('utf-8'))
          assert isinstance(products, list) and len(products) == 908
          assert [p['id'] for p in products] == [f'P{i:04d}' for i in range(1, 909)]
          assert len({p['id'] for p in products}) == 908
          assert all(str(p.get('name','')).strip() for p in products)
          for p in products:
              supabase_url = __import__('os').environ['AZIM_SUPABASE_URL']
              p['image'] = f'{supabase_url}/storage/v1/object/public/catalog-images/{p["id"]}.jpg'
          (root / 'products.json').write_text(json.dumps(products, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          print('EXACT CATALOG VERIFIED: 908 products P0001-P0908')
          print('IMAGE HOST: Supabase Storage / catalog-images')
          PY

      - name: Verify catalog image fallback set
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for id in P0452 P0453 P0454 P0455 P0456 P0457 P0460 P0468 P0501 P0520 P0521 P0524 P0525 P0526 P0528 P0529 P0530 P0531 P0532 P0533 P0537 P0538 P0539 P0540 P0551 P0821 P0838 P0840; do
            if [ -f "catalog_site_mapping_908/images/${id}.jpg" ]; then
              echo "FALLBACK_IMAGE_OK: ${id}"
            else
              echo "FALLBACK_IMAGE_MISSING: ${id}"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "IMAGE_FALLBACKS_INCOMPLETE: $missing required local fallback images are missing"
            exit 1
          fi
      - name: Verify existing Supabase product images
        shell: bash
        run: |
          set -euo pipefail
          for sample in P0001 P0002 P0339 P0908; do
            curl --fail --silent --show-error -I "${AZIM_SUPABASE_URL}/storage/v1/object/public/catalog-images/${sample}.jpg" >/dev/null
          done
          echo 'REMOTE SUPABASE IMAGES VERIFIED'

      - name: Validate catalog and remote image configuration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('catalog_site_mapping_908')
          p = json.loads((root / 'products.json').read_text(encoding='utf-8'))
          assert isinstance(p, list) and len(p) == 908
          assert [x['id'] for x in p] == [f'P{i:04d}' for i in range(1, 909)]
          import os
          expected = os.environ['AZIM_SUPABASE_URL'].rstrip('/') + '/storage/v1/object/public/catalog-images/'
          assert all(x.get('image','').startswith(expected) and x['image'].endswith(f'{x["id"]}.jpg') for x in p)
          assert 'catalog_site_mapping_908/products.json' in Path('products-v4.html').read_text(encoding='utf-8')
          assert 'azim-home-categories.js?v=1' in Path('index.html').read_text(encoding='utf-8')
          assert 'azim-home-categories.css?v=1' in Path('index.html').read_text(encoding='utf-8')
          assert Path('azim-home-categories.js').is_file() and Path('azim-home-categories.js').stat().st_size > 1000
          assert Path('azim-home-categories.css').is_file() and Path('azim-home-categories.css').stat().st_size > 1000
          print(f'CATALOG VERIFIED: {len(p)} products')
          print('REMOTE IMAGES VERIFIED: Supabase URLs for all 908 product IDs')
          PY

      - name: Verify representative remote images
        shell: bash
        run: |
          set -euo pipefail
          for sample in P0001 P0339 P0908; do
            curl --fail --silent --show-error -I "${AZIM_SUPABASE_URL}/storage/v1/object/public/catalog-images/${sample}.jpg" >/dev/null
          done
          echo 'REMOTE SUPABASE IMAGES VERIFIED'

      - name: Validate Supabase Edge Function source
        shell: bash
        run: |
          set -euo pipefail
          test -s supabase/functions/azim-telegram-admin/index.ts
          test -s supabase/functions/azim-ai-chat/index.ts
          grep -q 'TELEGRAM_BOT_TOKEN' supabase/functions/azim-telegram-admin/index.ts
          grep -q 'tracking_code' supabase/functions/azim-telegram-admin/index.ts
          grep -q 'azim-ai-chat' supabase-config.js
          echo 'EDGE FUNCTIONS VERIFIED: Telegram admin + AI'

      - name: Validate backend source
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js
          node --input-type=module --check < api/chat.js
          node --check admin-app.js
          grep -q "^const PORT = Number(process.env.PORT || 3000);" server.js
          grep -q "AZIM_ALLOWED_ORIGIN" server.js
          grep -q "isAdmin(msg.chat?.id)" supabase/functions/azim-telegram-admin/index.ts
          echo 'BACKEND SOURCE VERIFIED'

      - name: Validate SQL source quoting
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE '(^|[[:space:]])as \$|^\$;|do \$ begin' supabase-schema.sql supabase-admin-schema.sql database/checkout-actions.sql
          grep -q 'as \$\$' supabase-schema.sql
          grep -q 'as \$\$' supabase-admin-schema.sql
          grep -q 'do \$\$ begin' database/checkout-actions.sql
          echo 'SQL DOLLAR QUOTING VERIFIED'

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='.image-enhancement-work/' --exclude='audit/' --exclude='supabase/functions/' --exclude='supabase/migrations/' --exclude='src/' --exclude='scripts/' --exclude='database/' --exclude='DEPLOYMENT_FA.md' --exclude='Dockerfile' --exclude='wrangler.jsonc' --exclude='worker.js' --exclude='robots.txt' --exclude='metadata.json' --exclude='*.pdf' --exclude='*.pem' --exclude='*.key' --exclude='.env*' --exclude='.github/' --exclude='catalog_site_mapping_908/hq-image-match-manifest.json' --exclude='catalog_site_mapping_908/product_sizes.json' --exclude='catalog_site_mapping_908/products.jsonl' --exclude='catalog_site_mapping_908/missing-images.zip' --exclude='catalog_site_mapping_908/missing-images-*.zip' --exclude='catalog_site_mapping_908/missing-mini-*.zip' --exclude='catalog_site_mapping_908/*.b64' --exclude='azim_abzar_images_part*.zip' --exclude='test.txt' --exclude='temp*.txt' --exclude='upscale-failures.json' --exclude='products-source-generated.json' --exclude='HANDOVER.md' --exclude='TRANSFER_READY_FA.md' --exclude='supabase-config.example.js' --exclude='.env.example' --exclude='*.sql' --exclude='server.js' --exclude='api/' ./ _site/
          test -s _site/products.html
          test -s _site/products-v4.html

      - name: Validate GitHub Pages artifact does not leak internal source
        shell: bash
        run: |
          set -euo pipefail
          test ! -d _site/audit
          test ! -e _site/catalog_site_mapping_908/hq-image-match-manifest.json
          test ! -e _site/catalog_site_mapping_908/product_sizes.json
          test ! -e _site/catalog_site_mapping_908/products.jsonl
          test ! -d _site/supabase/functions
          test ! -d _site/supabase/migrations
          test ! -d _site/database
          test ! -d _site/src
          test ! -d _site/scripts
          test ! -e _site/Dockerfile
          test ! -e _site/worker.js
          test ! -e _site/.env
          test ! -e _site/.env.example
          if find _site -type f -name '*.pdf' -print -quit | grep -q .; then
            echo 'INTERNAL_PDF_LEAK_DETECTED'
            exit 1
          fi
          echo 'PAGES_ARTIFACT_SECURITY_BOUNDARY_VERIFIED'

      - name: Validate admin panel runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('_site/admin.html').read_text(encoding='utf-8')
          assert 'پنل مدیریت' in html
          assert re.search(r'admin-app\.js\?v=\d+', html)
          match = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          assert match, 'ADMIN_INLINE_SCRIPT_MISSING'
          Path('/tmp/admin-inline.js').write_text(match[-1], encoding='utf-8')
          assert Path('_site/admin-app.js').is_file() and Path('_site/admin-app.js').stat().st_size > 1000
          assert Path('_site/admin-modern.css').is_file() and Path('_site/admin-modern.css').stat().st_size > 5000
          assert 'azMenuTrigger' in html and 'azMenuOverlay' in html
          cfg = Path('_site/supabase-config.js').read_text(encoding='utf-8')
          assert 'service_role' not in cfg and 'sb_publishable_' in cfg
          print('ADMIN PANEL VERIFIED: shell + external runtime + publishable config')
          PY
          node --check /tmp/admin-inline.js
          node --check _site/admin-app.js
          node --check _site/azim-live-content.js

      - name: Validate homepage asset files
        shell: bash
        run: |
          set -euo pipefail
          for asset in workshop_tools_hero_1789756528479.jpg industrial_garage_set_1789756545202.jpg cat_cabinet_trolley_1789756604644.jpg cat_wrenches_1789756566411.jpg garage_engine_work_1789760853632.jpg impact_air_wrench_1789760841938.jpg; do
            test -s "_site/assets/homepage/$asset"
          done
          echo 'HOMEPAGE_ASSETS_VERIFIED: hero + category images are included in Pages artifact'

      - name: Validate homepage runtime scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          html = Path('_site/index.html').read_text(encoding='utf-8')
          assert '<script src="./azim-motion.js?v=8" defer></script>' in html
          assert '<script src="./azim-home-copy.js?v=9" defer></script>' in html
          assert 'azim-live-content.js?v=4' in html
          assert 'azim-home-gallery.js' not in html
          print('HOMEPAGE VERIFIED: native hero gallery + optimized Motion V8 + copy V9')
          PY

      - name: Validate contact and catalog runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          contact = Path('_site/contact.html').read_text(encoding='utf-8')
          index = Path('_site/index.html').read_text(encoding='utf-8')
          products = Path('_site/products-v4.html').read_text(encoding='utf-8')
          assert 'azim-live-content.js?v=4' in contact
          assert 'supabase-config.js' in contact
          assert 'azim-live-content.js?v=4' in index
          assert 'loadLiveCatalog' in products
          assert 'livePriceData' in products
          assert '۰۲۱-۳۳۹۰۰۰۰۰ | ۰۹۱۲-۰۰۰۰۰۰۰' not in contact
          scripts = re.findall(r'<script>(.*?)</script>', contact, flags=re.S)
          inline = next((s for s in scripts if 'handleFormSubmission' in s), '')
          assert inline.strip(), 'CONTACT_INLINE_SCRIPT_MISSING'
          Path('/tmp/contact-inline.js').write_text(inline, encoding='utf-8')
          print('CONTACT/CATALOG VERIFIED: unified CMS + live variants + no placeholder mobile number')
          PY
          node --check /tmp/contact-inline.js

      - name: Validate AI assistant runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          ai = Path('_site/ai.html').read_text(encoding='utf-8')
          cfg = Path('_site/supabase-config.js').read_text(encoding='utf-8')
          live = Path('_site/azim-live-content.js').read_text(encoding='utf-8')
          assert 'supabase-config.js' in ai
          assert 'azim-live-content.js?v=4' in ai
          assert 'id="chatMessages"' in ai and 'id="chatForm"' in ai and 'id="chatInput"' in ai
          assert 'window.AZIM_AI_API_URL' in ai
          assert 'sb_publishable_' in cfg and 'functions/v1/azim-ai-chat' in cfg
          assert 'chatMessages' in live and 'chatForm' in live and 'chatInput' in live
          print('AI RUNTIME VERIFIED: Supabase Edge Function + live CMS + redesigned DOM')
          PY

      - name: Validate GitHub Pages security headers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          pages = ['index.html','products-v4.html','cart.html','contact.html','order-status.html','ai.html','admin.html','404.html']
          marker = '<meta http-equiv="Content-Security-Policy"'
          for name in pages:
              html = Path('_site', name).read_text(encoding='utf-8')
              assert marker in html, f'CSP_META_MISSING: {name}'
          print('GITHUB_PAGES_CSP_VERIFIED: all active HTML entry points contain a CSP meta policy')
          PY

      - name: Run automated regression tests
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          node server.js > /tmp/azim-express.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/azim-express.log >&2 || true
              echo 'EXPRESS_SERVER_EXITED_BEFORE_HEALTHCHECK' >&2
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/azim-express.log >&2 || true
            echo 'EXPRESS_SERVER_HEALTHCHECK_TIMEOUT' >&2
            exit 1
          fi
          npm test

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
