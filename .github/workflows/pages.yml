name: Deploy Azim Abzar to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate 1855-product catalog source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('azim-catalog-data.json').read_text(encoding='utf-8'))
          assert isinstance(data,list) and len(data)>=1855, f'catalog source has {len(data) if isinstance(data,list) else 0}, expected at least 1855'
          items=data[:1855]
          assert all(str(p.get('name','')).strip() for p in items), 'missing product name'
          assert all(float(p.get('price'))==float(p.get('original_price'))*1.2 for p in items), '20% price validation failed'
          assert items[0].get('code')=='PDF-0001' and items[-1].get('code')=='PDF-1855', 'PDF code range mismatch'
          print('CATALOG SOURCE OK: 1855 live products; 20% price rule verified')
          PY
      - name: Validate site files
        run: |
          test -s products.html
          test -s azim-catalog-chunk-1.js
          for f in azim-catalog-chunk-{2..8}.js; do test -s "$f"; done
          python - <<'PY'
          from pathlib import Path
          s=Path('products.html').read_text(encoding='utf-8')
          assert '1855' in s
          for f in ('index.html','products.html','admin.html','ai.html'):
              t=Path(f).read_text(encoding='utf-8').lower()
              assert '<html' in t and '</html>' in t, f'invalid html: {f}'
          print('SITE FILE VALIDATION OK')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
