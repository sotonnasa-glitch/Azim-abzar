name: Deploy Azim Abzar to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build high-quality image source archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f catalog_site_ready_1200.zip.part-00 && -f catalog_site_ready_1200.zip.part-01 ]]; then
            cat catalog_site_ready_1200.zip.part-00 catalog_site_ready_1200.zip.part-01 > /tmp/catalog_site_ready_1200.zip
          elif [[ -f catalog_site_ready_1200.zip ]]; then
            cp catalog_site_ready_1200.zip /tmp/catalog_site_ready_1200.zip
          else
            echo 'High-quality image archive is missing.' >&2
            exit 1
          fi
          unzip -t -q /tmp/catalog_site_ready_1200.zip
          rm -rf /tmp/azim_hq
          mkdir -p /tmp/azim_hq
          unzip -q -o /tmp/catalog_site_ready_1200.zip -d /tmp/azim_hq
          count=$(find /tmp/azim_hq -maxdepth 1 -type f -regextype posix-extended -regex '.*/P[0-9]{5}\.jpg' | wc -l)
          test "$count" -eq 906
          echo "High-quality source images: $count"

      - name: Match high-quality images to the authoritative product IDs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy pillow opencv-python-headless scipy
          python - <<'PY'
          from pathlib import Path
          import json, re, shutil
          import numpy as np
          import cv2
          from PIL import Image, ImageOps
          from scipy.optimize import linear_sum_assignment

          root = Path('catalog_site_mapping_908')
          image_dir = root / 'images'
          source_dir = Path('/tmp/azim_hq')
          current = sorted(image_dir.glob('P*.jpg'))
          source = sorted(source_dir.glob('P*.jpg'), key=lambda p: int(p.stem[1:]))
          if len(current) != 880:
              raise SystemExit(f'Expected 880 authoritative product images, found {len(current)}')
          if len(source) != 906:
              raise SystemExit(f'Expected 906 high-quality source images, found {len(source)}')

          orb = cv2.ORB_create(nfeatures=600, fastThreshold=10)
          bf = cv2.BFMatcher(cv2.NORM_HAMMING, crossCheck=False)

          def gray_feature(path):
              with Image.open(path) as im:
                  im = ImageOps.exif_transpose(im).convert('L').resize((65,64), Image.Resampling.LANCZOS)
                  a = np.asarray(im, dtype=np.uint8)
                  return np.packbits((a[:,1:] > a[:,:-1]).reshape(-1))

          def rgb_feature(path):
              with Image.open(path) as im:
                  im = ImageOps.exif_transpose(im).convert('RGB').resize((24,24), Image.Resampling.BILINEAR)
                  return np.asarray(im, dtype=np.float32).mean(axis=(0,1))

          def orb_desc(path):
              im = cv2.imread(str(path), cv2.IMREAD_GRAYSCALE)
              if im is None:
                  return None
              im = cv2.resize(im, (600,600), interpolation=cv2.INTER_AREA)
              _, des = orb.detectAndCompute(im, None)
              return des

          def hamming(a,b):
              return int(np.unpackbits(np.bitwise_xor(a,b)).sum())

          cur_hash=np.stack([gray_feature(p) for p in current])
          src_hash=np.stack([gray_feature(p) for p in source])
          cur_rgb=np.stack([rgb_feature(p) for p in current])
          src_rgb=np.stack([rgb_feature(p) for p in source])

          # Perceptual shortlist: the correct high-quality source for a product normally survives here.
          xor=np.bitwise_xor(cur_hash[:,None,:],src_hash[None,:,:])
          dh=np.unpackbits(xor,axis=2).sum(axis=2).astype(np.float32)
          color=np.linalg.norm(cur_rgb[:,None,:]-src_rgb[None,:,:],axis=2)/255.0
          shortlist_score=dh + color*10.0
          K=35
          shortlist=np.argpartition(shortlist_score,K-1,axis=1)[:,:K]

          cur_des=[orb_desc(p) for p in current]
          src_des=[orb_desc(p) for p in source]

          # Default high cost prevents unsupported pairings from entering the assignment.
          cost=np.full((len(current),len(source)), 1000.0, dtype=np.float32)
          goodmat=np.zeros_like(cost,dtype=np.int16)
          dhmat=np.full_like(cost,255,dtype=np.int16)

          for i in range(len(current)):
              des1=cur_des[i]
              for j in shortlist[i]:
                  j=int(j)
                  des2=src_des[j]
                  if des1 is None or des2 is None:
                      continue
                  pairs=bf.knnMatch(des1,des2,k=2)
                  good=sum(1 for pair in pairs if len(pair)==2 and pair[0].distance < 0.78*pair[1].distance)
                  goodmat[i,j]=min(good,32767)
                  dhij=int(dh[i,j])
                  dhmat[i,j]=dhij
                  # Higher good-feature count is much stronger evidence than pHash/color proximity.
                  cost[i,j]=500.0 - good*5.0 + dhij*0.55 + float(color[i,j])*5.0

          rows, cols = linear_sum_assignment(cost)
          assert len(rows)==len(current)

          matched=[]
          weak=[]
          for i,j in zip(rows,cols):
              c=float(cost[i,j]); good=int(goodmat[i,j]); hd=int(dhmat[i,j])
              if c>=900:
                  raise SystemExit(f'Unassigned/unsupported product image: {current[i].name}')
              matched.append((current[i],source[j],good,hd,c))
              if good < 8 and hd > 70:
                  weak.append({'id':current[i].stem,'source':source[j].name,'good_features':good,'dhash':hd,'cost':round(c,2)})

          mean_good=float(np.mean([x[2] for x in matched]))
          strong=sum(1 for x in matched if x[2] >= 12 or x[3] <= 55)
          if mean_good < 10 or strong < 820:
              raise SystemExit(f'Refusing deployment: image matching confidence is too low (mean_good={mean_good:.2f}, strong={strong}/880).')

          for target,src,good,hd,c in matched:
              # Source is already JPEG; copy bytes directly so there is no extra lossy JPEG encode.
              shutil.copy2(src,target)

          manifest={
              'authoritative_images':len(current),
              'high_quality_source_images':len(source),
              'matched':len(matched),
              'mean_good_features':round(mean_good,3),
              'strong_matches':strong,
              'weak_matches':weak,
              'source_archive':'catalog_site_ready_1200.zip.part-00 + part-01',
              'image_bytes_policy':'matched JPG bytes are copied directly without re-encoding'
          }
          (root/'hq-image-match-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({k:manifest[k] for k in ('authoritative_images','high_quality_source_images','matched','mean_good_features','strong_matches')},ensure_ascii=False))
          PY

      - name: Validate the complete 908-product catalog and image association
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path
          root=Path('catalog_site_mapping_908')
          data=json.loads((root/'products.json').read_text(encoding='utf-8'))
          assert isinstance(data,list) and len(data)==908, len(data)
          ids=[str(x.get('id','')) for x in data]
          assert len(set(ids))==908 and all(re.fullmatch(r'P\d{4}',x) for x in ids)
          img_ids={p.stem for p in (root/'images').glob('*.jpg')}
          assert img_ids <= set(ids)
          assert len(img_ids)==880
          assert len(set(ids)-img_ids)==28
          for p in (root/'images').glob('*.jpg'):
              assert p.stat().st_size > 1000, p
          m=json.loads((root/'hq-image-match-manifest.json').read_text(encoding='utf-8'))
          assert m['matched']==880
          assert m['strong_matches'] >= 820
          print('CATALOG, IDS, IMAGE COUNT, AND HIGH-QUALITY MAPPING VALIDATED')
          PY

      - name: Prepare Pages artifact without source archives
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='.git/' \
            --exclude='catalog_site_ready_1200.zip.part-*' \
            --exclude='catalog_images_part_1' \
            --exclude='catalog_products_part_1_of_2.zip' \
            ./ _site/
          test -s _site/products.html
          test -s _site/catalog_site_mapping_908/products.json
          test -s _site/catalog_site_mapping_908/hq-image-match-manifest.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
