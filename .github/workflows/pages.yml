name: Deploy Azim Abzar to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build complete 1855-product catalog chunks
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/sotonnasa-glitch/Azim-abzar/e1421ee34f63798246519a6e255621be4404fbb8/azim-catalog-data.js" -o /tmp/azim-catalog-data.js
          python - <<'PY'
          import base64, gzip, json, re
          from pathlib import Path
          text = Path('/tmp/azim-catalog-data.js').read_text(encoding='utf-8')
          m = re.search(r"const b='([^']+)'", text)
          assert m, 'compressed catalog payload not found'
          products = json.loads(gzip.decompress(base64.b64decode(m.group(1), validate=True)))
          assert isinstance(products, list), 'catalog payload is not a list'
          print('SOURCE PRODUCT COUNT:', len(products))
          keys = []
          seen = set()
          dedup = []
          for p in products:
              name = str(p[0]).strip() if len(p)>0 else ''
              price = int(p[1]) if len(p)>1 and p[1] is not None else 0
              original = int(p[2]) if len(p)>2 and p[2] is not None else price
              cat = str(p[3]).strip() if len(p)>3 and p[3] else 'hand'
              brand = str(p[4]).strip() if len(p)>4 and p[4] else 'بدون برند'
              k = (name, original, cat, brand)
              if k not in seen and name:
                  seen.add(k)
                  dedup.append([name, price, original, cat, brand])
          print('DEDUPED PRODUCT COUNT:', len(dedup))
          assert len(dedup) >= 1855, f'known-good source has only {len(dedup)} unique products'
          products = dedup[:1855]
          assert len(products) == 1855
          # Convert to the site's object shape while preserving the source/base price.
          out=[]
          for i,p in enumerate(products,1):
              out.append({
                'name': p[0],
                'price': int(p[2]),
                'original_price': int(p[2]),
                'category': p[3],
                'brand': p[4],
                'code': f'PDF-{i:04d}'
              })
          chunk_size = 54
          for path in Path('.').glob('azim-catalog-chunk-*.js'):
              path.unlink()
          for idx in range(0, len(out), chunk_size):
              n = idx // chunk_size + 1
              chunk = out[idx:idx+chunk_size]
              Path(f'azim-catalog-chunk-{n}.js').write_text(
                'window.AZIM_CATALOG_PARTS=window.AZIM_CATALOG_PARTS||[];window.AZIM_CATALOG_PARTS.push(' + json.dumps(chunk, ensure_ascii=False, separators=(',',':')) + ');',
                encoding='utf-8')
          assert len(list(Path('.').glob('azim-catalog-chunk-*.js'))) == 35
          print('CATALOG BUILD OK: 1855 products / 35 chunks')
          PY
      - name: Validate catalog chunks
        run: |
          test -s data/azim-catalog-runtime.js
          grep -q "AZIM_CATALOG_READY" data/azim-catalog-runtime.js
          for f in azim-catalog-chunk-{1..35}.js; do
            test -s "$f"
            grep -q "AZIM_CATALOG_PARTS" "$f"
          done
          echo "CATALOG CHUNKS VALID: 35/35"
      - name: Validate site files
        run: |
          test -s index.html
          test -s products.html
          grep -q "data/azim-catalog-runtime.js" products.html
          python - <<'PY'
          from pathlib import Path
          for f in ('index.html','products.html','admin.html','ai.html'):
              p=Path(f)
              assert p.exists() and p.stat().st_size>0
              s=p.read_text(encoding='utf-8').lower()
              assert '<html' in s and '</html>' in s
          print('SITE FILE VALIDATION OK')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
