name: Deploy Azim Abzar to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
env:
  AZIM_SUPABASE_URL: https://lzkrwtnylkordkwkdyzp.supabase.co
  AZIM_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.AZIM_SUPABASE_PUBLISHABLE_KEY }}
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages and enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Configure optional Supabase runtime config
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os
          key=os.environ.get('AZIM_SUPABASE_PUBLISHABLE_KEY','').strip()
          url=os.environ.get('AZIM_SUPABASE_URL','').strip()
          if key and url:
              Path('supabase-config.js').write_text('window.AZIM_SUPABASE_URL='+json.dumps(url)+';\nwindow.AZIM_SUPABASE_ANON_KEY='+json.dumps(key)+';\n',encoding='utf-8')
          else:
              Path('supabase-config.js').write_text('window.AZIM_SUPABASE_URL="";\nwindow.AZIM_SUPABASE_ANON_KEY="";\n',encoding='utf-8')
          PY
      - name: Validate catalog database
        run: |
          test -s data/azim-catalog-runtime.js
          grep -q "AZIM_CATALOG_READY" data/azim-catalog-runtime.js
          grep -q "DecompressionStream" data/azim-catalog-runtime.js
          python - <<'PY'
          import re,base64,gzip,json
          from pathlib import Path
          parts=[]
          for i in range(1,4):
              s=Path(f'data/catalog-part-{i:02d}.js').read_text(encoding='utf-8')
              m=re.search(r'window\.AZIM_CATALOG_B64_PARTS\['+str(i-1)+r'\]="([A-Za-z0-9+/=]+)"',s)
              assert m, f'base64 part {i} missing or invalid'
              parts.append(m.group(1).strip())
          joined=''.join(parts)
          joined=joined.rstrip('=')
          joined+='='*((4-len(joined)%4)%4)
          raw=base64.b64decode(joined,validate=True)
          data=json.loads(gzip.decompress(raw).decode('utf-8'))
          assert isinstance(data,list) and len(data)==1855, f'expected 1855 products, got {len(data)}'
          print('CATALOG PAYLOAD VALID:',len(data),'products')
          PY
      - name: Validate site files
        run: |
          test -s index.html
          test -s products.html
          test -s data/azim-catalog-runtime.js
          grep -q "azim-catalog-runtime.js" products.html
          python - <<'PY'
          from pathlib import Path
          for f in ('index.html','products.html'):
              s=Path(f).read_text(encoding='utf-8')
              assert '<html' in s.lower() and '</html>' in s.lower()
          print('SITE VALIDATION OK')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
