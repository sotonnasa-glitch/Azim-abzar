name: Deploy Azim Abzar to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build high-quality source image set
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f catalog_site_ready_1200.zip.part-00 && -f catalog_site_ready_1200.zip.part-01 ]]; then
            cat catalog_site_ready_1200.zip.part-00 catalog_site_ready_1200.zip.part-01 > /tmp/catalog_site_ready_1200.zip
          elif [[ -f catalog_site_ready_1200.zip ]]; then
            cp catalog_site_ready_1200.zip /tmp/catalog_site_ready_1200.zip
          else
            echo 'High-quality source archive is missing.' >&2
            exit 1
          fi
          unzip -t -q /tmp/catalog_site_ready_1200.zip
          rm -rf /tmp/azim_hq
          mkdir -p /tmp/azim_hq
          unzip -q -o /tmp/catalog_site_ready_1200.zip -d /tmp/azim_hq
          count=$(find /tmp/azim_hq -maxdepth 1 -type f -regextype posix-extended -regex '.*/P[0-9]{5}\.jpg' | wc -l)
          test "$count" -eq 906

      - name: Align all high-quality images to product IDs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy pillow
          python - <<'PY'
          from pathlib import Path
          import json, re, shutil
          import numpy as np
          from PIL import Image, ImageOps

          ROOT=Path('catalog_site_mapping_908')
          IMG=ROOT/'images'
          SRC=Path('/tmp/azim_hq')
          products=json.loads((ROOT/'products.json').read_text(encoding='utf-8'))
          targets=[p for p in products if (IMG/f"{p['id']}.jpg").is_file()]
          targets=sorted(targets,key=lambda p:int(re.search(r'(\d+)$',p['id']).group(1)))
          sources=sorted(SRC.glob('P*.jpg'),key=lambda p:int(re.search(r'(\d+)$',p.stem).group(1)))
          assert len(products)==908
          assert len(targets)==880, len(targets)
          assert len(sources)==906, len(sources)

          def features(path):
              with Image.open(path) as im:
                  im=ImageOps.exif_transpose(im).convert('RGB')
                  a=np.asarray(im)
                  fg=np.any(a<245,axis=2)
                  ys,xs=np.where(fg)
                  if len(xs)>=20:
                      pad=max(4,int(0.04*max(im.size)))
                      x0=max(0,int(xs.min())-pad); x1=min(im.width,int(xs.max())+pad+1)
                      y0=max(0,int(ys.min())-pad); y1=min(im.height,int(ys.max())+pad+1)
                      im=im.crop((x0,y0,x1,y1))
                  gray=np.asarray(im.convert('L').resize((8,8),Image.Resampling.LANCZOS),dtype=np.float32)/255.0
                  big=np.asarray(im.convert('L').resize((65,64),Image.Resampling.LANCZOS),dtype=np.uint8)
                  dh=np.packbits((big[:,1:]>big[:,:-1]).reshape(-1))
                  mean=np.asarray(im.resize((1,1),Image.Resampling.BILINEAR),dtype=np.float32).reshape(-1)/255.0
                  return gray.reshape(-1),dh,mean

          t_tiny=[]; t_dh=[]; t_mean=[]
          for p in targets:
              x=features(IMG/f"{p['id']}.jpg"); t_tiny.append(x[0]); t_dh.append(x[1]); t_mean.append(x[2])
          s_tiny=[]; s_dh=[]; s_mean=[]
          for p in sources:
              x=features(p); s_tiny.append(x[0]); s_dh.append(x[1]); s_mean.append(x[2])
          t_tiny=np.asarray(t_tiny,np.float32); s_tiny=np.asarray(s_tiny,np.float32)
          t_dh=np.asarray(t_dh,np.uint8); s_dh=np.asarray(s_dh,np.uint8)
          t_mean=np.asarray(t_mean,np.float32); s_mean=np.asarray(s_mean,np.float32)

          xor=np.bitwise_xor(t_dh[:,None,:],s_dh[None,:,:])
          hamming=np.unpackbits(xor,axis=2).sum(axis=2).astype(np.float32)
          color=np.linalg.norm(t_mean[:,None,:]-s_mean[None,:,:],axis=2)

          n=len(targets); m=len(sources); SKIP=42.0
          dp=np.full((n+1,m+1),np.inf,dtype=np.float32)
          act=np.zeros((n+1,m+1),dtype=np.int8)
          dp[0,:]=np.arange(m+1,dtype=np.float32)*SKIP
          for i in range(1,n+1):
              lo=i; hi=min(m,i+26)
              for j in range(lo,hi+1):
                  match=hamming[i-1,j-1] + 18.0*np.mean(np.abs(t_tiny[i-1]-s_tiny[j-1])) + 8.0*color[i-1,j-1]
                  a=dp[i-1,j-1]+match
                  b=dp[i,j-1]+SKIP
                  if a<=b:
                      dp[i,j]=a; act[i,j]=1
                  else:
                      dp[i,j]=b; act[i,j]=2

          i=n; j=m; mapping=[]; skipped=[]
          while i>0 or j>0:
              if i>0 and j>0 and act[i,j]==1:
                  mapping.append((i-1,j-1)); i-=1; j-=1
              elif j>0 and act[i,j]==2:
                  skipped.append(j-1); j-=1
              else:
                  raise SystemExit(f'Alignment backtrack failed at i={i}, j={j}')
          mapping.reverse(); skipped.reverse()
          assert len(mapping)==880, len(mapping)
          assert len(skipped)==26, len(skipped)
          assert [j for _,j in mapping]==sorted(j for _,j in mapping)
          assert not set(j for _,j in mapping)&set(skipped)

          pairs=[]; weak=[]
          for ti,si in mapping:
              c=float(hamming[ti,si] + 18.0*np.mean(np.abs(t_tiny[ti]-s_tiny[si])) + 8.0*color[ti,si])
              lo=max(0,si-6); hi=min(m,si+7)
              local=[q for q in range(lo,hi) if q!=si]
              if local:
                  local_best=float(np.min(hamming[ti,local] + 18.0*np.mean(np.abs(t_tiny[ti,None,:]-s_tiny[local,:]),axis=1) + 8.0*color[ti,local]))
              else:
                  local_best=999.0
              margin=local_best-c
              rec={'product':targets[ti]['id'],'source':sources[si].name,'cost':round(c,3),'margin':round(margin,3)}
              pairs.append(rec)
              if c>52 or margin<1.5:
                  weak.append(rec)
              shutil.copy2(sources[si],IMG/f"{targets[ti]['id']}.jpg")

          manifest={
              'method':'monotonic sequence alignment of all product images to 906 PDF image instances',
              'products':908,
              'product_images':880,
              'source_images':906,
              'matched':len(mapping),
              'skipped_non_product_source_images':len(skipped),
              'skipped_source_files':[sources[k].name for k in skipped],
              'ambiguous_count':len(weak),
              'matches':pairs,
              'quality_policy':'source JPG bytes copied directly; no re-encoding'
          }
          (ROOT/'hq-image-match-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(f'IMAGE ALIGNMENT OK: 880 products mapped to 906 source instances; low-confidence matches logged: {len(weak)}')
          PY

      - name: Validate complete catalog, text records, and high-quality image mapping
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('catalog_site_mapping_908')
          data=json.loads((root/'products.json').read_text(encoding='utf-8'))
          assert len(data)==908
          ids=[str(p.get('id','')) for p in data]
          assert len(set(ids))==908 and all(re.fullmatch(r'P\d{4}',i) for i in ids)
          for p in data:
              assert str(p.get('name','')).strip(), f'Empty product name: {p.get("id")}'
          imgs={p.stem for p in (root/'images').glob('*.jpg')}
          assert len(imgs)==880 and imgs<=set(ids)
          assert len(set(ids)-imgs)==28
          m=json.loads((root/'hq-image-match-manifest.json').read_text(encoding='utf-8'))
          assert m['matched']==880 and m['skipped_non_product_source_images']==26
          assert len(m['matches'])==880
          print('CATALOG + TEXT RECORDS + IMAGE MAPPING VALIDATED')
          PY

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='.git/' \
            --exclude='catalog_site_ready_1200.zip.part-*' \
            --exclude='catalog_images_part_1' \
            --exclude='catalog_products_part_1_of_2.zip' \
            --exclude='catalog_site_ready_1200.zip' \
            --exclude='.github/source_image_geometry.json.gz.b64' \
            --exclude='.github/geom/' \
            ./ _site/
          test -s _site/products.html
          test -s _site/catalog_site_mapping_908/products.json
          test -s _site/catalog_site_mapping_908/hq-image-match-manifest.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
