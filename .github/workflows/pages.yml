name: Deploy Azim Abzar to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
env:
  AZIM_SUPABASE_URL: https://lzkrwtnylkordkwkdyzp.supabase.co
  AZIM_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.AZIM_SUPABASE_PUBLISHABLE_KEY }}
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages and enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Configure optional Supabase runtime config
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os
          key=os.environ.get('AZIM_SUPABASE_PUBLISHABLE_KEY','').strip()
          url=os.environ.get('AZIM_SUPABASE_URL','').strip()
          if key and url:
              Path('supabase-config.js').write_text('window.AZIM_SUPABASE_URL='+json.dumps(url)+';\nwindow.AZIM_SUPABASE_ANON_KEY='+json.dumps(key)+';\n',encoding='utf-8')
          else:
              Path('supabase-config.js').write_text('window.AZIM_SUPABASE_URL="";\nwindow.AZIM_SUPABASE_ANON_KEY="";\n',encoding='utf-8')
          PY
      - name: Restore catalog as local browser asset
        run: |
          git fetch origin aae3e418096c4f0624217872e04e8728a2b8a826 --depth=1
          mkdir -p data
          git show aae3e418096c4f0624217872e04e8728a2b8a826:azim-catalog-data.js > data/azim-catalog-runtime.js
          test -s data/azim-catalog-runtime.js
          grep -q "const b=" data/azim-catalog-runtime.js
      - name: Validate site files
        run: |
          test -s index.html
          test -s products.html
          test -s data/azim-catalog-runtime.js
          grep -q "azim-catalog-runtime.js" products.html
          python - <<'PY'
          from pathlib import Path
          for f in ('index.html','products.html'):
              s=Path(f).read_text(encoding='utf-8')
              assert '<html' in s.lower() and '</html>' in s.lower(), f'{f}: invalid HTML shell'
          runtime=Path('data/azim-catalog-runtime.js').read_text(encoding='utf-8')
          assert 'const b=' in runtime, 'catalog runtime payload missing'
          print('SITE VALIDATION OK')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
