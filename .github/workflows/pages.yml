name: Deploy Azim Abzar to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
env:
  AZIM_SUPABASE_URL: https://lzkrwtnylkordkwkdyzp.supabase.co
  AZIM_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.AZIM_SUPABASE_PUBLISHABLE_KEY }}
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Restore verified full catalog loader
        run: |
          git fetch --no-tags --depth=1 origin e1421ee34f63798246519a6e255621be4404fbb8
          git show e1421ee34f63798246519a6e255621be4404fbb8:azim-catalog-data.js > azim-catalog-data.js
      - name: Configure Supabase runtime config
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os
          key=os.environ.get('AZIM_SUPABASE_PUBLISHABLE_KEY','').strip()
          if not key: raise SystemExit('Missing repository secret AZIM_SUPABASE_PUBLISHABLE_KEY')
          Path('supabase-config.js').write_text('window.AZIM_SUPABASE_URL='+json.dumps(os.environ['AZIM_SUPABASE_URL'])+';\nwindow.AZIM_SUPABASE_ANON_KEY='+json.dumps(key)+';\n',encoding='utf-8')
          PY
      - name: Fix catalog rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('products.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('price:Number(p.price)||0','price:p.price==null?null:Number(p.price)||0')
          s=s.replace('original_price:Number(p.original_price??p.price)||0','original_price:p.original_price==null?null:Number(p.original_price)||0')
          marker="const fa=n=>new Intl.NumberFormat('fa-IR').format(Number(n)||0);"
          if marker in s and 'const money=n=>n==null' not in s: s=s.replace(marker,marker+"const money=n=>n==null?'استعلام قیمت':fa(n);")
          s=s.replace('fa(p.original_price)','money(p.original_price)').replace('fa(p.price)','money(p.price)')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Cache-bust catalog runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('products.html'); s=p.read_text(encoding='utf-8')
          for v in ('108','109','110','111','112','113','114','115','116','117','118','119','120','121'):
              s=s.replace(f'custom-products.js?v={v}','custom-products.js?v=122')
          s=s.replace('azim-catalog-data.js"','azim-catalog-data.js?v=122"')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate catalog source and additions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,base64,gzip,json
          s=Path('azim-catalog-data.js').read_text(encoding='utf-8')
          b=re.search(r"const b='([^']+)'",s,re.S).group(1)
          raw=json.loads(gzip.decompress(base64.b64decode(b)))
          if len(raw)!=2101: raise SystemExit(f'Historical catalog count mismatch: {len(raw)}')
          c=Path('custom-products.js').read_text(encoding='utf-8')
          if c.count("],['")+1 < 23: raise SystemExit('Missing PDF additions in custom-products.js')
          print('VALID: 2101 verified source products + 23 PDF additions = 2124 total; 19 quote-price additions')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
