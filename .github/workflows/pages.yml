name: Deploy Azim Abzar to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract authoritative 908-product catalog
        if: ${{ hashFiles('catalog_site_mapping_908.zip') != '' }}
        run: |
          set -e
          rm -rf /tmp/azim_catalog_extract
          mkdir -p /tmp/azim_catalog_extract
          unzip -q -o catalog_site_mapping_908.zip -d /tmp/azim_catalog_extract
          test -s /tmp/azim_catalog_extract/catalog_site_mapping_908/products.json
          test -d /tmp/azim_catalog_extract/catalog_site_mapping_908/images
          rm -rf catalog_site_mapping_908
          mv /tmp/azim_catalog_extract/catalog_site_mapping_908 catalog_site_mapping_908
          rm -f catalog_site_mapping_908.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Authoritative catalog already present.'
          else
            git commit -m 'Use authoritative 908-product catalog'
            git push
          fi

      - name: Match uploaded high-quality images to authoritative products
        run: |
          set -e
          python -m pip install --quiet pillow numpy

          ARCHIVE=''
          for f in catalog_site_ready_1200.zip catalog_images_part_1 catalog_products_part_1_of_2.zip; do
            if [ -f "$f" ] && unzip -t -q "$f" >/dev/null 2>&1; then
              ARCHIVE="$f"
              break
            fi
          done

          if [ -z "$ARCHIVE" ]; then
            echo 'No uploaded image archive found; keeping authoritative images.'
            exit 0
          fi

          export AZIM_HQ_ARCHIVE="$ARCHIVE"
          rm -rf /tmp/azim_hq
          mkdir -p /tmp/azim_hq
          unzip -q -o "$ARCHIVE" -d /tmp/azim_hq

          python - <<'PY'
          from pathlib import Path
          import json, shutil, re, os
          import numpy as np
          from PIL import Image, ImageOps

          root = Path('catalog_site_mapping_908')
          old_dir = root / 'images'
          old_files = sorted(old_dir.glob('P*.jpg'))
          candidates = sorted(
              p for p in Path('/tmp/azim_hq').rglob('*')
              if p.is_file() and p.suffix.lower() in {'.jpg','.jpeg','.png','.webp'}
          )
          candidates = [p for p in candidates if re.fullmatch(r'P\d{5}\.(jpg|jpeg|png|webp)', p.name, re.I)]
          if not old_files or not candidates:
              raise SystemExit('No authoritative or candidate product images found.')

          def feature(path):
              with Image.open(path) as im:
                  im = ImageOps.exif_transpose(im).convert('L').resize((9,8), Image.Resampling.LANCZOS)
                  a = np.asarray(im, dtype=np.uint8)
                  bits = (a[:,1:] > a[:,:-1]).reshape(-1)
                  # 64-bit dHash, packed into one uint64 for fast vectorized Hamming distance.
                  h = np.uint64(0)
                  for bit in bits:
                      h = (h << np.uint64(1)) | np.uint64(bool(bit))
                  rgb = ImageOps.exif_transpose(Image.open(path)).convert('RGB').resize((8,8), Image.Resampling.BILINEAR)
                  mean = np.asarray(rgb, dtype=np.float32).mean(axis=(0,1))
                  return h, mean

          old_hash=[]; old_rgb=[]
          for p in old_files:
              h,c = feature(p); old_hash.append(h); old_rgb.append(c)
          cand_hash=[]; cand_rgb=[]
          for p in candidates:
              h,c = feature(p); cand_hash.append(h); cand_rgb.append(c)
          old_hash=np.asarray(old_hash,dtype=np.uint64)
          cand_hash=np.asarray(cand_hash,dtype=np.uint64)
          old_rgb=np.asarray(old_rgb,dtype=np.float32)
          cand_rgb=np.asarray(cand_rgb,dtype=np.float32)

          # Vectorized Hamming distance over all 908x906 candidates.
          xor = np.bitwise_xor(old_hash[:,None], cand_hash[None,:])
          bytes_view = xor.view(np.uint8).reshape(len(old_files), len(candidates), 8)
          bits = np.unpackbits(bytes_view, axis=2).sum(axis=2)
          # Color is only a tie-breaker; image structure dominates.
          color = np.linalg.norm(old_rgb[:,None,:]-cand_rgb[None,:,:],axis=2) / 255.0
          cost = bits.astype(np.float32) + color * 8.0

          # Unique one-to-one assignment: process pairs in globally best order.
          flat = np.argsort(cost, axis=None)
          used_old=np.zeros(len(old_files),dtype=bool)
          used_cand=np.zeros(len(candidates),dtype=bool)
          assignments=[]
          for idx in flat:
              oi,ci=np.unravel_index(int(idx),cost.shape)
              if used_old[oi] or used_cand[ci]:
                  continue
              h=int(bits[oi,ci]); co=float(cost[oi,ci])
              if h>50 and co>58:
                  continue
              used_old[oi]=True; used_cand[ci]=True
              assignments.append((oi,ci,h,co))
              if len(assignments)>=len(old_files):
                  break

          replaced=0; weak=[]
          for oi,ci,h,co in assignments:
              old=old_files[oi]; cand=candidates[ci]; target=old_dir/old.name
              if h<=45 or co<=52:
                  if cand.suffix.lower()=='.jpg':
                      shutil.copy2(cand,target)
                  else:
                      with Image.open(cand) as im:
                          ImageOps.exif_transpose(im).convert('RGB').save(target,format='JPEG',quality=95,subsampling=0)
                  replaced+=1
              else:
                  weak.append({'id':old.stem,'candidate':cand.name,'hamming':h,'cost':round(co,3)})

          manifest={
              'archive':Path(os.environ['AZIM_HQ_ARCHIVE']).name,
              'candidate_images':len(candidates),
              'authoritative_products':len(old_files),
              'replaced':replaced,
              'weak_matches':weak,
              'note':'High-confidence matches replace authoritative product images. Existing JPG source bytes are copied without JPEG re-encoding.'
          }
          (root/'hq-image-match-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')

          if replaced < min(800,len(old_files)):
              raise SystemExit(f'Too few high-confidence matches: {replaced}; refusing to deploy uncertain image mapping.')
          print(f'High-quality image mapping completed: {replaced}/{len(old_files)} authoritative images replaced.')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog_site_mapping_908/images catalog_site_mapping_908/hq-image-match-manifest.json
          if git diff --cached --quiet; then
            echo 'No image changes detected.'
          else
            git commit -m 'Map uploaded high-quality product images correctly'
            git push
          fi

      - name: Validate authoritative catalog and image mapping
        run: |
          set -e
          python - <<'PY'
          import json, re
          from pathlib import Path
          p=Path('catalog_site_mapping_908/products.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          assert isinstance(data,list) and len(data)==908, f'Expected 908 products, found {len(data)}'
          ids=[str(x.get('id','')) for x in data]
          assert len(set(ids))==908 and all(re.fullmatch(r'P\d{4}',x) for x in ids), 'Invalid or duplicate IDs'
          image_dir=Path('catalog_site_mapping_908/images')
          image_ids={p.stem for p in image_dir.glob('*.jpg')}
          assert not (image_ids-set(ids)), 'Unknown image IDs exist'
          assert len(image_ids)==880, f'Expected 880 mapped images, found {len(image_ids)}'
          assert len(set(ids)-image_ids)==28, 'Expected exactly 28 products without images'
          for img in image_dir.glob('*.jpg'):
              assert img.stat().st_size>1000, f'Bad/empty image: {img}'
          print('CATALOG AND IMAGE VALIDATION OK')
          PY

      - name: Validate site files
        run: |
          set -e
          test -s products.html
          python - <<'PY'
          from pathlib import Path
          s=Path('products.html').read_text(encoding='utf-8')
          assert 'products.json' in s
          assert 'IMAGE_DIR' in s and 'p.id' in s
          for f in ('index.html','products.html','admin.html','ai.html'):
              t=Path(f).read_text(encoding='utf-8').lower()
              assert '<html' in t and '</html>' in t, f'Invalid HTML: {f}'
          print('SITE FILE VALIDATION OK')
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
