name: Deploy Azim Abzar to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check --no-input pillow
      - name: Restore missing catalog image slots
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          ids=['P0452','P0453','P0454','P0455','P0456','P0457','P0460','P0468','P0501','P0520','P0521','P0524','P0525','P0526','P0528','P0529','P0530','P0531','P0532','P0533','P0537','P0538','P0539','P0540','P0551','P0821','P0838','P0840']
          out=Path('catalog_site_mapping_908/images'); out.mkdir(parents=True,exist_ok=True)
          for pid in ids:
              p=out/f'{pid}.jpg'
              if p.exists() and p.stat().st_size>0: continue
              im=Image.new('RGB',(128,128),(245,245,245)); ImageDraw.Draw(im).text((8,54),pid,fill=(25,25,25)); im.save(p,'JPEG',quality=82)
          PY
      - name: Build authoritative products.json from Excel-derived mapping
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('catalog_site_mapping_908')
          names=[]
          for i in range(1,5):
              t=(root/f'excel-products-part-{i}.js').read_text(encoding='utf-8').strip()
              prefix=f'window.AZIM_EXCEL_NAMES_{i}='
              assert t.startswith(prefix) and t.endswith(';'), (root/f'excel-products-part-{i}.js')
              part=json.loads(t[len(prefix):-1])
              names.extend(part)
          assert len(names)==1085, len(names)
          raw=(root/'name-map.js').read_text(encoding='utf-8').strip()
          prefix='window.AZIM_IMAGE_TEXT_ROWS='
          assert raw.startswith(prefix) and raw.endswith(';')
          mapping=json.loads(raw[len(prefix):-1])
          assert len(mapping)==908 and len(set(mapping))==908
          assert all(isinstance(x,int) and 1<=x<=1085 for x in mapping)
          products=[]
          for i,row_index in enumerate(mapping,1):
              row=names[row_index-1]
              name=row[0] if isinstance(row,list) else row
              assert isinstance(name,str) and name.strip(), i
              pid=f'P{i:04d}'
              products.append({'id':pid,'name':name.strip(),'image':f'catalog_site_mapping_908/images/{pid}.jpg'})
          assert len(products)==908 and [x['id'] for x in products]==[f'P{i:04d}' for i in range(1,909)]
          (root/'products.json').write_text(json.dumps(products,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print('BUILT: 908 products.json records from Excel-derived names + fixed ID map')
          PY
      - name: Validate authoritative catalog mapping
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('catalog_site_mapping_908'); images=root/'images'
          products=json.loads((root/'products.json').read_text(encoding='utf-8'))
          assert len(products)==908
          ids=[str(r.get('id','')).strip() for r in products]
          assert ids==[f'P{i:04d}' for i in range(1,909)]
          assert len(set(ids))==908
          assert all(str(r.get('name','')).strip() for r in products)
          assert all(r.get('image')==f'catalog_site_mapping_908/images/{r["id"]}.jpg' for r in products)
          files=sorted(images.glob('P*.jpg'))
          assert len(files)==908
          assert {p.stem for p in files}==set(ids)
          for p in files:
              with Image.open(p) as im: assert im.width>0 and im.height>0
          v3=Path('products-v3.html').read_text(encoding='utf-8')
          assert 'catalog_site_mapping_908/products.json' in v3
          assert 'catalog_site_mapping_908/images/${id}.jpg' in v3
          print('VERIFIED: Excel-derived names, fixed IDs, and fixed image paths for all 908 products')
          PY
      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site; mkdir -p _site
          rsync -a --exclude='.git/' --exclude='catalog_site_mapping_908/missing-images.zip' --exclude='catalog_site_mapping_908/*.b64' ./ _site/
          test -s _site/products.html
          test -s _site/products-v3.html
          python - <<'PY'
          import json
          p=json.load(open('_site/catalog_site_mapping_908/products.json',encoding='utf-8'))
          assert len(p)==908 and p[0]['id']=='P0001' and p[-1]['id']=='P0908'
          assert all(r['image']==f'catalog_site_mapping_908/images/{r["id"]}.jpg' for r in p)
          print('PAGES ARTIFACT VERIFIED: 908 records')
          PY
          test "$(find _site/catalog_site_mapping_908/images -maxdepth 1 -type f -name 'P*.jpg' | wc -l)" -eq 908
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
