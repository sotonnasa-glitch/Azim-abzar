name: Deploy Azim Abzar to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate catalog chunks
        run: |
          test -s data/azim-catalog-runtime.js
          grep -q "AZIM_CATALOG_READY" data/azim-catalog-runtime.js
          for f in azim-catalog-chunk-{1..8}.js; do
            test -s "$f"
            grep -q "AZIM_CATALOG_PARTS" "$f"
          done
          echo "CATALOG CHUNKS VALID"
      - name: Validate site files
        run: |
          test -s index.html
          test -s products.html
          grep -q "azim-catalog-runtime.js" products.html
          python - <<'PY'
          from pathlib import Path
          for f in ('index.html','products.html','admin.html','ai.html'):
              p=Path(f)
              assert p.exists() and p.stat().st_size>0, f'missing/empty {f}'
              s=p.read_text(encoding='utf-8')
              assert '<html' in s.lower() and '</html>' in s.lower(), f'invalid HTML shell: {f}'
          print('SITE FILE VALIDATION OK')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
