name: Deploy Azim Abzar to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
env:
  AZIM_SUPABASE_URL: https://lzkrwtnylkordkwkdyzp.supabase.co
  AZIM_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.AZIM_SUPABASE_PUBLISHABLE_KEY }}
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Configure optional Supabase runtime config
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os
          key=os.environ.get('AZIM_SUPABASE_PUBLISHABLE_KEY','').strip()
          url=os.environ.get('AZIM_SUPABASE_URL','').strip()
          if key and url:
              Path('supabase-config.js').write_text('window.AZIM_SUPABASE_URL='+json.dumps(url)+';\nwindow.AZIM_SUPABASE_ANON_KEY='+json.dumps(key)+';\n',encoding='utf-8')
          else:
              Path('supabase-config.js').write_text('window.AZIM_SUPABASE_URL="";\nwindow.AZIM_SUPABASE_ANON_KEY="";\n',encoding='utf-8')
          PY
      - name: Build plain JSON catalog for browser
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, json
          src=Path('data/products-db.gz.b64')
          raw=''.join(src.read_text(encoding='utf-8-sig').split())
          blob=base64.b64decode(raw, validate=True)
          payload=gzip.decompress(blob)
          data=json.loads(payload.decode('utf-8'))
          if not isinstance(data,list) or len(data) < 2000:
              raise SystemExit(f'Invalid catalog: {len(data) if isinstance(data,list) else "not-list"} records')
          Path('data/products-db.json').write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print(f'VALID: generated browser catalog with {len(data)} products')
          PY
      - name: Validate products catalog
        run: |
          test -s data/products-db.gz.b64
          test -s data/products-db.json
          grep -q "data/products-db.json" products.html
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/products-db.json').read_text(encoding='utf-8'))
          assert len(d) >= 2000
          print(f'VALID: {len(d)} products ready for Pages')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
