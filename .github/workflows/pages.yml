name: Deploy Azim Abzar to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and extract 908 catalog archive
        if: ${{ hashFiles('azim_abzar_908_full.zip.part-*') != '' }}
        run: |
          set -e
          cat azim_abzar_908_full.zip.part-* > /tmp/azim_abzar_908_full.zip
          rm -rf /tmp/azim_catalog_extract
          mkdir -p /tmp/azim_catalog_extract
          unzip -q -o /tmp/azim_abzar_908_full.zip -d /tmp/azim_catalog_extract
          test -s /tmp/azim_catalog_extract/final/products.json
          test -d /tmp/azim_catalog_extract/final/images
          rm -rf catalog_site_mapping_908
          mv /tmp/azim_catalog_extract/final catalog_site_mapping_908
          rm -f azim_abzar_908_full.zip.part-*
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog_site_mapping_908
          git add -u azim_abzar_908_full.zip.part-*
          if git diff --cached --quiet; then
            echo 'No catalog changes to commit.'
          else
            git commit -m 'Add complete 908-product catalog and original-quality images'
            git push
          fi

      - name: Validate 908-product catalog source
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          p=Path('catalog_site_mapping_908/products.json')
          assert p.is_file() and p.stat().st_size > 0, 'catalog_site_mapping_908/products.json is missing'
          data=json.loads(p.read_text(encoding='utf-8'))
          assert isinstance(data,list), 'products.json must be an array'
          assert len(data)==908, f'catalog source has {len(data)}, expected 908'
          ids=[str(x.get('id','')) for x in data]
          assert len(set(ids))==908 and all(re.fullmatch(r'P\d{4}',x) for x in ids), 'invalid or duplicate product IDs'
          image_dir=Path('catalog_site_mapping_908/images')
          image_ids={p.stem for p in image_dir.glob('*.jpg')}
          bad=image_ids-set(ids)
          missing=set(ids)-image_ids
          assert not bad, f'images with unknown product IDs: {sorted(bad)}'
          assert not missing, f'missing product images: {sorted(missing)}'
          assert len(image_ids)==908, f'found {len(image_ids)} images, expected 908'
          print('CATALOG SOURCE OK: 908 products; 908 mapped images; 0 missing images')
          PY

      - name: Validate site files
        run: |
          test -s products.html
          python - <<'PY'
          from pathlib import Path
          s=Path('products.html').read_text(encoding='utf-8')
          assert 'products.json' in s, 'products.html is not using products.json'
          assert 'IMAGE_DIR' in s and 'p.id' in s, 'products.html does not use stable ID image mapping'
          for f in ('index.html','products.html','admin.html','ai.html'):
              t=Path(f).read_text(encoding='utf-8').lower()
              assert '<html' in t and '</html>' in t, f'invalid html: {f}'
          print('SITE FILE VALIDATION OK')
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
