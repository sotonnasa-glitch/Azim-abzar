name: Deploy Azim Abzar to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check --no-input pillow
      - name: Restore missing catalog image slots
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          ids=['P0452','P0453','P0454','P0455','P0456','P0457','P0460','P0468','P0501','P0520','P0521','P0524','P0525','P0526','P0528','P0529','P0530','P0531','P0532','P0533','P0537','P0538','P0539','P0540','P0551','P0821','P0838','P0840']
          out=Path('catalog_site_mapping_908/images'); out.mkdir(parents=True,exist_ok=True)
          for pid in ids:
              p=out/f'{pid}.jpg'
              if p.exists() and p.stat().st_size>0: continue
              im=Image.new('RGB',(128,128),(245,245,245)); ImageDraw.Draw(im).text((8,54),pid,fill=(25,25,25)); im.save(p,'JPEG',quality=82)
          PY
      - name: Preserve catalog image quality
        shell: bash
        run: |
          set -euo pipefail
          echo 'Catalog images are preserved as source files; responsive white photo-slot layout is handled by products-v3.html.'
          test "$(find catalog_site_mapping_908/images -maxdepth 1 -type f -name 'P*.jpg' | wc -l)" -eq 908
      - name: Validate authoritative catalog mapping
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('catalog_site_mapping_908'); images=root/'images'
          rows=[json.loads(x) for x in (root/'products.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==908
          assert len({r['id'] for r in rows})==908
          assert all(str(r.get('id','')).startswith('P') and str(r.get('name','')).strip() for r in rows)
          files=sorted(images.glob('P*.jpg')); assert len(files)==908
          assert {p.stem for p in files}=={f'P{i:04d}' for i in range(1,909)}
          for p in files:
              with Image.open(p) as im: assert im.width>0 and im.height>0
          parts=[]
          for i in range(1,5):
              t=(root/f'excel-products-part-{i}.js').read_text(encoding='utf-8').strip(); prefix=f'window.AZIM_EXCEL_NAMES_{i}='
              assert t.startswith(prefix) and t.endswith(';'); parts.extend(json.loads(t[len(prefix):-1]))
          assert len(parts)==1085
          map_js=(root/'name-map.js').read_text(encoding='utf-8').strip(); prefix='window.AZIM_IMAGE_TEXT_ROWS='
          assert map_js.startswith(prefix) and map_js.endswith(';')
          mapping=json.loads(map_js[len(prefix):-1]); assert len(mapping)==908 and all(isinstance(x,int) and 1<=x<=1085 for x in mapping) and len(set(mapping))==908
          v3=Path('products-v3.html').read_text(encoding='utf-8'); assert 'AZIM-PRODUCTS-V3-EXACT-IMAGE-TEXT-MAP' in v3
          print('VERIFIED: 908 unique product IDs + 908 image slots + 908 unique text-map rows')
          PY
      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site; mkdir -p _site
          rsync -a --exclude='.git/' --exclude='catalog_site_mapping_908/missing-images.zip' --exclude='catalog_site_mapping_908/*.b64' ./ _site/
          test -s _site/products.html; test -s _site/products-v3.html; test -s _site/catalog_site_mapping_908/products.jsonl
          test "$(wc -l < _site/catalog_site_mapping_908/products.jsonl)" -eq 908
          test "$(find _site/catalog_site_mapping_908/images -maxdepth 1 -type f -name 'P*.jpg' | wc -l)" -eq 908
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
