name: Deploy Azim Abzar to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build products.json from the 908-ID catalog mapping
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('catalog_site_mapping_908')
          names=[]
          for i in range(1,5):
              t=(root/f'excel-products-part-{i}.js').read_text(encoding='utf-8').strip()
              prefix=f'window.AZIM_EXCEL_NAMES_{i}='
              assert t.startswith(prefix) and t.endswith(';')
              names.extend(json.loads(t[len(prefix):-1]))
          assert len(names)==1085
          t=(root/'name-map.js').read_text(encoding='utf-8').strip()
          prefix='window.AZIM_IMAGE_TEXT_ROWS='
          assert t.startswith(prefix) and t.endswith(';')
          mapping=json.loads(t[len(prefix):-1])
          assert len(mapping)==908 and len(set(mapping))==908
          products=[]
          for i,row_index in enumerate(mapping,1):
              row=names[row_index-1]
              name=(row[0] if isinstance(row,list) else row).strip()
              products.append({'id':f'P{i:04d}','name':name,'image':f'catalog_site_mapping_908/images/P{i:04d}.jpg'})
          assert len(products)==908
          assert [p['id'] for p in products]==[f'P{i:04d}' for i in range(1,909)]
          (root/'products.json').write_text(json.dumps(products,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print('BUILT: 908 product records P0001-P0908')
          PY
      - name: Validate catalog and page
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('catalog_site_mapping_908')
          p=json.loads((root/'products.json').read_text(encoding='utf-8'))
          assert isinstance(p,list) and len(p)==908
          assert [x['id'] for x in p]==[f'P{i:04d}' for i in range(1,909)]
          assert len(set(x['id'] for x in p))==908
          assert all(str(x.get('name','')).strip() for x in p)
          assert all(x['image']==f'catalog_site_mapping_908/images/{x["id"]}.jpg' for x in p)
          v3=Path('products-v3.html').read_text(encoding='utf-8')
          assert 'catalog_site_mapping_908/products.json' in v3
          print('VERIFIED: products.json is a plain 908-item array with fixed IDs and image paths')
          PY
      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='catalog_site_mapping_908/missing-images.zip' --exclude='catalog_site_mapping_908/*.b64' ./ _site/
          test -s _site/products.html
          test -s _site/products-v3.html
          python - <<'PY'
          import json
          p=json.load(open('_site/catalog_site_mapping_908/products.json',encoding='utf-8'))
          assert isinstance(p,list) and len(p)==908
          print('PAGES ARTIFACT VERIFIED: 908 product array present')
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
