name: Deploy Azim Abzar to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build complete 1855-product catalog chunks
        run: |
          python - <<'PY'
          import base64, gzip, json
          from pathlib import Path
          src = Path('catalog-full.gz.b64')
          raw = ''.join(src.read_text(encoding='utf-8').split())
          payload = gzip.decompress(base64.b64decode(raw, validate=True))
          products = json.loads(payload)
          assert isinstance(products, list), 'catalog payload is not a list'
          assert len(products) == 1855, f'catalog payload has {len(products)} products, expected 1855'
          chunk_size = 54
          for p in Path('.').glob('azim-catalog-chunk-*.js'):
              p.unlink()
          for idx in range(0, len(products), chunk_size):
              n = idx // chunk_size + 1
              chunk = products[idx:idx + chunk_size]
              text = 'window.AZIM_CATALOG_PARTS=window.AZIM_CATALOG_PARTS||[];window.AZIM_CATALOG_PARTS.push(' + json.dumps(chunk, ensure_ascii=False, separators=(',', ':')) + ');'
              Path(f'azim-catalog-chunk-{n}.js').write_text(text, encoding='utf-8')
          count = (len(products) + chunk_size - 1) // chunk_size
          assert count == 35, f'generated {count} chunks, expected 35'
          print(f'CATALOG BUILD OK: {len(products)} products in {count} chunks')
          PY
      - name: Validate catalog chunks
        run: |
          test -s data/azim-catalog-runtime.js
          grep -q "AZIM_CATALOG_READY" data/azim-catalog-runtime.js
          for f in azim-catalog-chunk-{1..35}.js; do
            test -s "$f"
            grep -q "AZIM_CATALOG_PARTS" "$f"
          done
          echo "CATALOG CHUNKS VALID: 35/35"
      - name: Validate site files
        run: |
          test -s index.html
          test -s products.html
          grep -q "azim-catalog-runtime.js" products.html
          python - <<'PY'
          from pathlib import Path
          for f in ('index.html','products.html','admin.html','ai.html'):
              p=Path(f)
              assert p.exists() and p.stat().st_size>0, f'missing/empty {f}'
              s=p.read_text(encoding='utf-8')
              assert '<html' in s.lower() and '</html>' in s.lower(), f'invalid HTML shell: {f}'
          print('SITE FILE VALIDATION OK')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
