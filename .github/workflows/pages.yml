name: Deploy Azim Abzar to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check --no-input pillow
      - name: Build and validate 906-product catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('catalog_site_mapping_908'); images=root/'images'; rows=[]
          for i in range(1,5):
              t=(root/f'excel-products-part-{i}.js').read_text(encoding='utf-8').strip()
              prefix=f'window.AZIM_EXCEL_NAMES_{i}='
              assert t.startswith(prefix) and t.endswith(';')
              rows.extend(json.loads(t[len(prefix):-1]))
          assert len(rows)==1085
          names=[str(r[0]).strip() for r in rows[:906]]
          assert len(names)==906 and all(names)
          files=sorted(images.glob('P*.jpg'))
          assert len(files)==880
          ids={f'P{i:04d}' for i in range(1,1086)}
          assert {p.stem for p in files} <= ids
          for p in files:
              with Image.open(p) as im: assert im.width>0 and im.height>0
          products=[{'id':f'P{i:04d}','name':rows[i-1][0],'image':f'catalog_site_mapping_908/images/P{i:04d}.jpg'} for i in range(1,907)]
          out=root/'products.json'; out.write_text(json.dumps(products,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          chk=json.loads(out.read_text(encoding='utf-8'))
          assert len(chk)==906 and chk[0]['id']=='P0001' and chk[-1]['id']=='P0906'
          print('906 PRODUCT NAMES + 880 AVAILABLE IMAGES VALIDATED')
          PY
      - name: Persist generated catalog JSON to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog_site_mapping_908/products.json
          if git diff --cached --quiet; then echo 'products.json already current'; else git commit -m 'Persist 906 product catalog JSON'; git push origin HEAD:main; fi
      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site; mkdir -p _site; rsync -a --exclude='.git/' ./ _site/
          test -s _site/products.html
          test -s _site/catalog_site_mapping_908/products.json
          for i in 1 2 3 4; do test -s "_site/catalog_site_mapping_908/excel-products-part-$i.js"; done
          test "$(find _site/catalog_site_mapping_908/images -maxdepth 1 -type f -name 'P*.jpg' | wc -l)" -eq 880
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
