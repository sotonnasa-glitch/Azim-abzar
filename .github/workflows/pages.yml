name: Deploy Azim Abzar to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
env:
  AZIM_SUPABASE_URL: https://lzkrwtnylkordkwkdyzp.supabase.co
  AZIM_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.AZIM_SUPABASE_PUBLISHABLE_KEY }}
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Configure optional Supabase runtime config
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os
          key=os.environ.get('AZIM_SUPABASE_PUBLISHABLE_KEY','').strip()
          url=os.environ.get('AZIM_SUPABASE_URL','').strip()
          if key and url:
              Path('supabase-config.js').write_text('window.AZIM_SUPABASE_URL='+json.dumps(url)+';\nwindow.AZIM_SUPABASE_ANON_KEY='+json.dumps(key)+';\n',encoding='utf-8')
          else:
              Path('supabase-config.js').write_text('window.AZIM_SUPABASE_URL="";\nwindow.AZIM_SUPABASE_ANON_KEY="";\n',encoding='utf-8')
          PY
      - name: Build plain JSON catalog for browser
        run: |
          python - <<'PY'
          import subprocess, re, base64, gzip, json
          from pathlib import Path
          historical = subprocess.check_output(['git','show','aae3e418096c4f0624217872e04e8728a2b8a826:azim-catalog-data.js'], text=True)
          m=re.search(r"const b='([^']+)'", historical)
          if not m: raise SystemExit('Historical catalog blob not found')
          data=json.loads(gzip.decompress(base64.b64decode(m.group(1))).decode('utf-8'))
          if not isinstance(data,list) or len(data) < 2000: raise SystemExit(f'Invalid historical catalog: {len(data) if isinstance(data,list) else "not-list"}')
          Path('data/products-db.json').write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print('VALID:',len(data),'products restored from historical catalog')
          PY
      - name: Validate products catalog
        run: |
          test -s data/products-db.json
          grep -q "data/products-db.json" products.html
          python -c "import json; d=json.load(open('data/products-db.json',encoding='utf-8')); assert len(d)>=2000; print('VALID:',len(d),'products ready for Pages')"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
