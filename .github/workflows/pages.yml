name: Deploy Azim Abzar to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check --no-input pillow
      - name: Validate authoritative PDF image-name catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('catalog_site_mapping_908'); images=root/'images'
          rows=[json.loads(x) for x in (root/'products.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==908, f'expected 908 catalog rows, got {len(rows)}'
          assert all(str(r.get('id','')).startswith('P') and str(r.get('name','')).strip() for r in rows)
          product_rows=rows[:906]
          assert len(product_rows)==906 and product_rows[0]['id']=='P0001' and product_rows[-1]['id']=='P0906'
          assert len({r['id'] for r in product_rows})==906
          files=sorted(images.glob('P*.jpg'))
          assert len(files)==880, f'expected 880 images, got {len(files)}'
          ids={f'P{i:04d}' for i in range(1,909)}
          assert {p.stem for p in files} <= ids
          for p in files:
              with Image.open(p) as im:
                  assert im.width>0 and im.height>0
          page=Path('products-v2.html').read_text(encoding='utf-8')
          assert 'AZIM-PRODUCTS-V2-AUTHORITATIVE-PDF-MAP' in page
          assert "products.jsonl?v=20260915" in page
          assert "rows.slice(0,906)" in page
          assert "IMAGE_DIR+x.id+'.jpg'" in page
          print('VERIFIED: 906 EXACT PDF NAME-IMAGE PAIRS + 880 VALID IMAGES')
          PY
      - name: Persist generated catalog JSON to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog_site_mapping_908/products.json
          if git diff --cached --quiet; then echo 'products.json already current'; else git commit -m 'Persist 906 product catalog JSON'; git push origin HEAD:main; fi
      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='.git/' ./ _site/
          test -s _site/products.html
          test -s _site/products-v2.html
          test -s _site/catalog_site_mapping_908/products.jsonl
          test "$(wc -l < _site/catalog_site_mapping_908/products.jsonl)" -eq 908
          for i in 1 2 3 4; do test -s "_site/catalog_site_mapping_908/excel-products-part-$i.js"; done
          test "$(find _site/catalog_site_mapping_908/images -maxdepth 1 -type f -name 'P*.jpg' | wc -l)" -eq 880
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
