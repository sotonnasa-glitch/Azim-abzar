name: Deploy Azim Abzar to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Wire products page into homepage and live product store
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'href="products.html"' not in s:
              nav = re.search(r'<nav\b[^>]*class=["\']nav["\'][^>]*>(.*?)</nav>', s, flags=re.I|re.S)
              if nav:
                  inside = nav.group(1)
                  home = re.search(r'<a\b[^>]*href=["\']#home["\'][^>]*>.*?</a>', inside, flags=re.I|re.S)
                  updated = inside[:home.end()] + '<a href="products.html">محصولات</a>' + inside[home.end():] if home else '<a href="products.html">محصولات</a>' + inside
                  s = s[:nav.start(1)] + updated + s[nav.end(1):]
              p.write_text(s, encoding='utf-8')
          p = Path('products.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="custom-products.js"></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '</body>')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
