name: Deploy Azim Abzar to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Merge uploaded high-quality catalog images
        run: |
          set -e
          command -v unzip >/dev/null 2>&1
          mkdir -p /tmp/azim_hq_extract /tmp/azim_hq_images
          found_archive=0
          for f in catalog_images_part_1 catalog_products_part_1_of_2.zip; do
            if [ -f "$f" ] && unzip -t -q "$f" >/dev/null 2>&1; then
              echo "Extracting high-quality archive: $f"
              found_archive=1
              d="/tmp/azim_hq_extract/$(printf '%s' "$f" | tr '/ ' '__')"
              mkdir -p "$d"
              unzip -q -o "$f" -d "$d"
            fi
          done
          if [ "$found_archive" -eq 0 ]; then
            echo 'No ZIP-compatible high-quality upload found; keeping existing images.'
            exit 0
          fi

          find /tmp/azim_hq_extract -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) -print0 |
            while IFS= read -r -d '' img; do
              base="$(basename "$img")"
              if [[ "$base" =~ (P[0-9]{4})\.(jpg|jpeg|png|webp)$ ]]; then
                id="${BASH_REMATCH[1]}"
                ext="${BASH_REMATCH[2]}"
                cp -f "$img" "/tmp/azim_hq_images/${id}.${ext}"
              fi
            done

          mkdir -p catalog_site_mapping_908/images
          replaced=0
          for img in /tmp/azim_hq_images/P*.jpg /tmp/azim_hq_images/P*.jpeg /tmp/azim_hq_images/P*.png /tmp/azim_hq_images/P*.webp; do
            [ -f "$img" ] || continue
            id="$(basename "$img" | sed -E 's/\.(jpg|jpeg|png|webp)$//')"
            case "$img" in
              *.jpg) target="catalog_site_mapping_908/images/${id}.jpg" ;;
              *) target="catalog_site_mapping_908/images/${id}.jpg" ;;
            esac
            if command -v magick >/dev/null 2>&1; then
              # Keep the uploaded image's original pixels/quality. Only change the filename/format when needed.
              if [[ "$img" == *.jpg ]]; then
                cp -f "$img" "$target"
              else
                magick "$img" "$target"
              fi
            else
              cp -f "$img" "$target"
            fi
            replaced=$((replaced+1))
          done

          echo "High-quality product images merged: $replaced"
          if [ "$replaced" -gt 0 ]; then
            git add catalog_site_mapping_908/images
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            if git diff --cached --quiet; then
              echo 'No image changes detected.'
            else
              git commit -m 'Use uploaded high-quality product images'
              git push
            fi
          fi

      - name: Extract authoritative 908 catalog ZIP
        if: ${{ hashFiles('catalog_site_mapping_908.zip') != '' }}
        run: |
          set -e
          rm -rf /tmp/azim_catalog_extract
          mkdir -p /tmp/azim_catalog_extract
          unzip -q -o catalog_site_mapping_908.zip -d /tmp/azim_catalog_extract
          test -s /tmp/azim_catalog_extract/catalog_site_mapping_908/products.json
          test -d /tmp/azim_catalog_extract/catalog_site_mapping_908/images
          rm -rf catalog_site_mapping_908
          mv /tmp/azim_catalog_extract/catalog_site_mapping_908 catalog_site_mapping_908
          rm -f catalog_site_mapping_908.zip
          for f in azim_abzar_908_full.zip.part-*; do
            if [ -e "$f" ]; then
              git add -u -- "$f"
            fi
          done
          git add catalog_site_mapping_908
          if git ls-files --error-unmatch catalog_site_mapping_908.zip >/dev/null 2>&1; then
            git add -u -- catalog_site_mapping_908.zip
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No catalog changes to commit.'
          else
            git commit -m 'Use authoritative 908-product catalog image mapping'
            git push
          fi

      - name: Validate 908-product catalog source
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          p=Path('catalog_site_mapping_908/products.json')
          assert p.is_file() and p.stat().st_size > 0, 'catalog_site_mapping_908/products.json is missing'
          data=json.loads(p.read_text(encoding='utf-8'))
          assert isinstance(data,list), 'products.json must be an array'
          assert len(data)==908, f'catalog source has {len(data)}, expected 908'
          ids=[str(x.get('id','')) for x in data]
          assert len(set(ids))==908 and all(re.fullmatch(r'P\d{4}',x) for x in ids), 'invalid or duplicate product IDs'
          image_dir=Path('catalog_site_mapping_908/images')
          image_ids={p.stem for p in image_dir.glob('*.jpg')}
          bad=image_ids-set(ids)
          missing=set(ids)-image_ids
          assert not bad, f'images with unknown product IDs: {sorted(bad)}'
          assert len(image_ids)==880, f'authoritative image set must contain 880 images, found {len(image_ids)}'
          assert len(missing)==28, f'expected 28 products without extracted image, found {len(missing)}'
          print(f'CATALOG SOURCE OK: 908 products; {len(image_ids)} authoritative mapped images; {len(missing)} products without extracted image')
          PY

      - name: Validate site files
        run: |
          test -s products.html
          python - <<'PY'
          from pathlib import Path
          s=Path('products.html').read_text(encoding='utf-8')
          assert 'products.json' in s, 'products.html is not using products.json'
          assert 'IMAGE_DIR' in s and 'p.id' in s, 'products.html does not use stable ID image mapping'
          for f in ('index.html','products.html','admin.html','ai.html'):
              t=Path(f).read_text(encoding='utf-8').lower()
              assert '<html' in t and '</html>' in t, f'invalid html: {f}'
          print('SITE FILE VALIDATION OK')
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
