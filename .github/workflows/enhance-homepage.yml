name: Apply Homepage Motion Enhancements

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enhance:
    if: ${{ !contains(github.event.head_commit.message, 'Apply immersive 8-part motion system') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply eight motion layers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'AZIM-8-MOTION-2026'
          if marker in s:
              print('Motion system already present; nothing to do')
              raise SystemExit(0)

          css = r'''
          /* AZIM-8-MOTION-2026: immersive visual layer — no decorative emoji */
          :root{--mxp:50%;--myp:50%;--scrollp:0;--shine-x:-140%}
          body{position:relative;isolation:isolate}
          body:has(.motionAtmosphere):before{background-size:46px 46px,46px 46px;filter:contrast(1.06)}
          .motionAtmosphere{position:fixed;inset:0;z-index:-3;pointer-events:none;overflow:hidden;background:radial-gradient(circle at var(--mxp) var(--myp),rgba(245,185,0,.075),transparent 17%),radial-gradient(circle at 18% 72%,rgba(255,255,255,.025),transparent 18%);opacity:.95}
          .motionAtmosphere:before,.motionAtmosphere:after{content:"";position:absolute;inset:-25%;background:conic-gradient(from 20deg at 50% 50%,transparent 0deg,rgba(245,185,0,.03) 34deg,transparent 72deg,rgba(255,255,255,.018) 145deg,transparent 210deg,rgba(245,185,0,.028) 290deg,transparent 340deg);animation:ambientRotor 24s linear infinite}
          .motionAtmosphere:after{animation-duration:34s;animation-direction:reverse;filter:blur(18px);opacity:.7}
          .heroBox,.ai,.cat,.stat,.mini,.btn,.headCta{--rx:0deg;--ry:0deg;--lift:0px;--tz:0px;position:relative}
          .heroBox:after{backdrop-filter:blur(12px) saturate(120%)}
          .heroBox,.ai,.cat,.stat,.mini,.btn,.headCta{transform-style:preserve-3d}
          .heroBox:before,.cat:before,.btn:before{background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.07) 38%,rgba(255,216,79,.20) 50%,rgba(255,255,255,.06) 61%,transparent 80%);background-size:240% 100%;animation:metalSweep 5.8s ease-in-out infinite}
          .metalEdge{position:absolute;inset:0;border-radius:inherit;pointer-events:none;overflow:hidden;z-index:7;mix-blend-mode:screen}
          .metalEdge:before{content:"";position:absolute;top:0;bottom:0;width:22%;left:var(--shine-x);background:linear-gradient(90deg,transparent,rgba(255,255,255,.13),rgba(255,216,79,.18),transparent);filter:blur(2px);transform:skewX(-18deg);transition:left .08s linear}
          .depth3d{transform:translate3d(0,var(--lift),var(--tz)) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease,border-color .22s ease;will-change:transform}
          .depth3d:hover{--lift:-7px;--tz:18px}
          .cinematic{opacity:0;transform:translate3d(0,50px,0) scale(.965) rotateX(3deg);filter:blur(7px);transition:opacity .9s ease,transform 1s cubic-bezier(.18,.82,.18,1),filter .9s ease}
          .cinematic.in-view{opacity:1;transform:none;filter:none}
          .scrollParallax{transform:translate3d(0,calc(var(--scrollp) * -18px),0);will-change:transform}
          .scanBeam{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5;border-radius:inherit}
          .scanBeam:before{content:"";position:absolute;left:-25%;right:-25%;top:-12%;height:2px;background:linear-gradient(90deg,transparent,rgba(255,216,79,.0) 18%,rgba(255,216,79,.95) 50%,rgba(255,216,79,.0) 82%,transparent);box-shadow:0 0 22px rgba(245,185,0,.55),0 0 70px rgba(245,185,0,.18);animation:beamScan 5.5s cubic-bezier(.45,0,.55,1) infinite}
          .ripple{position:absolute;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.65);transform:translate(-50%,-50%) scale(0);pointer-events:none;mix-blend-mode:screen;animation:rippleOut .65s ease-out forwards}
          .buttonPulse{box-shadow:0 0 0 0 rgba(245,185,0,.22)}
          .buttonPulse:hover{animation:buttonPulse .9s ease-out}
          .chromeText{position:relative;text-shadow:0 1px 0 rgba(255,255,255,.25),0 -1px 0 rgba(0,0,0,.8),0 8px 28px rgba(0,0,0,.35)}
          .motionLine{position:absolute;height:1px;width:28%;background:linear-gradient(90deg,transparent,rgba(245,185,0,.62),transparent);opacity:.32;pointer-events:none;animation:lineDrift 8s ease-in-out infinite}
          .motionLine.one{top:19%;right:5%}.motionLine.two{top:52%;left:4%;animation-delay:2s}.motionLine.three{bottom:15%;right:16%;animation-delay:4s}
          @keyframes ambientRotor{to{transform:rotate(360deg)}}
          @keyframes metalSweep{0%,16%{background-position:180% 50%}52%,100%{background-position:-35% 50%}}
          @keyframes beamScan{0%,12%{transform:translateY(-30px);opacity:0}20%{opacity:1}82%{opacity:.9}100%{transform:translateY(720px);opacity:0}}
          @keyframes rippleOut{to{transform:translate(-50%,-50%) scale(24);opacity:0}}
          @keyframes buttonPulse{0%{box-shadow:0 0 0 0 rgba(245,185,0,.22)}100%{box-shadow:0 0 0 14px rgba(245,185,0,0)}}
          @keyframes lineDrift{0%,100%{transform:translateX(0);opacity:.22}50%{transform:translateX(-32px);opacity:.55}}
          @media(max-width:900px){.motionAtmosphere{opacity:.65}.scanBeam:before{animation-duration:6.8s}.motionLine{display:none}}
          @media(prefers-reduced-motion:reduce){.motionAtmosphere,.scanBeam:before,.motionLine{animation:none!important}.cinematic{opacity:1!important;transform:none!important;filter:none!important}.depth3d{transform:none!important}}
          '''

          html = r'''
          <div class="motionAtmosphere" aria-hidden="true"></div>
          '''
          html += r'''
          <div class="scanBeam" aria-hidden="true"></div><div class="metalEdge" aria-hidden="true"></div>
          <span class="motionLine one" aria-hidden="true"></span><span class="motionLine two" aria-hidden="true"></span><span class="motionLine three" aria-hidden="true"></span>
          '''

          js = r'''
          // AZIM-8-MOTION-2026 JS
          (()=>{
            const fine=window.matchMedia('(pointer:fine)').matches;
            const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const root=document.documentElement;
            document.querySelector('.heroBox')?.append(document.querySelector('.heroBox')?.querySelector('.scanBeam')||(()=>{const e=document.createElement('div');e.className='scanBeam';e.setAttribute('aria-hidden','true');return e})());
            document.querySelectorAll('.heroBox,.ai,.cat,.stat,.mini,.btn,.headCta').forEach(el=>{el.classList.add('depth3d');el.classList.add('buttonPulse');});
            document.querySelectorAll('.heroBox,.ai').forEach(el=>{if(!el.querySelector(':scope > .metalEdge')){const e=document.createElement('div');e.className='metalEdge';e.setAttribute('aria-hidden','true');el.appendChild(e)} if(!el.querySelector(':scope > .scanBeam')){const e=document.createElement('div');e.className='scanBeam';e.setAttribute('aria-hidden','true');el.appendChild(e)}});
            const cinematic=[...document.querySelectorAll('.sectionHead,.cat,.ai,.note')]; cinematic.forEach((el,i)=>{el.classList.add('cinematic');el.style.transitionDelay=`${Math.min(i*55,330)}ms`;});
            if(!reduce){
              const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in-view');io.unobserve(e.target)}}),{threshold:.12});cinematic.forEach(e=>io.observe(e));
            }else cinematic.forEach(e=>e.classList.add('in-view'));
            let ticking=false;
            const updateScroll=()=>{const max=document.documentElement.scrollHeight-innerHeight;root.style.setProperty('--scrollp',max>0?(scrollY/max).toFixed(3):'0');ticking=false};
            addEventListener('scroll',()=>{if(!ticking){requestAnimationFrame(updateScroll);ticking=true}},{passive:true});updateScroll();
            if(fine&&!reduce){
              addEventListener('pointermove',e=>{root.style.setProperty('--mxp',`${(e.clientX/innerWidth)*100}%`);root.style.setProperty('--myp',`${(e.clientY/innerHeight)*100}%`);});
              document.querySelectorAll('.cat,.stat,.mini,.btn,.headCta').forEach(el=>{
                el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;el.style.setProperty('--rx',`${-y*6}deg`);el.style.setProperty('--ry',`${x*8}deg`);el.style.setProperty('--shine-x',`${((x+.5)*140)-20}%`)});
                el.addEventListener('pointerleave',()=>{el.style.setProperty('--rx','0deg');el.style.setProperty('--ry','0deg');el.style.setProperty('--shine-x','-140%')});
              });
            }
            document.querySelectorAll('.btn,.headCta').forEach(btn=>btn.addEventListener('click',e=>{const r=btn.getBoundingClientRect(),q=document.createElement('span');q.className='ripple';q.style.left=`${e.clientX-r.left}px`;q.style.top=`${e.clientY-r.top}px`;btn.appendChild(q);q.addEventListener('animationend',()=>q.remove());}));
          })();
          '''

          s=s.replace('</style>',css+'\n</style>',1)
          s=s.replace('<body>','<body>\n'+html,1)
          s=s.replace('</script>',js+'\n</script>',1)
          p.write_text(s,encoding='utf-8')
          print('Applied immersive 8-part motion system')
          PY

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/enhance-homepage.yml
          git add index.html
          git commit -m "Apply immersive 8-part motion system"
          git push origin HEAD:main
