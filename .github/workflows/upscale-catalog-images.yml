name: Upscale catalog images in Supabase
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upscale:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Test image upscaler
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIGRATOR_URL: https://lzkrwtnylkordkwkdyzp.supabase.co/functions/v1/catalog-image-migrator
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 180 -D /tmp/headers -o /tmp/body -H "x-github-token: $GITHUB_TOKEN" "$MIGRATOR_URL?action=upscale&offset=0&limit=1" || true
          cat /tmp/headers
          cat /tmp/body
          grep -q '"processed":1' /tmp/body
      - name: Remove one-time workflow
        if: success()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo-cleanup
          cd repo-cleanup
          rm -f .github/workflows/upscale-catalog-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/upscale-catalog-images.yml
          git commit -m "chore: remove one-time image upscale workflow [skip ci]"
          git push origin HEAD:main
