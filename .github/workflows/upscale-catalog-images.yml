name: Upscale catalog images in Supabase
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Process chunks and save diagnostics
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIGRATOR_URL: https://lzkrwtnylkordkwkdyzp.supabase.co/functions/v1/catalog-image-migrator
        run: |
          set -u
          : > chunks-report.txt
          for offset in $(seq 0 5 905); do
            body=$(mktemp)
            code=$(curl --silent --show-error --max-time 180 -o "$body" -w '%{http_code}' -H "x-github-token: $GITHUB_TOKEN" "$MIGRATOR_URL?action=upscale&offset=$offset&limit=5")
            echo "OFFSET=$offset HTTP=$code" | tee -a chunks-report.txt
            cat "$body" | tee -a chunks-report.txt
            rm -f "$body"
          done
      - name: Persist diagnostics and remove one-time workflow
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo-cleanup
          cd repo-cleanup
          cp ../chunks-report.txt .
          rm -f .github/workflows/upscale-catalog-images.yml lightweight-upscale-test.txt image-debug-response.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: save image chunk diagnostics and remove one-time workflow [skip ci]"
          git push origin HEAD:main
