name: Security audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Generate lockfile
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if [[ -n "$(git status --porcelain package-lock.json)" ]]; then
              git add package-lock.json
              git commit -m "chore(deps): add npm lockfile"
              git push
            fi
          fi

      - name: Verify reproducible npm install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high

      - name: JavaScript syntax checks
        run: |
          node --check server.js
          node --input-type=module --check < api/chat.js
          node --check admin-app.js

      - name: Secret and security invariants
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'sb_secret_[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}|postgresql://[^[:space:]]+:[^@[:space:]]+@' --exclude-dir=.git --exclude='*.zip' --exclude='*.b64' --exclude='security-audit.yml' .
          grep -q "X-Content-Type-Options" server.js
          grep -q "Content-Security-Policy" server.js
          grep -q "express.json({ limit: '8kb' })" server.js
          grep -q "RATE_LIMIT = 12" api/chat.js
          grep -q "requireAdminMFA" admin-app.js
          grep -q "sb_publishable_" supabase-config.js
          grep -q 'name="paymentMethod"' cart.html
          grep -q 'p_payment_method:' cart.html
          grep -q 'azim_checkout_options' cart.html
          grep -q 'azim_request_order_cancel' order-status.html
          grep -q 'azim_request_order_return' order-status.html
          grep -q 'window.copyText' order-status.html
          echo "SECURITY INVARIANTS VERIFIED"
