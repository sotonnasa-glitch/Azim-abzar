name: contact-nav-fix
on:
  push:
    paths:
      - '.github/workflows/add-back-button.yml'
      - 'contact.html'
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix contact navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('contact.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('href="#contact"','href="./contact.html"')
          s=s.replace('href="contact.html#contact"','href="./contact.html"')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit contact navigation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contact.html
          git diff --cached --quiet || git commit -m 'Keep contact navigation on contact page'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/add-back-button.yml
          git add .github/workflows/add-back-button.yml
          git diff --cached --quiet || git commit -m 'Remove temporary contact workflow'
          git push
