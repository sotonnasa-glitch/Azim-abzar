name: Build mobile hero video

on:
  push:
    branches: [main]
    paths:
      - "assets/homepage/azim-hero-optimized.mp4"
      - ".github/workflows/build-mobile-hero.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Encode mobile hero
        shell: bash
        run: |
          set -euo pipefail
          input="assets/homepage/azim-hero-optimized.mp4"
          output="/tmp/azim-hero-mobile.mp4"
          test -s "$input"
          ffmpeg -hide_banner -loglevel error -y             -i "$input"             -an             -vf "scale=w='min(854,iw)':h='-2':force_original_aspect_ratio=decrease"             -r 24             -c:v libx264             -preset veryfast             -profile:v baseline             -level 3.0             -pix_fmt yuv420p             -bf 0             -refs 1             -g 48             -keyint_min 48             -sc_threshold 0             -crf 25             -movflags +faststart             "$output"
          ffprobe -v error             -show_entries stream=codec_name,profile,width,height,pix_fmt,r_frame_rate             -show_entries format=duration,size             -of json "$output"
          test -s "$output"
          mv "$output" "assets/homepage/azim-hero-mobile.mp4"

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          p = "assets/homepage/azim-hero-mobile.mp4"
          r = subprocess.run(
              ["ffprobe","-v","error","-show_entries",
               "stream=codec_name,profile,width,height,pix_fmt,r_frame_rate",
               "-show_entries","format=duration,size","-of","json",p],
              check=True, capture_output=True, text=True
          )
          data=json.loads(r.stdout)
          s=data["streams"][0]
          f=data["format"]
          assert s["codec_name"]=="h264"
          assert s["pix_fmt"]=="yuv420p"
          assert int(s["width"])<=854
          assert int(s["height"])>0
          assert float(f["duration"])>0
          assert int(f["size"])>0
          with open(p,"rb") as fh:
              head=fh.read(1024*1024)
          assert b"ftyp" in head[:128]
          assert b"moov" in head
          print("MOBILE_HERO_OK", json.dumps(data))
          PY

      - name: Commit mobile asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/homepage/azim-hero-mobile.mp4
          git commit -m "Add mobile-optimized hero video [skip ci]"
          git push
