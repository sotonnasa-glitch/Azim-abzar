name: Materialize PDF price-size data
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Decode and validate PDF price data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          src = ''.join(Path('.github/price-size-source.b64').read_text(encoding='utf-8').split())
          raw = gzip.decompress(base64.b64decode(src, validate=True))
          data = json.loads(raw.decode('utf-8'))
          ids = [f'P{i:04d}' for i in range(1,909)]
          assert isinstance(data, dict) and list(data) == ids, 'price source must contain P0001..P0908 in order'
          p1 = dict(data['P0001'].get('v', []))
          p2 = dict(data['P0002'].get('v', []))
          p3 = dict(data['P0003'].get('v', []))
          checks = [
            p1.get('4') == 2520000, p1.get('6') == 1620000, p1.get('41') == 55800000,
            p1.get('46') == 63600000, p1.get('50') == 72000000,
            p2.get('6*7') == 2640000, p2.get('8*10') == 3000000, p2.get('36*41') == 63600000,
            p3.get('8*10') == 4800000, p3.get('19*17') == 8760000,
          ]
          assert all(checks), 'PDF price spot-check failed'
          Path('catalog_site_mapping_908/price-size-data.json').write_text(json.dumps(data, ensure_ascii=False, separators=(',',':')), encoding='utf-8')
          print('PDF PRICE DATA VERIFIED: 908 IDs')
          print('products with variants:', sum(bool(d.get('v')) for d in data.values()))
          print('variant rows:', sum(len(d.get('v',[])) for d in data.values()))
          print('source sha256:', hashlib.sha256(src.encode()).hexdigest())
          print('P0001:', p1.get('4'), p1.get('6'), p1.get('41'), p1.get('46'), p1.get('50'))
          print('P0002:', p2.get('6*7'), p2.get('8*10'), p2.get('36*41'))
          print('P0003:', p3.get('8*10'), p3.get('19*17'))
          PY
      - name: Persist generated data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog_site_mapping_908/price-size-data.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "build: materialize verified PDF price-size data [skip ci]"
            git push origin HEAD:main
          fi
