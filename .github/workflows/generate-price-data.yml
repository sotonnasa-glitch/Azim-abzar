name: Materialize PDF price-size data
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Recover and validate PDF price payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, hashlib, json, re, subprocess, itertools
          from pathlib import Path

          SOURCE_COMMIT = '5206fb2e6d27ac2ab56d9f1679576c1fc2fc6884'
          subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', SOURCE_COMMIT], check=True)

          parts = []
          for i in range(1, 9):
              path = f'.github/price-parts/{i:02d}'
              raw = subprocess.check_output(['git', 'show', f'{SOURCE_COMMIT}:{path}'], text=True)
              clean = ''.join(raw.split())
              parts.append(clean)
              print(f'part {i:02d}: len={len(clean)} sha256={hashlib.sha256(clean.encode()).hexdigest()}')

          b64 = ''.join(parts)
          print(f'assembled payload len={len(b64)} sha256={hashlib.sha256(b64.encode()).hexdigest()}')

          expected_ids = [f'P{i:04d}' for i in range(1, 909)]
          allowed = set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')

          def validate(candidate):
              try:
                  raw = base64.b64decode(candidate, validate=True)
                  data = json.loads(gzip.decompress(raw).decode('utf-8'))
              except Exception:
                  return None
              if not isinstance(data, dict) or list(data) != expected_ids:
                  return None
              v1 = dict(data['P0001'].get('v', []))
              expected1 = {
                  '4': 2520000, '5': 2520000, '6': 1620000, '7': 1620000,
                  '8': 1680000, '10': 1920000, '12': 2220000, '14': 2700000,
                  '19': 4140000, '41': 55800000, '46': 63600000, '50': 72000000,
              }
              if any(v1.get(k) != val for k, val in expected1.items()):
                  return None
              v2 = dict(data['P0002'].get('v', []))
              expected2 = {'6×7': 2640000, '8×9': 2880000, '8×10': 3000000, '10×11': 3600000}
              if any(v2.get(k) != val for k, val in expected2.items()):
                  return None
              return data

          data = validate(b64)
          corrected = b64

          # The preserved source contains a small corruption marker in one part.
          # Repair only invalid Base64 characters first; accept a repair only if the
          # resulting gzip decodes to the complete 908-product dataset and passes
          # the known PDF price spot-checks above.
          if data is None:
              invalid = [i for i, ch in enumerate(b64) if ch not in allowed]
              print(f'invalid base64 offsets={invalid}')
              assert len(invalid) <= 3, f'too many invalid payload characters: {len(invalid)}'
              alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='
              for repl in itertools.product(alphabet, repeat=len(invalid)):
                  candidate = list(b64)
                  for pos, ch in zip(invalid, repl):
                      candidate[pos] = ch
                  candidate = ''.join(candidate)
                  data = validate(candidate)
                  if data is not None:
                      corrected = candidate
                      print(f'RECOVERED payload by replacing invalid offsets {invalid}')
                      break

          # If the source has a one-character insertion/deletion that still leaves
          # valid Base64 characters, try the cheap single-edit recovery as a final
          # fallback. The dataset spot-checks prevent accepting a wrong payload.
          if data is None and len(b64) % 4 == 1:
              for i in range(len(b64)):
                  candidate = b64[:i] + b64[i+1:]
                  data = validate(candidate)
                  if data is not None:
                      corrected = candidate
                      print(f'RECOVERED payload by removing character at offset {i}')
                      break

          assert data is not None, 'could not reconstruct a valid 908-product PDF price payload'

          out = Path('catalog_site_mapping_908/price-size-data.json')
          out.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          Path('catalog_site_mapping_908/price-size-data.js').write_text(
              "window.AZIM_PRICE_SIZE_DATA_B64='" + corrected + "';\n", encoding='utf-8'
          )

          sized = sum(bool((d or {}).get('v')) for d in data.values())
          rows = sum(len((d or {}).get('v', [])) for d in data.values())
          print(f'PDF PRICE DATA VERIFIED: 908 IDs; {sized} products with size variants; {rows} variant rows')
          print('P0001 verified:', {k: dict(data['P0001']['v'])[k] for k in ['4','5','6','7','8','10','12','14','19','41','46','50']})
          print('P0002 verified:', {k: dict(data['P0002']['v'])[k] for k in ['6×7','8×9','8×10','10×11']})
          PY
      - name: Persist generated data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog_site_mapping_908/price-size-data.json catalog_site_mapping_908/price-size-data.js
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "build: materialize verified PDF price-size data [skip ci]"
            git push origin HEAD:main
          fi
