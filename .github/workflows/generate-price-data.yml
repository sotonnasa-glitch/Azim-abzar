name: Materialize PDF price-size data
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Materialize verified PDF price-size source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path

          ids = [f'P{i:04d}' for i in range(1,909)]
          packed = Path('.github/price-size-source.b64').read_text(encoding='utf-8').strip()
          raw = gzip.decompress(base64.b64decode(packed))
          data = json.loads(raw.decode('utf-8'))

          assert list(data) == ids
          assert [pid for pid,d in data.items() if d.get('p') is None] == ['P0184','P0626','P0631','P0720','P0737']
          assert data['P0462']['v'] == [['10',6600000],['12',6600000],['14',6600000],['16',6600000],['18',6600000],['20',6600000],['22',6600000]]
          assert data['P0463']['v'][0] == ['8',8040000]
          assert ['8',3960000] in data['P0463']['v']
          assert data['P0487']['v'] == [['6" (15 سانتی)',4500000],['8" (20 سانتی)',36000000]]
          assert len(data['P0491']['v']) == 10 and data['P0491']['v'][-1] == ['1/2-1 به 1"',144000000]
          assert len(data['P0827']['v']) == 7 and data['P0827']['v'][-1] == ['1/2-1 به 1"',60000000]
          assert data['P0838']['v'] == [['24E',17000000],['28E',19000000]]

          text = json.dumps(data, ensure_ascii=False, separators=(',',':'))
          Path('catalog_site_mapping_908/price-size-data.json').write_text(text, encoding='utf-8')
          Path('catalog_site_mapping_908/price-size-data.js').write_text(
              "window.AZIM_PRICE_SIZE_DATA_B64='" + packed + "';", encoding='utf-8'
          )
          Path('catalog_site_mapping_908/prices.json').write_text(
              json.dumps({pid:d.get('p') for pid,d in data.items()}, ensure_ascii=False, separators=(',',':')),
              encoding='utf-8'
          )
          print('PRICE/SIZE DATA VERIFIED:', len(data), 'products',
                'payload_sha256=', hashlib.sha256(packed.encode()).hexdigest())
          PY
      - name: Persist generated data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog_site_mapping_908/price-size-data.json catalog_site_mapping_908/price-size-data.js catalog_site_mapping_908/prices.json .github/price-size-source.b64
          if git diff --cached --quiet; then echo "No generated changes"; else git commit -m "build: materialize canonical PDF price variants [skip ci]"; git push origin HEAD:main; fi
