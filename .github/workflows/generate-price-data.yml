name: Materialize PDF price-size data
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate bundled PDF price payload and materialize JSON
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, hashlib, json, re
          from pathlib import Path

          pattern = re.compile(r"window\.[A-Z0-9_]+='([A-Za-z0-9+/=]+)';")
          candidates = [
              Path('catalog_site_mapping_908/price-size-data.js'),
              Path('catalog_site_mapping_908/price-variants.js'),
          ]
          data = None
          chosen = None

          for source in candidates:
              if not source.exists():
                  continue
              text = source.read_text(encoding='utf-8').strip()
              match = pattern.fullmatch(text)
              if not match:
                  print(f'SKIP {source}: wrapper invalid')
                  continue
              b64 = match.group(1)
              print(f'TRY {source}: payload_len={len(b64)} sha256={hashlib.sha256(b64.encode()).hexdigest()}')
              try:
                  raw = base64.b64decode(b64, validate=True)
                  candidate = json.loads(gzip.decompress(raw).decode('utf-8'))
              except Exception as exc:
                  print(f'SKIP {source}: decode failed: {exc}')
                  continue
              if not isinstance(candidate, dict) or len(candidate) != 908:
                  print(f'SKIP {source}: expected 908 product IDs, got {len(candidate) if isinstance(candidate, dict) else type(candidate).__name__}')
                  continue
              if list(candidate) != [f'P{i:04d}' for i in range(1, 909)]:
                  print(f'SKIP {source}: product ID sequence is not P0001..P0908')
                  continue
              data = candidate
              chosen = source
              print(f'USE {source}: decoded 908 product IDs successfully')
              break

          assert data is not None, 'no valid 908-product PDF price payload could be decoded'

          out = Path('catalog_site_mapping_908/price-size-data.json')
          out.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')

          sized = sum(bool((d or {}).get('v')) for d in data.values())
          rows = sum(len((d or {}).get('v', [])) for d in data.values())
          print(f'PDF PRICE DATA VERIFIED: source={chosen}; 908 IDs; {sized} products with size variants; {rows} variant rows')
          PY
      - name: Clean obsolete payload parts and persist generated JSON
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/price-parts
          rm -f .github/workflows/verify-price-variants.yml .github/workflows/inspect-size-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "build: materialize verified PDF price-size JSON [skip ci]"
            git push origin HEAD:main
          fi
