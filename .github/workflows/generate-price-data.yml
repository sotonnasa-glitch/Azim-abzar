name: Materialize PDF price-size data
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate PDF-derived price-size JSON and generate site payloads
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path

          path = Path('catalog_site_mapping_908/price-size-data.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          ids = [f'P{i:04d}' for i in range(1,909)]
          assert isinstance(data, dict) and list(data) == ids, 'price-size JSON must contain P0001..P0908 in order'

          # The JSON is the PDF-derived source of truth. This workflow must not
          # overwrite variant lists; it only validates and materializes them.
          assert data['P0001']['v'][0] == ['46', 63600000]
          assert data['P0002']['v'][2] == ['8 * 10', 3000000]
          assert data['P0003']['v'][-1] == ['17 * 19', 8760000]
          assert data['P0008']['v'][-1] == ['E16 * E22', 8040000]
          assert data['P0460']['v'] == [['5E',1500000],['6E',1500000],['7E',1500000],['8E',1500000],['10E',1500000]]
          assert data['P0462']['v'] == [['10',6600000],['12',6600000],['14',6600000],['16',6600000],['18',6600000],['20',6600000],['22',6600000]]
          assert data['P0463']['v'][0] == ['8',8040000]
          assert ['8',3960000] in data['P0463']['v']
          assert data['P0464']['v'] == [['24E',40800000]]
          assert data['P0487']['v'] == [['6" (15 سانتی)',4500000],['8" (20 سانتی)',36000000]]
          assert data['P0488']['v'] == [['1/4',1260000],['10',3240000]]
          assert len(data['P0491']['v']) == 10 and data['P0491']['v'][-1] == ['1/2-1 به 1"',144000000]
          assert data['P0498']['v'] == [['T60',48000000],['T70',48000000],['T80',48000000],['T90',48000000],['T100',48000000]]
          assert len(data['P0505']['v']) == 8 and data['P0505']['v'][-1] == ['M16',10800000]
          assert len(data['P0827']['v']) == 7 and data['P0827']['v'][-1] == ['1/2-1 به 1"',60000000]
          assert data['P0838']['v'] == [['24E',17000000],['28E',19000000]]
          assert [pid for pid,d in data.items() if d.get('p') is None] == ['P0184','P0626','P0631','P0720','P0737']

          text = json.dumps(data, ensure_ascii=False, separators=(',',':'))
          path.write_text(text, encoding='utf-8')

          packed = base64.b64encode(gzip.compress(text.encode('utf-8'), mtime=0)).decode('ascii')
          Path('catalog_site_mapping_908/price-size-data.js').write_text(
              "window.AZIM_PRICE_SIZE_DATA_B64='" + packed + "';", encoding='utf-8'
          )
          Path('.github/price-size-source.b64').write_text(packed + '\n', encoding='utf-8')
          Path('catalog_site_mapping_908/prices.json').write_text(
              json.dumps({pid:d.get('p') for pid,d in data.items()}, ensure_ascii=False, separators=(',',':')),
              encoding='utf-8'
          )

          sized = sum(bool((d or {}).get('v')) for d in data.values())
          variants = sum(len((d or {}).get('v', [])) for d in data.values())
          nulls = sum((d or {}).get('p') is None for d in data.values())
          print(f'PDF PRICE DATA VERIFIED: {len(data)} IDs; {sized} products with size variants; {variants} variant rows; {nulls} null-base IDs')
          print('final payload sha256:', hashlib.sha256(packed.encode()).hexdigest())
          PY
      - name: Persist generated data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog_site_mapping_908/price-size-data.json catalog_site_mapping_908/price-size-data.js catalog_site_mapping_908/prices.json .github/price-size-source.b64
          if git diff --cached --quiet; then echo "No generated changes"; else git commit -m "build: materialize verified PDF price variants [skip ci]"; git push origin HEAD:main; fi
