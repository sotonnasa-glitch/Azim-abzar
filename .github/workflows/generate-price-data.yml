name: Materialize PDF price-size data
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore and validate complete PDF price-size source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, subprocess, zlib
          from pathlib import Path

          SOURCE_COMMIT = 'bd0c2ce7771a58f4485a0e1a6c25ec84f14e65a5'
          SOURCE_PATH = 'catalog_site_mapping_908/product_sizes.deflate.b64'
          subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', SOURCE_COMMIT], check=True)
          b64 = ''.join(subprocess.check_output(['git', 'show', f'{SOURCE_COMMIT}:{SOURCE_PATH}'], text=True).split())
          if len(b64) % 4:
              b64 += '=' * (4 - len(b64) % 4)
          print(f'compressed product-size source len={len(b64)} sha256={hashlib.sha256(b64.encode()).hexdigest()}')

          raw = base64.b64decode(b64, validate=True)
          decoded = zlib.decompress(raw)
          source = json.loads(decoded.decode('utf-8'))
          print('decoded source type=', type(source).__name__)
          print('decoded source keys=', len(source) if isinstance(source, dict) else 'n/a')
          print('P0001 source=', source.get('P0001') if isinstance(source, dict) else None)

          expected_ids = [f'P{i:04d}' for i in range(1, 909)]
          assert isinstance(source, dict) and list(source) == expected_ids, 'compressed source is not the complete 908-product size dataset'

          # Normalize either the historical {size,price} list form or the existing
          # {v:[[size,price],...]} form into the runtime schema used by products-v4.
          data = {}
          for pid in expected_ids:
              item = source[pid] or {}
              if isinstance(item, dict) and 'v' in item:
                  variants = item.get('v') or []
                  data[pid] = {'v': [[str(s), int(p)] for s, p in variants]}
              elif isinstance(item, list):
                  variants = []
                  for row in item:
                      if isinstance(row, dict) and 'size' in row and 'price' in row:
                          variants.append([str(row['size']), int(row['price'])])
                      elif isinstance(row, (list, tuple)) and len(row) >= 2:
                          variants.append([str(row[0]), int(row[1])])
                  data[pid] = {'v': variants} if variants else {}
              elif isinstance(item, dict) and 'size' in item and 'price' in item:
                  data[pid] = {'v': [[str(item['size']), int(item['price'])]]}
              else:
                  data[pid] = {}

          def variants(pid):
              return dict(data[pid].get('v', []))

          expected1 = {'4': 2520000, '5': 2520000, '6': 1620000, '7': 1620000, '8': 1680000, '10': 1920000, '12': 2220000, '14': 2700000, '19': 4140000, '41': 55800000, '46': 63600000, '50': 72000000}
          expected2 = {'6×7': 2640000, '8×9': 2880000, '8×10': 3000000, '10×11': 3600000}
          expected3 = {'8×10': 4800000, '10×11': 5040000, '12×10': 5640000, '13×11': 5640000, '13×12': 6000000, '17×14': 8040000, '19×17': 8760000}
          for pid, expected in [('P0001', expected1), ('P0002', expected2), ('P0003', expected3)]:
              actual = variants(pid)
              assert all(actual.get(k) == v for k, v in expected.items()), f'{pid} PDF price spot-check failed'

          out = Path('catalog_site_mapping_908/price-size-data.json')
          out.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          print('P0001 verified:', expected1)
          print('P0002 verified:', expected2)
          print('P0003 verified:', expected3)
          print(f'PDF PRICE DATA VERIFIED: 908 IDs; {sum(bool(d.get("v")) for d in data.values())} products with size variants; {sum(len(d.get("v", [])) for d in data.values())} variant rows')
          PY
      - name: Persist generated data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog_site_mapping_908/price-size-data.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "build: materialize verified PDF price-size data [skip ci]"
            git push origin HEAD:main
          fi
