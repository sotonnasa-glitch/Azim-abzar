name: Materialize PDF price-size data
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble and validate PDF price payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, json
          from pathlib import Path
          parts = sorted(Path('.github/price-parts').glob('[0-9][0-9]'))
          assert len(parts) == 8, f'expected 8 payload parts, found {len(parts)}'
          b64 = ''.join(p.read_text(encoding='utf-8').replace('\n','').replace('\r','').strip() for p in parts)
          assert len(b64) == 10672, f'unexpected payload length: {len(b64)}'
          raw = base64.b64decode(b64, validate=True)
          data = json.loads(gzip.decompress(raw).decode('utf-8'))
          assert isinstance(data, dict) and len(data) == 908
          assert list(data) == [f'P{i:04d}' for i in range(1, 909)]
          out = Path('catalog_site_mapping_908/price-size-data.json')
          out.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          js = Path('catalog_site_mapping_908/price-size-data.js')
          js.write_text("window.AZIM_PRICE_SIZE_DATA_B64='" + b64 + "';\n", encoding='utf-8')
          sized = sum(bool((d or {}).get('v')) for d in data.values())
          rows = sum(len((d or {}).get('v', [])) for d in data.values())
          print(f'PDF PRICE DATA VERIFIED: 908 IDs; {sized} products with size variants; {rows} variant rows; payload={len(b64)} chars')
          print('Representative P0001/P0002/P0003 data was already validated during local PDF extraction.')
          PY
      - name: Persist generated data and clean temporary payload parts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/price-parts
          rm -f .github/workflows/verify-price-variants.yml .github/workflows/inspect-size-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog_site_mapping_908/price-size-data.json catalog_site_mapping_908/price-size-data.js .github/price-parts .github/workflows/verify-price-variants.yml .github/workflows/inspect-size-source.yml
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "build: materialize verified PDF price-size data [skip ci]"
            git push origin HEAD:main
          fi
