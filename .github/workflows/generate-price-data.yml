name: Materialize PDF price-size data
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate bundled PDF price payload and materialize JSON
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, hashlib, json, re
          from pathlib import Path

          source = Path('catalog_site_mapping_908/price-size-data.js')
          text = source.read_text(encoding='utf-8')
          match = re.fullmatch(r"window\.AZIM_PRICE_SIZE_DATA_B64='([A-Za-z0-9+/=]+)';", text.strip())
          assert match, 'price-size-data.js payload wrapper is invalid'
          b64 = match.group(1)
          print(f'bundled payload len={len(b64)} sha256={hashlib.sha256(b64.encode()).hexdigest()}')
          assert len(b64) == 10665, f'unexpected bundled payload length: {len(b64)}'

          raw = base64.b64decode(b64, validate=True)
          data = json.loads(gzip.decompress(raw).decode('utf-8'))
          assert isinstance(data, dict) and len(data) == 908, f'expected 908 products, got {len(data) if isinstance(data, dict) else type(data).__name__}'
          assert list(data) == [f'P{i:04d}' for i in range(1, 909)]

          out = Path('catalog_site_mapping_908/price-size-data.json')
          out.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')

          sized = sum(bool((d or {}).get('v')) for d in data.values())
          rows = sum(len((d or {}).get('v', [])) for d in data.values())
          print(f'PDF PRICE DATA VERIFIED: 908 IDs; {sized} products with size variants; {rows} variant rows; payload={len(b64)} chars')
          PY
      - name: Clean obsolete payload parts and persist generated JSON
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/price-parts
          rm -f .github/workflows/verify-price-variants.yml .github/workflows/inspect-size-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "build: materialize verified PDF price-size JSON [skip ci]"
            git push origin HEAD:main
          fi
