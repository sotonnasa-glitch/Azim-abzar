name: Temporary address map link updater

on:
  push:
    paths:
      - '.github/workflows/temp-address-link.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update address link
        shell: python
        run: |
          from pathlib import Path
          p = Path('contact.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="contact-item"><span class="icon">⌖</span><span><b>آدرس</b><small>تهران، محدوده بازار بزرگ تهران، مرکز ابزار و یراق</small></span></div>'
          new = '<a class="contact-item" href="https://nshn.ir/?lat=35.6719&lng=51.4220" target="_blank" rel="noopener noreferrer"><span class="icon">⌖</span><span><b>آدرس</b><small>تهران، محدوده بازار بزرگ تهران، مرکز ابزار و یراق</small></span><span class="arrow">↗</span></a>'
          if old not in s:
              raise SystemExit('Target address card not found; no changes made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contact.html .github/workflows/temp-address-link.yml
          git rm .github/workflows/temp-address-link.yml
          git commit -m "Link address card to Neshan map"
          git push