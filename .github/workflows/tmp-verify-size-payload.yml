name: Temp verify size payload
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify JSON, JS payload and source payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, hashlib, json, re
          from pathlib import Path

          json_path = Path('catalog_site_mapping_908/price-size-data.json')
          js_path = Path('catalog_site_mapping_908/price-size-data.js')
          source_path = Path('.github/price-size-source.b64')

          data = json.loads(json_path.read_text(encoding='utf-8'))
          ids = [f'P{i:04d}' for i in range(1,909)]
          assert list(data) == ids

          sized_ids = [pid for pid,d in data.items() if isinstance(d, dict) and d.get('v')]
          variant_rows = sum(len(d.get('v', [])) for d in data.values() if isinstance(d, dict))

          js = js_path.read_text(encoding='utf-8').strip()
          m = re.fullmatch(r\"window\\.AZIM_PRICE_SIZE_DATA_B64='([^']+)';\", js)
          assert m, 'JS payload format mismatch'
          js_b64 = m.group(1)
          js_data = json.loads(gzip.decompress(base64.b64decode(js_b64)).decode('utf-8'))
          assert js_data == data, 'JS decoded payload differs from JSON'

          source_b64 = source_path.read_text(encoding='utf-8').strip()
          assert source_b64 == js_b64, '.github/price-size-source.b64 differs from JS payload'

          def norm_variants(d):
              out = {}
              for row in d.get('v', []):
                  if isinstance(row, list) and len(row) == 2:
                      key = re.sub(r'\\s*\\*\\s*', '*', str(row[0]).strip())
                      out[key] = row[1]
              return out

          checks = {}
          for pid in sized_ids:
              checks[pid] = {
                  'base_price': data[pid].get('p'),
                  'variant_count': len(data[pid].get('v', [])),
                  'variants': norm_variants(data[pid])
              }

          report = {
              'status': 'PASS',
              'product_count': len(data),
              'sized_product_count': len(sized_ids),
              'variant_row_count': variant_rows,
              'null_base_ids': [pid for pid,d in data.items() if d.get('p') is None],
              'json_sha256': hashlib.sha256(json_path.read_bytes()).hexdigest(),
              'packed_payload_sha256': hashlib.sha256(js_b64.encode()).hexdigest(),
              'js_matches_json': True,
              'source_matches_js': True,
              'sized_products': checks,
          }
          Path('tmp-size-verification.json').write_text(json.dumps(report, ensure_ascii=False, separators=(',',':')), encoding='utf-8')
          print(f\"PASS: {len(data)} products; {len(sized_ids)} sized products; {variant_rows} variant rows\")
          PY
      - name: Commit verification report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-size-verification.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test: store size verification report [skip ci]'
          git push origin HEAD:main
