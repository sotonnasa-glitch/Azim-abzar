name: Export full project for AI audit
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
      - name: Create full project archive
        shell: bash
        run: |
          set -euo pipefail
          printf 'Azim Abzar full-project audit archive\nCommit: %s\nRepository: %s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" > PROJECT_AUDIT_INFO.txt
          tar --exclude='.git' -czf /tmp/Azim-abzar-full-project.tar.gz .
          sha256sum /tmp/Azim-abzar-full-project.tar.gz | tee /tmp/Azim-abzar-full-project.sha256
      - name: Upload full project archive
        uses: actions/upload-artifact@v4
        with:
          name: Azim-abzar-full-project-${{ github.sha }}
          path: |
            /tmp/Azim-abzar-full-project.tar.gz
            /tmp/Azim-abzar-full-project.sha256
          if-no-files-found: error
          retention-days: 7
