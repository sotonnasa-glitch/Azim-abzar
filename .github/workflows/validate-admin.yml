name: Validate admin panel

on:
  push:
    paths:
      - 'admin-app.js'
      - 'admin.html'
      - 'admin-modern.css'
      - 'supabase/migrations/**'
      - 'database/discount-engine-hardening.sql'
      - 'database/admin-integrity.sql'
      - 'test-admin-static.mjs'
      - 'test-admin-stage5-security-v2.mjs'
      - 'audit/PROGRESS_9_PHASES_FA.md'
      - 'scripts/admin-browser-smoke.mjs'
      - 'supabase/migrations/20260927003600_admin_payment_control_center.sql'
      - '.github/workflows/validate-admin.yml'
  pull_request:
    paths:
      - 'admin-app.js'
      - 'admin.html'
      - 'admin-modern.css'
      - 'supabase/migrations/**'
      - 'database/discount-engine-hardening.sql'
      - 'database/admin-integrity.sql'
      - 'test-admin-static.mjs'
      - 'test-admin-stage5-security-v2.mjs'
      - 'audit/PROGRESS_9_PHASES_FA.md'
      - 'scripts/admin-browser-smoke.mjs'
      - '.github/workflows/validate-admin.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Syntax check admin JavaScript
        run: node --check admin-app.js
      - name: Deep admin static regression audit
        run: node test-admin-static.mjs
      - name: Stage 5 admin security regression tests
        run: node test-admin-stage5-security-v2.mjs
      - name: Verify discount SQL
        shell: bash
        run: |
          grep -q 'discounts_code_upper_uniq' database/discount-engine-hardening.sql
          grep -q 'azim_save_order_with_discount' database/discount-engine-hardening.sql
          grep -q 'security invoker' database/discount-engine-hardening.sql
      - name: Install Playwright
        run: npm install --no-save playwright@1.63.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Read public Supabase URL for local server boot
        shell: bash
        run: |
          set -euo pipefail
          echo "AZIM_SUPABASE_URL=$(node -e "const fs=require('fs');const s=fs.readFileSync('supabase-config.js','utf8');const m=s.match(/AZIM_SUPABASE_URL='([^']+)'/);if(!m)throw new Error('Public Supabase URL not found');process.stdout.write(m[1])")" >> "$GITHUB_ENV"
      - name: Start local Express server for source-accurate UI tests
        shell: bash
        run: |
          set -euo pipefail
          export AZIM_SUPABASE_URL="$(node -e "const fs=require('fs');const s=fs.readFileSync('supabase-config.js','utf8');const m=s.match(/AZIM_SUPABASE_URL='([^']+)'/);if(!m)throw new Error('Public Supabase URL not found');process.stdout.write(m[1])")"
          test -n "$AZIM_SUPABASE_URL"
          nohup env AZIM_SUPABASE_URL="$AZIM_SUPABASE_URL" npm run start > /tmp/azim-abzar-admin-test-server.log 2>&1 &
          echo $! > /tmp/azim-abzar-admin-test-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              echo "Local Express health route is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/azim-abzar-admin-test-server.log
          exit 1
      - name: Test admin login, orders workflow and access gate
        env:
          AZIM_ADMIN_BASE_URL: http://127.0.0.1:3000
          AZIM_ADMIN_LIVE_BASE_URL: https://azimabzar.com
        run: node scripts/admin-browser-smoke.mjs
