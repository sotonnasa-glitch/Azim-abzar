name: Site button and link test
on:
  push:
    paths: ['index.html','contact.html','.github/workflows/site-button-test.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate links anchors controls and JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re, sys, subprocess
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.hrefs=[]; self.ids=set(); self.controls=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if a.get('id'): self.ids.add(a['id'])
                  if tag=='a': self.hrefs.append(a.get('href',''))
                  if tag=='button' or (tag=='input' and a.get('type','').lower() in ('button','submit')): self.controls.append((tag,a))
          errors=[]
          texts={}
          for fn in ('index.html','contact.html'):
              text=Path(fn).read_text(encoding='utf-8'); texts[fn]=text; p=P(); p.feed(text)
              print(f'=== {fn} ==='); print('IDs:',sorted(p.ids)); print('Links:',len(p.hrefs),'Controls:',len(p.controls))
              for h in p.hrefs:
                  if h.startswith('#') and h[1:] not in p.ids: errors.append(f'{fn}: broken anchor {h}')
                  elif h and not h.startswith(('http://','https://','mailto:','tel:','javascript:','data:')):
                      path=h.split('#',1)[0]
                      if path and path not in ('.','./') and not Path(path).exists(): errors.append(f'{fn}: missing local target {h}')
              for tag,a in p.controls: print('CONTROL',tag,a.get('type',''),a.get('onclick',''))
              for s in re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',text,re.I|re.S):
                  Path('/tmp/check.js').write_text(s,encoding='utf-8')
                  r=subprocess.run(['node','--check','/tmp/check.js'],capture_output=True,text=True)
                  if r.returncode: errors.append(f'{fn}: JavaScript syntax error: {r.stderr.strip()}')
          checks=[
            ('index contact page link','contact.html' in texts['index.html']),
            ('contact logo goes home','<a class="logo" href="./">' in texts['contact.html'] or '<a class="logo" href="./index.html">' in texts['contact.html']),
            ('contact dedicated history back button','class="back-page"' in texts['contact.html'] and 'history.back()' in texts['contact.html']),
            ('contact map link','nshn.ir' in texts['contact.html']),
            ('contact form mailto','mailto:' in texts['contact.html'])]
          for n,ok in checks: print(('PASS' if ok else 'FAIL'),n); errors += [] if ok else [n]
          if errors:
              print('FAILURES:'); print('\n'.join(errors)); sys.exit(1)
          print('ALL CHECKS PASSED')
          PY