name: Site button and link test
on:
  push:
    paths:
      - 'index.html'
      - 'contact.html'
      - '.github/workflows/site-button-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test HTML links and buttons
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse
          import re, sys

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]; self.ids=set(); self.buttons=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if 'id' in a: self.ids.add(a['id'])
                  if tag=='a': self.links.append(a.get('href',''))
                  if tag in ('button','input') and (tag=='button' or a.get('type','').lower() in ('button','submit')): self.buttons.append((tag,a))

          errors=[]
          for fn in ('index.html','contact.html'):
              p=P(); text=Path(fn).read_text(encoding='utf-8'); p.feed(text)
              print(f'\n=== {fn} ===')
              print('anchors:',len(p.links),'buttons/submit:',len(p.buttons),'ids:',len(p.ids))
              for h in p.links:
                  if not h or h.startswith(('http://','https://','mailto:','tel:','javascript:','data:')): continue
                  path,_,frag=h.partition('#')
                  target=(Path(fn).parent / (path or fn)).resolve()
                  if path and not target.exists(): errors.append(f'{fn}: broken local target {h}')
                  if frag and frag not in p.ids:
                      # fragment may target another local page; resolve that page when possible
                      if path:
                          tp=Path(path)
                          if tp.exists():
                              q=P(); q.feed(tp.read_text(encoding='utf-8'))
                              if frag not in q.ids: errors.append(f'{fn}: broken fragment {h}')
                          else: errors.append(f'{fn}: broken fragment target {h}')
                      else: errors.append(f'{fn}: broken fragment #{frag}')
                  print(' LINK',h)
              for tag,a in p.buttons: print(' BUTTON',tag,a.get('type',''),a.get('onclick',''))
              for form in re.findall(r'<form\b[^>]*>',text,re.I): print(' FORM',form)

          # Required navigation checks
          idx=Path('index.html').read_text(encoding='utf-8')
          con=Path('contact.html').read_text(encoding='utf-8')
          checks=[
              ('index has contact page link', 'contact.html' in idx),
              ('contact logo points home', re.search(r'<a class="logo"\s+href="\./(?:index\.html)?"', con) is not None),
              ('contact has dedicated history back button', 'history.back()' in con and 'class="back-page"' in con),
              ('contact has homepage link', 'href="./"' in con or 'href="./index.html"' in con),
              ('contact form has mail action', 'mailto:' in con),
              ('contact address has map link', 'nshn.ir' in con),
          ]
          for name,ok in checks: print(('PASS' if ok else 'FAIL'),name); errors += [] if ok else [name]
          if errors:
              print('\nFAILURES:'); print('\n'.join(errors)); sys.exit(1)
          print('\nALL CHECKS PASSED')
          PY
      - name: Remove temporary test workflow
        if: always()
        run: |
          rm -f .github/workflows/site-button-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/site-button-test.yml
          git diff --cached --quiet || git commit -m 'Remove temporary site test workflow'
          git push