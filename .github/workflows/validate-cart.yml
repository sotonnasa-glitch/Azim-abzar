name: Validate cart

on:
  push:
    paths:
      - 'cart.html'
      - 'azim-cart.js'
      - 'products-v4.html'
      - 'index.html'
      - 'contact.html'
      - 'database/public-cart.sql'
      - '.github/workflows/validate-cart.yml'
  pull_request:
    paths:
      - 'cart.html'
      - 'azim-cart.js'
      - 'products-v4.html'
      - 'index.html'
      - 'contact.html'
      - 'database/public-cart.sql'
      - '.github/workflows/validate-cart.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check shared cart JavaScript
        run: node --check azim-cart.js
      - name: Verify cart wiring
        shell: bash
        run: |
          test -f cart.html
          grep -q 'azim-cart.js' cart.html
          grep -q 'azim-cart.js' products-v4.html
          grep -q 'azim-cart.js' index.html
          grep -q 'azim-cart.js' contact.html
          grep -q 'addCatalogItemToCart' products-v4.html
          grep -q 'azim_cart_checkout' cart.html
          grep -q 'name="paymentMethod"' cart.html
          grep -q 'p_payment_method:' cart.html
          grep -q 'azim_checkout_options' cart.html
          grep -q 'data-cart-link' products-v4.html
      - name: Check order tracking page
        shell: bash
        run: |
          test -f order-status.html
          grep -q 'azim_order_status' order-status.html
          grep -q 'پیگیری سفارش' order-status.html
          grep -q 'azim_request_order_cancel' order-status.html
          grep -q 'azim_request_order_return' order-status.html
          grep -q 'window.copyText' order-status.html

      - name: Check public cart SQL
        shell: bash
        run: |
          grep -q 'azim_cart_checkout' database/public-cart.sql
          grep -q 'SECURITY DEFINER' database/public-cart.sql
          grep -q 'grant execute' database/public-cart.sql
          grep -Eq 'as \$(\$|function\$)' database/public-cart.sql
          grep -Eq '\$(\$|function\$);' database/public-cart.sql

      - name: Check online payment gateway boundary
        run: |
          test -f supabase/functions/azim-payment-gateway/index.ts
          grep -q 'PAYMENT_PROVIDER_NOT_IMPLEMENTED' supabase/functions/azim-payment-gateway/index.ts
          grep -q 'payment_transactions' supabase/functions/azim-payment-gateway/index.ts
          grep -q 'if (action === "start")' supabase/functions/azim-payment-gateway/index.ts
          grep -q 'if (action === "verify")' supabase/functions/azim-payment-gateway/index.ts
          grep -q 'payment-callback.html' supabase/functions/azim-payment-gateway/index.ts
          grep -q 'online_available' database/checkout-actions.sql
          grep -q 'azim-payment-gateway' cart.html
