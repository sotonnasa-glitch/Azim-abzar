name: Definitive catalog image enhancement

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Guard cleanup commits
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MESSAGE" == *"[skip ci]"* ]]; then
            echo "Cleanup commit; exiting without reprocessing."
            exit 0
          fi

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check --no-input Pillow

      - name: Process all catalog images from original source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIGRATOR_URL: https://lzkrwtnylkordkwkdyzp.supabase.co/functions/v1/catalog-image-migrator
          SOURCE_COMMIT: a873c04bcd2a170c9dd35cc3239bcfb5c171e2d9
        run: |
          set -euo pipefail
          mkdir -p work
          : > image-enhancement-report.txt
          processed=0
          missing=0
          failed=0

          for n in $(seq 1 908); do
            id=$(printf 'P%04d' "$n")
            src="https://raw.githubusercontent.com/sotonnasa-glitch/Azim-abzar/${SOURCE_COMMIT}/catalog_site_mapping_908/images/${id}.jpg"
            input="work/${id}.jpg"
            output="work/${id}-up.jpg"

            if ! curl -L --fail --silent --show-error --retry 5 --retry-delay 2 --connect-timeout 20 --max-time 120 -o "$input" "$src"; then
              echo "$id MISSING" | tee -a image-enhancement-report.txt
              missing=$((missing+1))
              continue
            fi

            if ! python - "$input" "$output" <<'PY'
from PIL import Image, ImageOps, ImageFilter
import sys
src, dst = sys.argv[1], sys.argv[2]
with Image.open(src) as im:
    im = ImageOps.exif_transpose(im).convert('RGB')
    w, h = im.size
    nw, nh = int(round(w * 2.0)), int(round(h * 2.0))
    max_dim = 1800
    if max(nw, nh) > max_dim:
        scale = max_dim / max(w, h)
        nw, nh = max(1, int(round(w*scale))), max(1, int(round(h*scale)))
    im = im.resize((nw, nh), Image.Resampling.LANCZOS)
    im = im.filter(ImageFilter.UnsharpMask(radius=1.15, percent=135, threshold=3))
    im.save(dst, 'JPEG', quality=90, optimize=True, progressive=True, subsampling=0)
PY
            then
              echo "$id PROCESS_ERROR" | tee -a image-enhancement-report.txt
              failed=$((failed+1))
              rm -f "$input" "$output"
              continue
            fi

            response=$(curl -L --fail --silent --show-error --retry 5 --retry-delay 2 --connect-timeout 20 --max-time 120 \
              -X POST \
              -H "x-github-token: $GITHUB_TOKEN" \
              -H "x-image-id: $id" \
              -H "content-type: image/jpeg" \
              --data-binary "@$output" \
              "$MIGRATOR_URL?action=upload") || {
                echo "$id UPLOAD_ERROR" | tee -a image-enhancement-report.txt
                failed=$((failed+1))
                rm -f "$input" "$output"
                continue
              }

            if ! grep -q '"ok":true' <<< "$response"; then
              echo "$id UPLOAD_ERROR $response" | tee -a image-enhancement-report.txt
              failed=$((failed+1))
              rm -f "$input" "$output"
              continue
            fi

            processed=$((processed+1))
            echo "$id OK" >> image-enhancement-report.txt
            rm -f "$input" "$output"
            if (( processed % 25 == 0 )); then
              echo "PROGRESS processed=$processed missing=$missing failed=$failed"
            fi
          done

          echo "SUMMARY processed=$processed missing=$missing failed=$failed" | tee -a image-enhancement-report.txt
          test "$processed" -eq 881
          test "$missing" -eq 27
          test "$failed" -eq 0

      - name: Verify representative images
        shell: bash
        run: |
          set -euo pipefail
          for sample in P0001 P0339 P0908; do
            curl --fail --silent --show-error -I "https://lzkrwtnylkordkwkdyzp.supabase.co/storage/v1/object/public/catalog-images/${sample}.jpg" >/dev/null
          done
          echo "Supabase representative checks passed."

      - name: Save report and remove temporary workflows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo-cleanup
          cd repo-cleanup
          cp ../image-enhancement-report.txt .
          rm -f .github/workflows/catalog-image-enhancement.yml .github/workflows/upscale-catalog-images-final.yml lightweight-upscale-test.txt image-debug-response.txt chunks-report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finish catalog image enhancement [skip ci]"
          git push origin HEAD:main
