name: Validate Mascot AI

on:
  pull_request:
    paths:
      - "azim-product-ai.js"
      - "azim-product-ai.css"
      - "azim-ai-widget.js"
      - "assets/ai/azim-mascot.webp"
      - ".github/workflows/validate-mascot-ai.yml"

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check azim-product-ai.js
          node --check azim-ai-widget.js
      - name: Verify mascot asset
        run: |
          test -s assets/ai/azim-mascot.webp
