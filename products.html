<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>کاتالوگ محصولات | عظیم ابزار</title><style>body{margin:0;background:#0b0d0c;color:#f5f5f5;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1250px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0}.brand{font-size:24px;font-weight:900}.badge{background:#f5b900;color:#111;padding:7px 11px;border-radius:9px;font-weight:900}.tools{display:grid;grid-template-columns:1fr 260px;gap:10px;margin:12px 0}input,select{width:100%;height:46px;box-sizing:border-box;background:#151917;border:1px solid #353b37;border-radius:10px;color:#fff;padding:0 13px;font:inherit}.status{color:#a7ada9;margin:10px 0 16px}.status b{color:#f5b900}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#151917;border:1px solid #303632;border-radius:15px;padding:14px;min-height:160px}.cat{color:#f5b900;font-size:11px;font-weight:800}.name{font-size:15px;font-weight:800;line-height:1.8;margin:8px 0}.price{font-size:17px;font-weight:900;margin-top:10px}.old{font-size:11px;color:#777;text-decoration:line-through;margin-top:4px}.code{font-size:10px;color:#727973;margin-top:8px}.pages{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:28px 0}.pages button{background:#171b19;border:1px solid #3a403c;color:#fff;border-radius:8px;padding:8px 11px;cursor:pointer}.pages button.active{background:#f5b900;color:#111}.empty,.error{padding:30px;text-align:center;border:1px dashed #3a403c;border-radius:12px;color:#aaa}.error{color:#ffb2b2;border-color:#6d3838}.loading{text-align:center;padding:40px;color:#aaa}@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.tools{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.wrap{padding:12px}.grid{grid-template-columns:1fr}.brand{font-size:20px}}</style></head><body><main class="wrap"><div class="top"><div class="brand">عظیم ابزار — کاتالوگ محصولات</div><div class="badge" id="badge">در حال بارگذاری</div></div><div class="tools"><input id="q" placeholder="جستجوی نام، سایز، کد یا دسته‌بندی..."><select id="cat"><option value="">همه دسته‌بندی‌ها</option></select></div><div id="status" class="status">در حال دریافت کاتالوگ کامل...</div><div id="loading" class="loading">در حال آماده‌سازی محصولات...</div><div id="error" class="error" style="display:none"></div><div id="grid" class="grid"></div><div id="pages" class="pages"></div></main><script>const per=36;let all=[],q='',cat='',page=1;const fmt=n=>new Intl.NumberFormat('fa-IR').format(Number(n)||0);const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));function normalize(a){return Array.isArray(a)?a.map((p,i)=>({name:String(p.name??p.title??'محصول').trim(),category:String(p.category??p.category_name??p.cat??'ابزار').trim(),price:p.price,original_price:p.original_price??p.price,code:p.code??`PDF-${String(i+1).padStart(4,'0')}`,page:p.page??p.source_page??''})).filter(x=>x.name):[]}async function load(){try{let r=await fetch('data/products-db.gz.b64?v=281',{cache:'no-store'});if(!r.ok)throw Error('db fetch '+r.status);let b=atob((await r.text()).replace(/\s+/g,''));let u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);let t=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();all=normalize(JSON.parse(t));if(!all.length)throw Error('empty catalog');const s=document.getElementById('cat');[...new Set(all.map(x=>x.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fa')).forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;s.appendChild(o)});render()}catch(e){document.getElementById('loading').style.display='none';document.getElementById('error').style.display='block';document.getElementById('error').textContent='خطا در بارگذاری کاتالوگ: '+e.message}}function filtered(){const z=q.toLowerCase();return all.filter(x=>(!cat||x.category===cat)&&(!z||`${x.name} ${x.category} ${x.code}`.toLowerCase().includes(z)))}function render(){document.getElementById('loading').style.display='none';document.getElementById('badge').textContent=fmt(all.length)+' محصول';const a=filtered(),total=Math.max(1,Math.ceil(a.length/per));if(page>total)page=total;const rows=a.slice((page-1)*per,page*per);document.getElementById('status').innerHTML=`نمایش <b>${fmt(rows.length)}</b> از <b>${fmt(a.length)}</b> محصول · مجموع <b>${fmt(all.length)}</b> محصول`;document.getElementById('grid').innerHTML=rows.map(x=>`<article class="card"><div class="cat">${esc(x.category)}</div><div class="name">${esc(x.name)}</div><div class="price">${x.price==null?'استعلام قیمت':fmt(x.price)+' تومان'}</div><div class="old">${x.original_price==null?'':fmt(x.original_price)+' تومان'}</div><div class="code">${esc(x.code)}${x.page?` · صفحه ${esc(x.page)}`:''}</div></article>`).join('');const p=document.getElementById('pages');p.innerHTML='';for(let i=Math.max(1,page-2);i<=Math.min(total,page+2);i++){const b=document.createElement('button');b.textContent=fmt(i);if(i===page)b.className='active';b.onclick=()=>{page=i;render();scrollTo({top:0,behavior:'smooth'})};p.appendChild(b)}}document.getElementById('q').oninput=e=>{q=e.target.value.trim();page=1;render()};document.getElementById('cat').onchange=e=>{cat=e.target.value;page=1;render()};load();</script></body></html>
