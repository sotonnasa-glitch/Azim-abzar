<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="کاتالوگ کامل محصولات عظیم ابزار"><title>محصولات | عظیم ابزار</title><style>body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#0b0d0c;color:#f4f5f3}.wrap{max-width:1200px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 0}.brand{font-size:25px;font-weight:900}.badge{background:#f5b900;color:#111;padding:7px 12px;border-radius:8px;font-weight:900}.tools{display:grid;grid-template-columns:1fr 260px;gap:10px;margin:12px 0 18px}input,select{width:100%;height:46px;box-sizing:border-box;background:#141816;border:1px solid #343936;border-radius:10px;color:#fff;padding:0 13px;font:inherit}.status{color:#a2aaa4;margin:10px 0 15px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#151916;border:1px solid #303632;border-radius:14px;padding:15px}.cat{color:#f5b900;font-size:12px;font-weight:800}.name{font-size:16px;font-weight:800;line-height:1.8;margin:8px 0 3px}.variant{font-size:12px;color:#aab1ac}.price{font-size:17px;font-weight:900;margin-top:12px}.old{font-size:11px;color:#737a75;text-decoration:line-through;margin-top:4px}.code{font-size:10px;color:#747c76;margin-top:8px}.load{padding:45px;text-align:center;border:1px dashed #39403b;border-radius:14px;color:#a2aaa4}.pages{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:28px 0 45px}.pages button{background:#171b19;color:#fff;border:1px solid #3a403c;border-radius:8px;padding:8px 11px}.pages button.active{background:#f5b900;color:#111;font-weight:900}.empty{text-align:center;color:#aaa;padding:45px}.error{background:#2a1515;border:1px solid #7d3d3d;color:#ffb7b7;padding:16px;border-radius:12px;margin:15px 0}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.tools{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:470px){.wrap{padding:12px}.grid{grid-template-columns:1fr}.brand{font-size:20px}}</style></head><body><div class="wrap"><div class="top"><div class="brand">عظیم ابزار — محصولات</div><div id="badge" class="badge">در حال بارگذاری</div></div><div class="tools"><input id="q" placeholder="جستجوی نام، سایز یا کد محصول..." autocomplete="off"><select id="cat"><option value="">همه دسته‌بندی‌ها</option></select></div><div id="status" class="status">در حال دریافت بانک محصولات...</div><div id="err" style="display:none" class="error"></div><div id="loading" class="load">در حال آماده‌سازی کاتالوگ محصولات...</div><div id="grid" class="grid"></div><div id="empty" class="empty" style="display:none">محصولی پیدا نشد.</div><div id="pages" class="pages"></div></div><script>
const fmt=n=>new Intl.NumberFormat('fa-IR').format(Number(n)||0);let all=[],view=[],page=1,q='',cat='';const per=36;
function normalize(raw){let a=Array.isArray(raw)?raw:(raw&&Array.isArray(raw.products)?raw.products:[]);return a.filter(x=>x&&(x.name||x.title)).map((x,i)=>{const c=x.category_name??x.category??x.cat??'ابزار';const v=x.name??x.title??'محصول';const n=(c&&/^\\d/.test(String(v)))?`${c} ${v}`:String(v);return{name:n,variant:String(v),category:String(c),price:x.price??x.sale_price??0,original_price:x.original_price??x.originalPrice??x.base_price??x.price??0,code:x.code??`SELPRO-${String(i+1).padStart(4,'0')}`,page:x.page??''}})}
async function load(){try{const r=await fetch('./data/products-db.gz.b64?v=278',{cache:'no-store'});if(!r.ok)throw new Error('فایل بانک محصولات پیدا نشد');const b=atob((await r.text()).trim());const bytes=Uint8Array.from(b,c=>c.charCodeAt(0));let text='';if('DecompressionStream' in window){const ds=new DecompressionStream('gzip');const stream=new Blob([bytes]).stream().pipeThrough(ds);text=await new Response(stream).text()}else throw new Error('مرورگر از فشرده‌سازی بانک محصولات پشتیبانی نمی‌کند');all=normalize(JSON.parse(text));if(!all.length)throw new Error('بانک محصولات خالی است');const cats=[...new Set(all.map(x=>x.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fa'));for(const c of cats){const o=document.createElement('option');o.value=c;o.textContent=c;document.getElementById('cat').appendChild(o)}document.getElementById('badge').textContent=fmt(all.length)+' محصول';document.getElementById('loading').style.display='none';render()}catch(e){document.getElementById('loading').style.display='none';document.getElementById('err').style.display='block';document.getElementById('err').textContent='خطا در بارگذاری محصولات: '+e.message}}
function filtered(){const s=q.toLowerCase();return all.filter(x=>(!cat||x.category===cat)&&(!s||`${x.name} ${x.variant} ${x.code}`.toLowerCase().includes(s)))}
function render(){view=filtered();const total=Math.max(1,Math.ceil(view.length/per));if(page>total)page=total;const rows=view.slice((page-1)*per,page*per);document.getElementById('status').textContent=`نمایش ${fmt(rows.length)} از ${fmt(view.length)} محصول`;document.getElementById('grid').innerHTML=rows.map(x=>`<article class="card"><div class="cat">${x.category||'ابزار'}</div><div class="name">${x.name}</div><div class="variant">سایز / مدل: ${x.variant}</div><div class="price">${fmt(x.price)} تومان</div><div class="old">${fmt(x.original_price)} تومان</div><div class="code">${x.code}${x.page?` · صفحه ${fmt(x.page)}`:''}</div></article>`).join('');document.getElementById('empty').style.display=rows.length?'none':'block';const p=document.getElementById('pages');p.innerHTML='';for(let i=Math.max(1,page-2);i<=Math.min(total,page+2);i++){const b=document.createElement('button');b.textContent=fmt(i);if(i===page)b.className='active';b.onclick=()=>{page=i;render();scrollTo({top:0,behavior:'smooth'})};p.appendChild(b)}}
document.getElementById('q').oninput=e=>{q=e.target.value.trim();page=1;render()};document.getElementById('cat').onchange=e=>{cat=e.target.value;page=1;render()};load();
</script></body></html>
