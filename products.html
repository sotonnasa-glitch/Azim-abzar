<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محصولات | عظیم ابزار</title><style>body{margin:0;background:#0b0d0c;color:#f5f5f5;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1320px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:24px;font-weight:900}.badge{background:#f5b900;color:#111;padding:7px 11px;border-radius:9px;font-weight:900}.source{margin:10px 0 16px;padding:10px 12px;background:#111513;border:1px solid #2e342f;border-radius:10px;color:#b9bfbb;font-size:12px}.tools{display:grid;grid-template-columns:1fr 260px;gap:10px;margin:18px 0 10px}input,select{width:100%;height:46px;box-sizing:border-box;background:#151917;border:1px solid #353b37;border-radius:10px;color:#fff;padding:0 13px;font:inherit}.status{color:#a7ada9;margin:10px 0 16px}.status b{color:#f5b900}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#151917;border:1px solid #303632;border-radius:15px;padding:12px;overflow:hidden;min-height:300px;display:flex;flex-direction:column}.photo{width:100%;aspect-ratio:1.45;border-radius:12px;background:#0f1311;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:9px}.photo img{width:100%;height:100%;object-fit:cover;display:block}.cat{color:#f5b900;font-size:11px;font-weight:800}.name{font-size:15px;font-weight:800;line-height:1.8;margin:7px 0}.prices{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:auto}.price{font-size:17px;font-weight:900}.old{font-size:11px;color:#7e8881;text-decoration:line-through}.code{font-size:10px;color:#727973;margin-top:8px}.pages{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:28px 0}.pages button{background:#171b19;border:1px solid #3a403c;color:#fff;border-radius:8px;padding:8px 11px;cursor:pointer}.pages button.active{background:#f5b900;color:#111}.empty{grid-column:1/-1;padding:45px;text-align:center;color:#9ea6a0}.error{padding:30px;text-align:center;border:1px dashed #6d3838;border-radius:12px;color:#ffb2b2}.loading{text-align:center;padding:40px;color:#aaa}@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.tools{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.grid{grid-template-columns:1fr}.brand{font-size:20px}}</style></head><body><main class="wrap"><div class="top"><div class="brand">عظیم ابزار — محصولات</div><div class="badge" id="badge">در حال بارگذاری</div></div><div class="source">منبع: دیتابیس Supabase متصل به کاتالوگ ۸۹ صفحه‌ای مشتری · ۱۸۵۵ محصول · قیمت فروش با ۲۰٪ افزایش نسبت به قیمت پایه</div><div class="tools"><input id="q" placeholder="جستجوی نام، سایز، کد یا دسته‌بندی..."><select id="cat"><option value="">همه دسته‌بندی‌ها</option></select></div><div id="status" class="status">در حال آماده‌سازی محصولات...</div><div id="loading" class="loading">در حال بارگذاری محصولات از دیتابیس...</div><div id="error" class="error" style="display:none"></div><div id="grid" class="grid"></div><div id="pages" class="pages"></div></main><script>const SB_URL='https://lzkrwtnylkordkwkdyzp.supabase.co';const SB_KEY='sb_publishable_jnrMEKAW7prmIKcnFG_ANQ_s6VFrm_3';const PER=36;let all=[],q='',cat='',page=1;const fmt=n=>new Intl.NumberFormat('fa-IR').format(Number(n)||0);const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));async function loadCatalog(){const u=SB_URL+'/rest/v1/products?select=id,name,brand,cat,code,badge,description,img,original_price,price,is_active&is_active=eq.true&order=created_at.asc';const r=await fetch(u,{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});if(!r.ok)throw new Error('Supabase products request failed: '+r.status);const data=await r.json();if(!Array.isArray(data)||data.length<1800)throw new Error(`تعداد محصولات ناقص است: ${data.length} (باید ۱۸۵۵ باشد)`);return data}function filtered(){const z=q.toLowerCase();return all.filter(x=>(!cat||x.cat===cat)&&(!z||`${x.name} ${x.cat} ${x.code} ${x.brand}`.toLowerCase().includes(z)))}function render(){document.getElementById('loading').style.display='none';document.getElementById('badge').textContent=fmt(all.length)+' محصول';const a=filtered(),total=Math.max(1,Math.ceil(a.length/PER));if(page>total)page=total;const rows=a.slice((page-1)*PER,page*PER);document.getElementById('status').innerHTML=`نمایش <b>${fmt(rows.length)}</b> از <b>${fmt(a.length)}</b> محصول · مجموع <b>${fmt(all.length)}</b> محصول`;document.getElementById('grid').innerHTML=rows.length?rows.map(x=>{const img=x.img||'assets/tool-wrench.svg';return `<article class="card"><div class="photo"><img src="${esc(img)}" alt="${esc(x.name)}" loading="lazy" onerror="this.onerror=null;this.src='assets/tool-wrench.svg'"></div><div class="cat">${esc(x.cat||'ابزار')}</div><div class="name">${esc(x.name)}</div><div class="prices"><div class="price">${fmt(x.price)} تومان</div><div class="old">${fmt(x.original_price)} تومان</div></div><div class="code">کد ${esc(x.code||'')} ${x.brand?`· ${esc(x.brand)}`:''}</div></article>`}).join(''):'<div class="empty">محصولی با این جستجو پیدا نشد.</div>';const p=document.getElementById('pages');p.innerHTML='';for(let i=Math.max(1,page-2);i<=Math.min(total,page+2);i++){const b=document.createElement('button');b.textContent=fmt(i);if(i===page)b.className='active';b.onclick=()=>{page=i;render();scrollTo({top:0,behavior:'smooth'})};p.appendChild(b)}}function fail(e){document.getElementById('loading').style.display='none';document.getElementById('error').style.display='block';document.getElementById('error').textContent='خطا در بارگذاری کاتالوگ کامل: '+(e?.message||e)}async function init(){try{const params=new URLSearchParams(location.search);cat=params.get('cat')||'';all=await loadCatalog();const s=document.getElementById('cat');[...new Set(all.map(x=>x.cat).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fa')).forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;s.appendChild(o)});if(cat&&[...s.options].some(o=>o.value===cat))s.value=cat;render()}catch(e){fail(e)}}document.getElementById('q').oninput=e=>{q=e.target.value.trim();page=1;render()};document.getElementById('cat').onchange=e=>{cat=e.target.value;page=1;render()};init();</script></body></html>
