<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محصولات | عظیم ابزار</title><style>body{margin:0;background:#0b0d0c;color:#f5f5f5;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1320px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:24px;font-weight:900}.badge{background:#f5b900;color:#111;padding:7px 11px;border-radius:9px;font-weight:900}.source{margin:10px 0 16px;padding:10px 12px;background:#111513;border:1px solid #2e342f;border-radius:10px;color:#b9bfbb;font-size:12px}.tools{margin:18px 0 10px}input{width:100%;height:46px;box-sizing:border-box;background:#151917;border:1px solid #353b37;border-radius:10px;color:#fff;padding:0 13px;font:inherit}.status{color:#a7ada9;margin:10px 0 16px}.status b{color:#f5b900}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#151917;border:1px solid #303632;border-radius:15px;padding:12px;overflow:hidden;min-height:330px;display:flex;flex-direction:column}.photo{width:100%;aspect-ratio:1/1;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:9px}.photo img{width:100%;height:100%;object-fit:contain;display:block}.name{font-size:15px;font-weight:800;line-height:1.8;margin:7px 0}.code{font-size:10px;color:#727973;margin-top:8px}.missing{font-size:11px;color:#9d3333;background:#fff;padding:15px;border-radius:8px;text-align:center}.pages{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:28px 0}.pages button{background:#171b19;border:1px solid #3a403c;color:#fff;border-radius:8px;padding:8px 11px;cursor:pointer}.pages button.active{background:#f5b900;color:#111}.empty{grid-column:1/-1;padding:45px;text-align:center;color:#9ea6a0}@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.grid{grid-template-columns:1fr}.brand{font-size:20px}}</style></head><body><main class="wrap"><div class="top"><div class="brand"><a href="./" style="color:inherit;text-decoration:none">عظیم ابزار</a> — محصولات</div><div class="badge" id="badge">در حال بارگذاری</div></div><div class="source">۹۰۶ محصول با نگاشت اصلی تصویر نمایش داده می‌شوند؛ شناسه Pxxxx از کاتالوگ تصویری گرفته شده و نام همان تصویر نمایش داده می‌شود.</div><div class="tools"><input id="q" placeholder="جستجوی نام یا شناسه محصول..."></div><div id="status" class="status">در حال آماده‌سازی محصولات...</div><div id="grid" class="grid"></div><div id="pages" class="pages"></div></main><script>const IMAGE_DIR='./catalog_site_mapping_908/images/';const PER=36,LIMIT=906;let all=[],q='',page=1;const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const fmt=n=>new Intl.NumberFormat('fa-IR').format(Number(n)||0);function parseCSV(t){t=String(t||'').replace(/^\uFEFF/,'');const out=[];let row=[],cell='',quoted=false;for(let i=0;i<t.length;i++){const c=t[i];if(quoted){if(c==='\"'){if(t[i+1]==='\"'){cell+='\"';i++}else quoted=false}else cell+=c}else{if(c==='\"')quoted=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell);out.push(row);row=[];cell=''}else if(c!=='\r')cell+=c}}row.push(cell);if(row.length>1||row[0])out.push(row);return out}async function init(){const t=await fetch('./catalog_site_mapping_908/products.csv?image-map=906',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('نگاشت اصلی تصاویر پیدا نشد');return r.text()});const rows=parseCSV(t).slice(1).filter(r=>/^P\d{4}$/.test(r[0])).slice(0,LIMIT);if(rows.length!==LIMIT)throw new Error('نگاشت ۹۰۶ محصول کامل نیست: '+rows.length);all=rows.map(r=>({id:r[0],name:String(r[1]||'').trim()}));if(all.some(x=>!x.name))throw new Error('نام محصولی در نگاشت تصویر خالی است');render()}function render(){document.getElementById('badge').textContent=fmt(all.length)+' محصول';const z=q.toLocaleLowerCase('fa'),a=all.filter(x=>!z||(`${x.id} ${x.name}`).toLocaleLowerCase('fa').includes(z)),total=Math.max(1,Math.ceil(a.length/PER));if(page>total)page=total;const rows=a.slice((page-1)*PER,page*PER);document.getElementById('status').innerHTML=`نمایش <b>${fmt(rows.length)}</b> از <b>${fmt(a.length)}</b> محصول · مجموع <b>${fmt(all.length)}</b> محصول`;document.getElementById('grid').innerHTML=rows.length?rows.map(x=>`<article class="card"><div class="photo"><img src="${IMAGE_DIR+x.id}.jpg" alt="${esc(x.name)}" loading="lazy" onerror="this.outerHTML='<div class=\'missing\'>تصویر ${esc(x.id)} موجود نیست</div>'"></div><div class="name">${esc(x.name)}</div><div class="code">شناسه ${esc(x.id)}</div></article>`).join(''):'<div class="empty">محصولی پیدا نشد.</div>';const p=document.getElementById('pages');p.innerHTML='';for(let i=Math.max(1,page-2);i<=Math.min(total,page+2);i++){const b=document.createElement('button');b.textContent=fmt(i);if(i===page)b.className='active';b.onclick=()=>{page=i;render();scrollTo({top:0,behavior:'smooth'})};p.appendChild(b)}}document.getElementById('q').oninput=e=>{q=e.target.value.trim();page=1;render()};init().catch(e=>document.getElementById('status').textContent='خطا: '+(e?.message||e));</script><!-- AZIM-906-IMAGE-MAPPING-AUTHORITATIVE --></body></html>
